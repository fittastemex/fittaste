    const unid=unidades.find(u=>u.clave===editData.unidad_clave);
    const updates={articulo:editData.articulo.toUpperCase().trim(),costo_referencia:editData.costo_referencia,proveedor_id:editData.proveedor_id,notas:editData.notas||null,aplica_iva:editData.aplica_iva,inventario_almacen_id:editData.inv_id||null,insumo_id:editData.insumo_id||null,contenido:parseFloat(editData.contenido)||1};
    if(unid)updates.unidad_id=unid.id;
    const res=await sbPatch("catalogo",p.id,updates);
    if(res){
      const prov=proveedores.find(pr=>pr.id===editData.proveedor_id);
      setCatalogo(catalogo.map(c=>c.id===p.id?{...c,articulo:editData.articulo.toUpperCase().trim(),costo_referencia:parseFloat(editData.costo_referencia),proveedor_id:editData.proveedor_id,proveedor_nombre:prov?.nombre||c.proveedor_nombre,unidad_clave:editData.unidad_clave,notas:editData.notas,aplica_iva:editData.aplica_iva,inv_id:editData.inv_id||null,insumo_id:editData.insumo_id||null,contenido:parseFloat(editData.contenido)||1}:c));
      setMsg(`${editData.articulo.toUpperCase().trim()} actualizado`);
    }else{setMsg("Error al guardar");}
    setEditing(null);setSaving(false);
    setTimeout(()=>setMsg(null),3000);
  };

  const saveNew=async()=>{
    if(!newItem.sku||!newItem.articulo||!newItem.proveedor_id){setMsg("Completa SKU, artículo y proveedor");return;}
    setSaving(true);setMsg(null);
    const unid=unidades.find(u=>u.clave===newItem.unidad_clave);
    if(!unid){setMsg(`Error: unidad "${newItem.unidad_clave}" no encontrada. Recarga la página.`);setSaving(false);return;}
    // v7.2: cada producto nuevo del catálogo nace con su insumo base (contenido=1);
    // si es una presentación de un insumo existente, se re-apunta después con Editar.
    const esGasto=newItem.tipo_producto==="LIMPIEZA";
    const insRes=await sbPost("insumos",{nombre:newItem.articulo.toUpperCase().trim(),unidad_base:newItem.unidad_clave,tipo_control:esGasto?"gasto":"inventariable",categoria_gasto:esGasto?"Limpieza":null});
    const insumoId=insRes&&insRes[0]?insRes[0].id:null;
    if(insumoId)setInsumos(prev=>[...prev,insRes[0]]);
    const data={sku:newItem.sku,articulo:newItem.articulo.toUpperCase(),tipo_producto:newItem.tipo_producto,unidad_id:unid.id,costo_referencia:newItem.costo_referencia||0,proveedor_id:newItem.proveedor_id,notas:newItem.notas||null,activo:true,insumo_id:insumoId,contenido:1};
    const res=await sbPost("catalogo",data);
    if(res&&res[0]){
      const prov=proveedores.find(pr=>pr.id===newItem.proveedor_id);
      setCatalogo([...catalogo,{id:res[0].id,sku:newItem.sku,articulo:newItem.articulo.toUpperCase(),tipo_producto:newItem.tipo_producto,unidad_clave:newItem.unidad_clave,costo_referencia:parseFloat(newItem.costo_referencia),proveedor_id:newItem.proveedor_id,proveedor_nombre:prov?.nombre||"?",notas:newItem.notas,aplica_iva:true,inv_id:res[0].inventario_almacen_id||null,insumo_id:insumoId,contenido:1}]);
      setMsg(`${newItem.articulo} agregado`);
      setNewItem({sku:genCatSku(newItem.tipo_producto),articulo:"",tipo_producto:newItem.tipo_producto,unidad_clave:"kg",costo_referencia:0,proveedor_id:"",notas:""});
      setAdding(false);
    }else{setMsg("Error al agregar — verifica los datos e intenta de nuevo");}
    setSaving(false);
    setTimeout(()=>setMsg(null),3000);
  };

  return(<div>
    <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div><h2 className="text-lg font-bold text-gray-900">Catálogo</h2><p className="text-sm text-gray-500">{catalogo.length} productos · {proveedores.length} proveedores</p></div>
      <div className="flex gap-2">
        {catTab==="productos"&&<Btn onClick={()=>{if(!adding){setNewItem({sku:genCatSku("VERDURA"),articulo:"",tipo_producto:"VERDURA",unidad_clave:"kg",costo_referencia:0,proveedor_id:"",notas:""});}setAdding(!adding);}}>{adding?"Cancelar":"+ Nuevo SKU"}</Btn>}
        {catTab==="proveedores"&&<Btn onClick={()=>setAddingProv(!addingProv)}>{addingProv?"Cancelar":"+ Nuevo proveedor"}</Btn>}
      </div>
    </div>

    <div className="flex gap-1 mb-4">
      <button onClick={()=>{setCatTab("productos");setAddingProv(false);}} className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all ${catTab==="productos"?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={catTab==="productos"?{background:"#e2a52a"}:{}}>Productos ({catalogo.length})</button>
      <button onClick={()=>{setCatTab("proveedores");setAdding(false);}} className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all ${catTab==="proveedores"?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={catTab==="proveedores"?{background:"#d6816c"}:{}}>Proveedores ({proveedores.length})</button>
      <button onClick={()=>{setCatTab("insumos");setAdding(false);setAddingProv(false);}} className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all ${catTab==="insumos"?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={catTab==="insumos"?{background:"#77b7b4"}:{}}>Insumos ({insumos.length})</button>
    </div>

    {msg&&<div className={`rounded-xl p-3 mb-4 text-sm font-medium ${msg.includes("Error")||msg.includes("No se puede")?"bg-red-50 text-red-800 border border-red-200":"bg-emerald-50 text-emerald-800 border border-emerald-200"}`}>{msg}</div>}

    {/* ===== PRODUCTOS TAB ===== */}
    {catTab==="productos"&&<div>
    {adding&&<div className="bg-white border-2 border-amber-300 rounded-xl p-4 mb-4">
      <h3 className="text-sm font-bold text-gray-700 mb-3">Agregar nuevo producto</h3>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
        <div><label className="text-xs text-gray-500 block mb-1">SKU <span className="text-amber-600">(auto)</span></label><input className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm bg-gray-50 text-gray-600" value={newItem.sku} readOnly/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Artículo</label><input className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-amber-400" placeholder="NOMBRE DEL PRODUCTO" value={newItem.articulo} onChange={e=>setNewItem({...newItem,articulo:e.target.value})}/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Tipo</label><select className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={newItem.tipo_producto} onChange={e=>{const t=e.target.value;setNewItem({...newItem,tipo_producto:t,sku:genCatSku(t)});}}>{tipos.map(t=><option key={t} value={t}>{t}</option>)}<option value="OTRO">OTRO</option></select></div>
        <div><label className="text-xs text-gray-500 block mb-1">Unidad</label><select className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={newItem.unidad_clave} onChange={e=>setNewItem({...newItem,unidad_clave:e.target.value})}>{unidades.map(u=><option key={u.clave} value={u.clave}>{u.nombre} ({u.clave})</option>)}</select></div>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div><label className="text-xs text-gray-500 block mb-1">Costo referencia</label><input type="number" step="0.01" className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-amber-400" value={newItem.costo_referencia||""} onChange={e=>setNewItem({...newItem,costo_referencia:parseFloat(e.target.value)||0})}/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Proveedor</label><select className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={newItem.proveedor_id} onChange={e=>setNewItem({...newItem,proveedor_id:e.target.value})}><option value="">Seleccionar...</option>{proveedores.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}</select></div>
        <div><label className="text-xs text-gray-500 block mb-1">Notas</label><input className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="Opcional" value={newItem.notas} onChange={e=>setNewItem({...newItem,notas:e.target.value})}/></div>
        <div className="flex items-end"><Btn onClick={saveNew} disabled={saving}>{saving?"Guardando...":"Guardar producto"}</Btn></div>
      </div>
    </div>}
    <div className="flex gap-2 mb-4">
      <input className="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-400" placeholder="Buscar por SKU, artículo, tipo..." value={filter} onChange={e=>setFilter(e.target.value)}/>
      <select className="border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white" value={filterProv} onChange={e=>setFilterProv(e.target.value)}>
        <option value="">Todos los proveedores</option>
        {proveedores.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}
      </select>
    </div>
    <div className="overflow-x-auto rounded-xl border border-gray-200 bg-white">
      <table className="w-full text-sm"><thead className="bg-gray-50"><tr>
        {["SKU","Artículo","Tipo","Unidad","Costo ref","IVA","Insumo / contenido","Proveedor","Almacén","Notas",""].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${h==="Costo ref"?"text-right":h==="IVA"?"text-center":"text-left"}`}>{h}</th>)}
      </tr></thead><tbody>{filtered.map(p=>{
        const isEditing=editing===p.id;
        return(<tr key={p.id} className={`border-t border-gray-100 ${isEditing?"bg-amber-50":""}`}>
          <td className="px-3 py-2 font-mono text-xs text-gray-500">{p.sku}</td>
          <td className="px-3 py-2 font-medium text-gray-900">{isEditing?<input className="w-full border border-amber-300 rounded px-1 py-0.5 text-sm bg-amber-50 font-medium focus:ring-2 focus:ring-amber-400" value={editData.articulo} onChange={e=>setEditData({...editData,articulo:e.target.value})}/>:p.articulo}</td>
          <td className="px-3 py-2"><Badge v={({PROTEINAS:"danger",SUPLEMENTO:"purple",EMPAQUE:"info",FRUTA:"warning"})[p.tipo_producto]||"success"}>{p.tipo_producto}</Badge></td>
          <td className="px-3 py-2">{isEditing?<select className="border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" value={editData.unidad_clave} onChange={e=>setEditData({...editData,unidad_clave:e.target.value})}>{unidades.map(u=><option key={u.clave} value={u.clave}>{u.clave}</option>)}</select>:<span className="text-gray-600">{p.unidad_clave}</span>}</td>
          <td className="px-3 py-2 text-right">{isEditing?<input type="number" step="0.01" className="w-24 text-right border border-amber-300 rounded px-1 py-0.5 text-sm bg-amber-50 focus:ring-2 focus:ring-amber-400" value={editData.costo_referencia} onChange={e=>setEditData({...editData,costo_referencia:parseFloat(e.target.value)||0})}/>:<span className="font-semibold text-gray-800">{fmt(p.costo_referencia)}</span>}</td>
          <td className="px-3 py-2 text-center">{isEditing?<label className="flex items-center justify-center gap-1 cursor-pointer"><input type="checkbox" checked={editData.aplica_iva} onChange={e=>setEditData({...editData,aplica_iva:e.target.checked})} className="w-4 h-4 rounded border-amber-300 text-amber-500 focus:ring-amber-400"/><span className="text-xs">{editData.aplica_iva?"Sí":"No"}</span></label>:p.aplica_iva?<span className="text-xs text-gray-500">16%</span>:<span className="text-xs text-emerald-600 font-semibold">Exento</span>}</td>
          <td className="px-3 py-2">{isEditing?<div className="flex gap-1 items-center"><select className="border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" style={{maxWidth:"110px"}} value={editData.insumo_id||""} onChange={e=>setEditData({...editData,insumo_id:e.target.value})}><option value="">Sin insumo</option>{insumos.map(x=><option key={x.id} value={x.id}>{x.nombre}</option>)}</select><span className="text-xs text-gray-400">×</span><input type="number" min="0" step="0.01" className="w-16 border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50 text-right" title="Contenido: unidades base por unidad de compra" value={editData.contenido} onChange={e=>setEditData({...editData,contenido:e.target.value})}/></div>:(()=>{const ins=insumos.find(x=>x.id===p.insumo_id);return ins?<span className="text-xs text-gray-600">{ins.nombre} <span className="text-teal-600 font-semibold">×{p.contenido} {ins.unidad_base}</span>{ins.tipo_control==="gasto"&&<Badge v="default">gasto</Badge>}</span>:<span className="text-xs text-red-500 font-medium">sin insumo</span>;})()}</td>
          <td className="px-3 py-2">{isEditing?<select className="border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" value={editData.proveedor_id} onChange={e=>setEditData({...editData,proveedor_id:e.target.value})}>{proveedores.map(pr=><option key={pr.id} value={pr.id}>{pr.nombre}</option>)}</select>:<span className="text-gray-600 text-xs">{p.proveedor_nombre}</span>}</td>
          <td className="px-3 py-2">{isEditing?<select className="border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" value={editData.inv_id||""} onChange={e=>setEditData({...editData,inv_id:e.target.value||null})}><option value="">Sin vincular</option>{inventario.map(i=><option key={i.id} value={i.id}>{i.descripcion} ({i.unidad_clave})</option>)}</select>:p.inv_id?<span className="text-xs text-teal-600 font-medium">{inventario.find(i=>i.id===p.inv_id)?.descripcion||"Vinculado"}</span>:<span className="text-xs text-gray-400">—</span>}</td>
          <td className="px-3 py-2">{isEditing?<input className="w-full border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" value={editData.notas} onChange={e=>setEditData({...editData,notas:e.target.value})}/>:<span className="text-gray-400 text-xs">{p.notas||""}</span>}</td>
          <td className="px-3 py-2 text-right">{isEditing?<div className="flex gap-1"><button onClick={()=>saveEdit(p)} disabled={saving} className="text-xs bg-emerald-500 text-white px-2 py-1 rounded hover:bg-emerald-600">{saving?"...":"Guardar"}</button><button onClick={()=>setEditing(null)} className="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded hover:bg-gray-300">X</button></div>:<div className="flex gap-1"><button onClick={()=>startEdit(p)} className="text-xs text-amber-700 hover:text-amber-900 font-medium hover:bg-amber-100 px-2 py-1 rounded">Editar</button><button onClick={()=>handleDelete(p)} className="text-xs text-red-400 hover:text-red-600 hover:bg-red-50 px-2 py-1 rounded" title="Eliminar">✕</button></div>}</td>
        </tr>);})}</tbody></table>
    </div>
    <p className="text-xs text-gray-400 mt-2 text-right">Mostrando {filtered.length} de {catalogo.length} productos</p>
    </div>}

    {/* ===== PROVEEDORES TAB ===== */}
    {catTab==="proveedores"&&<div>
    {addingProv&&<div className="bg-white border-2 rounded-xl p-4 mb-4" style={{borderColor:"#d6816c"}}>
      <h3 className="text-sm font-bold text-gray-700 mb-3">Agregar nuevo proveedor</h3>
      <div className="flex gap-3 items-end flex-wrap">
        <div className="flex-1"><label className="text-xs text-gray-500 block mb-1">Nombre</label><input className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="Nombre del proveedor" value={newProv.nombre} onChange={e=>setNewProv({...newProv,nombre:e.target.value})}/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Tipo de flujo</label><select className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={newProv.tipo_flujo_id} onChange={e=>setNewProv({...newProv,tipo_flujo_id:e.target.value})}><option value="">Seleccionar...</option>{(flujos||[]).map(f=><option key={f.id} value={f.id}>{f.nombre}</option>)}</select></div>
        <Btn onClick={handleAddProv} disabled={saving||!newProv.nombre.trim()||!newProv.tipo_flujo_id}>{saving?"Guardando...":"Agregar"}</Btn>
      </div>
      <p className="text-xs text-gray-400 mt-2">Commodity = proveedor captura precios · Compra manual = Compras captura · Almacen interno = lotes PEPS · Directo = Sucursal paga</p>
    </div>}
    <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
      <table className="w-full text-sm"><thead className="bg-gray-50"><tr>
        {["Nombre","Tipo de flujo","Quién captura precio","SKUs asignados",""].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${h==="SKUs asignados"?"text-center":"text-left"}`}>{h}</th>)}
      </tr></thead><tbody>{proveedores.map(p=>{
        const isEP=editingProvId===p.id;
        const skuCount=catalogo.filter(c=>c.proveedor_id===p.id).length;
        return(<tr key={p.id} className={`border-t border-gray-100 ${isEP?"bg-amber-50":"hover:bg-gray-50"}`}>
          <td className="px-3 py-2 font-medium text-gray-900">{isEP?<input className="w-full border border-amber-300 rounded px-2 py-0.5 text-sm bg-amber-50" value={editProvData.nombre} onChange={e=>setEditProvData({...editProvData,nombre:e.target.value})}/>:p.nombre}</td>
          <td className="px-3 py-2">{isEP?<select className="border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" value={editProvData.tipo_flujo_id} onChange={e=>setEditProvData({...editProvData,tipo_flujo_id:e.target.value})}>{(flujos||[]).map(f=><option key={f.id} value={f.id}>{f.nombre}</option>)}</select>:<Badge v={p.tipo_flujo==="Commodity"?"commodity":p.tipo_flujo==="Compra manual"?"manual":p.tipo_flujo==="Directo"?"warning":"almacen"}>{p.tipo_flujo}</Badge>}</td>
          <td className="px-3 py-2 text-gray-600 text-xs">{p.quien_captura}</td>
          <td className="px-3 py-2 text-center"><span className={`text-xs font-medium ${skuCount>0?"text-gray-800":"text-gray-400"}`}>{skuCount}</span></td>
          <td className="px-3 py-2 text-right">{isEP?<div className="flex gap-1"><button onClick={()=>saveEditProv(p)} disabled={saving} className="text-xs bg-emerald-500 text-white px-2 py-1 rounded">{saving?"...":"Guardar"}</button><button onClick={()=>setEditingProvId(null)} className="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded">X</button></div>:<div className="flex gap-1"><button onClick={()=>startEditProv(p)} className="text-xs text-amber-700 hover:text-amber-900 font-medium hover:bg-amber-100 px-2 py-1 rounded">Editar</button><button onClick={()=>handleDeleteProv(p)} className="text-xs text-red-400 hover:text-red-600 hover:bg-red-50 px-2 py-1 rounded" title="Eliminar">✕</button></div>}</td>
        </tr>);})}</tbody></table>
    </div>
    <p className="text-xs text-gray-400 mt-2 text-right">{proveedores.length} proveedores activos</p>
    </div>}

    {/* ===== INSUMOS TAB (v7.2) ===== */}
    {catTab==="insumos"&&<div>
    <div className="bg-teal-50 border border-teal-200 rounded-xl p-3 mb-4 text-xs text-teal-800">
      El <b>insumo</b> es el ingrediente genérico (CREMA en ml) que usan recetas e inventario; las <b>presentaciones</b> (Crema Lala 900 ml) son los renglones de la pestaña Productos. Para fusionar marcas: en Productos, edita cada presentación y apúntala al mismo insumo con su contenido (ej. ×900 ml). Los insumos tipo <b>gasto</b> (jabón, fibras) no llevan inventario: su costo se registra como gasto operativo al recibirse.
    </div>
    <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
      <table className="w-full text-sm"><thead className="bg-gray-50"><tr>
        {["Insumo","Unidad base","Control","Categoría gasto","Presentaciones","Costo/unidad",""].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${["Presentaciones","Costo/unidad"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}
      </tr></thead><tbody>{insumos.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(x=>{
        const isE=editingIns===x.id;
        const nPres=catalogo.filter(c=>c.insumo_id===x.id).length;
        return(<tr key={x.id} className={`border-t border-gray-100 ${isE?"bg-teal-50":"hover:bg-gray-50"}`}>
          <td className="px-3 py-2 font-medium text-gray-900">{isE?<input className="w-full border border-teal-400 rounded px-1 py-0.5 text-sm bg-teal-50" value={editInsData.nombre} onChange={e=>setEditInsData({...editInsData,nombre:e.target.value})}/>:x.nombre}</td>
          <td className="px-3 py-2">{isE?<select className="border border-teal-400 rounded px-1 py-0.5 text-xs bg-teal-50" value={editInsData.unidad_base} onChange={e=>setEditInsData({...editInsData,unidad_base:e.target.value})}>{["ml","g","kg","lt","pz","paq","porcion"].map(u=><option key={u} value={u}>{u}</option>)}</select>:<span className="text-gray-600">{x.unidad_base}</span>}</td>
          <td className="px-3 py-2">{isE?<select className="border border-teal-400 rounded px-1 py-0.5 text-xs bg-teal-50" value={editInsData.tipo_control} onChange={e=>setEditInsData({...editInsData,tipo_control:e.target.value})}><option value="inventariable">Inventariable</option><option value="gasto">Gasto directo</option></select>:<Badge v={x.tipo_control==="gasto"?"default":"almacen"}>{x.tipo_control==="gasto"?"Gasto directo":"Inventariable"}</Badge>}</td>
          <td className="px-3 py-2">{isE&&editInsData.tipo_control==="gasto"?<input className="w-24 border border-teal-400 rounded px-1 py-0.5 text-xs bg-teal-50" placeholder="Limpieza" value={editInsData.categoria_gasto||""} onChange={e=>setEditInsData({...editInsData,categoria_gasto:e.target.value})}/>:<span className="text-xs text-gray-500">{x.tipo_control==="gasto"?(x.categoria_gasto||"—"):"—"}</span>}</td>
          <td className="px-3 py-2 text-right"><span className={`text-xs font-medium ${nPres>0?"text-gray-800":"text-red-500"}`}>{nPres}</span></td>
          <td className="px-3 py-2 text-right text-xs text-gray-600">{(()=>{const pres=catalogo.filter(c=>c.insumo_id===x.id&&parseFloat(c.costo_referencia)>0);return pres.length>0?`${fmt(Math.min(...pres.map(c=>parseFloat(c.costo_referencia)/(parseFloat(c.contenido)||1))))}/${x.unidad_base}`:"—";})()}</td>
          <td className="px-3 py-2 text-right">{isE?<div className="flex gap-1 justify-end"><button onClick={()=>saveIns(x)} disabled={saving} className="text-xs bg-emerald-500 text-white px-2 py-1 rounded">{saving?"...":"Guardar"}</button><button onClick={()=>setEditingIns(null)} className="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded">X</button></div>:<div className="flex gap-1 justify-end"><button onClick={()=>{setEditingIns(x.id);setEditInsData({nombre:x.nombre,unidad_base:x.unidad_base,tipo_control:x.tipo_control,categoria_gasto:x.categoria_gasto||""});}} className="text-xs text-amber-700 hover:bg-amber-100 px-2 py-1 rounded">Editar</button><button onClick={()=>delIns(x)} className="text-xs text-red-400 hover:text-red-600 hover:bg-red-50 px-2 py-1 rounded">✕</button></div>}</td>
        </tr>);})}</tbody></table>
    </div>
    <p className="text-xs text-gray-400 mt-2 text-right">{insumos.length} insumos activos · Si cambias la unidad base de un insumo con historial, recalibra sus recetas</p>
    </div>}
  </div>);
}

// ======================== RECEPCIÓN DE MERCANCÍA (Sucursal) ========================
function RecepcionView({pedidos,pedidoDetalle,proveedores,provEstatus,catalogo,recepciones,recepcionDetalle,onRecibir}){
  const [recibiendo,setRecibiendo]=useState(null); // {pedId, provId}
  const [cantRecibida,setCantRecibida]=useState({});
  const [notasRecep,setNotasRecep]=useState({});
  const [saving,setSaving]=useState(false);

  // Pedidos con proveedores pendientes de recepción
  const pendientes=[];
  pedidos.forEach(p=>{
    if(p.estatus==="cerrado")return;
    provEstatus.filter(pe=>pe.pedido_id===p.id).forEach(pe=>{
      if(!["enviado","precios_capturados","completo","surtido"].includes(pe.estatus))return;
      const yaRecibido=recepciones.some(r=>r.pedido_id===p.id&&r.proveedor_id===pe.proveedor_id);
      if(yaRecibido)return;
      const prov=proveedores.find(pr=>pr.id===pe.proveedor_id);
      const items=pedidoDetalle.filter(d=>d.pedido_id===p.id&&d.proveedor_id===pe.proveedor_id);
      if(items.length>0)pendientes.push({pedido:p,proveedor:prov,pe,items});
    });
  });

  // Recientes (ya recibidos)
  const recientes=recepciones.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,10);

  const startRecibir=(pedId,provId,items)=>{
    setRecibiendo({pedId,provId});
    const c={};const n={};
    items.forEach(d=>{c[d.id]=d.cantidad;n[d.id]="";});
    setCantRecibida(c);setNotasRecep(n);
  };

  const confirmarRecepcion=async()=>{
    if(!recibiendo||saving)return;
    setSaving(true);
    const{pedId,provId}=recibiendo;
    const items=pedidoDetalle.filter(d=>d.pedido_id===pedId&&d.proveedor_id===provId);
    const hayFaltante=items.some(d=>(cantRecibida[d.id]||0)!==d.cantidad);
    const estatus=hayFaltante?"con_faltantes":"completo";
    await onRecibir(pedId,provId,estatus,items.map(d=>({pedido_detalle_id:d.id,cantidad_pedida:d.cantidad,cantidad_esperada:d.cantidad,cantidad_recibida:cantRecibida[d.id]||0,tiene_discrepancia:(cantRecibida[d.id]||0)!==d.cantidad,nota:notasRecep[d.id]||null})));
    setRecibiendo(null);setSaving(false);
  };

  if(recibiendo){
    const{pedId,provId}=recibiendo;
    const ped=pedidos.find(p=>p.id===pedId);
    const prov=proveedores.find(p=>p.id===provId);
    const items=pedidoDetalle.filter(d=>d.pedido_id===pedId&&d.proveedor_id===provId);
    const hayFaltante=items.some(d=>(cantRecibida[d.id]||0)!==d.cantidad);
    const todoOk=items.every(d=>(cantRecibida[d.id]||0)===d.cantidad);
    return(<div>
      <button onClick={()=>setRecibiendo(null)} className="text-sm text-gray-500 hover:text-gray-700 mb-4">← Volver</button>
      <div className="flex items-center justify-between mb-4"><div><h2 className="text-lg font-bold text-gray-900">Recepción — {prov?.nombre}</h2><p className="text-sm text-gray-500">Pedido {ped?.numero_pedido} — Valida cantidades recibidas</p></div>
        {todoOk&&<Badge v="success">Todo coincide</Badge>}
        {hayFaltante&&<Badge v="warning">Hay diferencias</Badge>}
      </div>
      <div className="bg-white border border-gray-200 rounded-xl overflow-hidden mb-4"><table className="w-full text-sm"><thead className="bg-gray-50"><tr>
        {["Artículo","Esperado","Recibido","Nota"].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${h==="Esperado"||h==="Recibido"?"text-center":"text-left"}`}>{h}</th>)}
      </tr></thead><tbody>{items.map(d=>{
        const cat=catalogo.find(c=>c.id===d.catalogo_id)||{};
        const esperado=d.cantidad;
        const recibido=cantRecibida[d.id]||0;
        const diff=recibido!==esperado;
        return(<tr key={d.id} className={`border-t border-gray-100 ${diff?"bg-orange-50":""}`}>
          <td className="px-3 py-2 font-medium text-gray-900">{cat.articulo} <span className="text-gray-400 text-xs">{cat.unidad_clave}</span></td>
          <td className="px-3 py-2 text-center text-gray-500">{cat.unidad_clave==="kg"?fmtQ(esperado,"kg"):esperado}</td>
          <td className="px-3 py-2 text-center"><input type="number" min="0" step={cat.unidad_clave==="kg"?"0.25":"1"} className={`w-20 text-center border rounded-lg px-1 py-1 text-sm ${diff?"border-orange-400 bg-orange-50":"border-gray-200"}`} value={cantRecibida[d.id]||""} onChange={e=>setCantRecibida({...cantRecibida,[d.id]:parseFloat(e.target.value)||0})}/></td>
          <td className="px-3 py-2"><input className="w-full border border-gray-200 rounded-lg px-2 py-1 text-xs" placeholder="Nota opcional" value={notasRecep[d.id]||""} onChange={e=>setNotasRecep({...notasRecep,[d.id]:e.target.value})}/></td>
        </tr>);})}</tbody></table></div>
      {hayFaltante&&<div className="bg-orange-50 border border-orange-200 rounded-xl p-3 mb-3"><p className="text-sm font-semibold text-orange-800">Artículos con diferencias:</p><div className="text-xs text-orange-700 mt-1">{items.filter(d=>(cantRecibida[d.id]||0)!==d.cantidad).map(d=>{const cat=catalogo.find(c=>c.id===d.catalogo_id)||{};return<p key={d.id}>{cat.articulo}: esperado {d.cantidad} → recibido {cantRecibida[d.id]||0}</p>;})}</div></div>}
      <div className="flex justify-end gap-2">
        <Btn onClick={()=>{const c={};items.forEach(d=>{c[d.id]=d.cantidad;});setCantRecibida(c);}} color="amber">Todo correcto</Btn>
        <Btn onClick={confirmarRecepcion} disabled={saving} color="green">{saving?"Guardando...":hayFaltante?"Confirmar con faltantes":"Recepción completa ✓"}</Btn>
      </div>
    </div>);
  }

  return(<div>
    <h2 className="text-lg font-bold text-gray-900 mb-1">Recepción de mercancía</h2>
    <p className="text-sm text-gray-500 mb-4">Valida que la mercancía llegó completa</p>
    {pendientes.length===0&&recientes.length===0&&<div className="bg-white border border-gray-200 rounded-xl p-8 text-center"><p className="text-gray-400">No hay recepciones pendientes</p></div>}
    {pendientes.length>0&&<div className="rounded-xl p-4 border-2 border-amber-300 bg-amber-50 mb-4"><h3 className="text-sm font-bold text-amber-800 mb-3">Pendientes de recepción ({pendientes.length})</h3>
      {pendientes.map((p,i)=>{const tot=p.items.reduce((s,d)=>s+d.cantidad*(d.costo_real||d.costo_referencia),0);return(<div key={i} className="bg-white rounded-xl p-3 mb-2 border border-amber-200"><div className="flex justify-between items-center mb-2"><div><span className="font-bold text-gray-900">Pedido {p.pedido.numero_pedido}</span><span className="text-xs text-gray-500 ml-2">{p.proveedor?.nombre}</span><span className="text-xs text-gray-400 ml-2">{p.items.length} artículos</span></div><div className="flex items-center gap-2"><span className="text-sm font-semibold text-gray-700">{fmt(tot)}</span><Btn onClick={()=>startRecibir(p.pedido.id,p.proveedor?.id,p.items)}>Recibir mercancía</Btn></div></div>
        <div className="text-xs text-gray-600">{p.items.map(d=>{const cat=catalogo.find(c=>c.id===d.catalogo_id)||{};return<span key={d.id} className="inline-block bg-gray-100 rounded px-2 py-0.5 mr-1 mb-1">{cat.articulo} ({cat.unidad_clave==="kg"?fmtQ(d.cantidad,"kg"):d.cantidad+" "+cat.unidad_clave})</span>})}</div>
      </div>);})}
    </div>}
    {recientes.length>0&&<div className="rounded-xl p-4 border border-emerald-200 bg-emerald-50"><h3 className="text-sm font-bold text-emerald-800 mb-3">Recepciones recientes</h3>
      {recientes.map(r=>{const ped=pedidos.find(p=>p.id===r.pedido_id);const prov=proveedores.find(p=>p.id===r.proveedor_id);return(<div key={r.id} className="flex items-center justify-between py-2 border-b border-emerald-100 last:border-0"><div className="flex items-center gap-2"><span className="font-medium text-gray-800">Pedido {ped?.numero_pedido}</span><span className="text-xs text-gray-500">{prov?.nombre}</span></div><div className="flex items-center gap-2"><Badge v={r.estatus==="completo"?"success":"warning"}>{r.estatus==="completo"?"Completo":"Con faltantes"}</Badge><span className="text-xs text-gray-400">{new Date(r.created_at).toLocaleDateString("es-MX")}</span></div></div>);})}
    </div>}
  </div>);
}

// ======================== FINANZAS CxP ========================
function FinanzasView({cxp,setCxp,pagos,setPagos,pedidos,proveedores,pedidoDetalle,catalogo}){
  const [tab,setTab]=useState("pendientes");
  const [editingCxp,setEditingCxp]=useState(null);
  const [editFact,setEditFact]=useState({numero:"",fecha:""});
  const [newPago,setNewPago]=useState({cxp_id:"",monto:0,metodo:"transferencia",referencia:"",notas:""});
  const [saving,setSaving]=useState(false);

  const pendientes=cxp.filter(c=>c.estatus!=="pagado");
  const pagados=cxp.filter(c=>c.estatus==="pagado");
  const totalAdeudado=pendientes.reduce((s,c)=>s+(parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0)),0);
  const totalPagadoMes=pagos.filter(p=>{const f=p.fecha_pago||p.created_at?.split("T")[0];const hoy=new Date();const mesInicio=new Date(hoy.getFullYear(),hoy.getMonth(),1).toISOString().split("T")[0];return f>=mesInicio;}).reduce((s,p)=>s+parseFloat(p.monto_pagado),0);

  // By proveedor
  const byProv={};
  pendientes.forEach(c=>{const prov=proveedores.find(p=>p.id===c.proveedor_id);const k=prov?.nombre||"?";if(!byProv[k])byProv[k]={total:0,count:0};byProv[k].total+=parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0);byProv[k].count++;});
  const provSorted=Object.entries(byProv).sort((a,b)=>b[1].total-a[1].total);
  const maxProv=provSorted.length>0?provSorted[0][1].total:1;

  const saveFact=async(cxpId)=>{
    setSaving(true);
    await sbPatch("cuentas_por_pagar",cxpId,{numero_factura:editFact.numero||null,fecha_factura:editFact.fecha||null});
    setCxp(cxp.map(c=>c.id===cxpId?{...c,numero_factura:editFact.numero,fecha_factura:editFact.fecha}:c));
    setEditingCxp(null);setSaving(false);
  };

  const registrarPago=async()=>{
    if(!newPago.cxp_id||newPago.monto<=0)return;
    setSaving(true);
    const res=await sbPost("pagos",{cuenta_id:newPago.cxp_id,monto_pagado:newPago.monto,fecha_pago:new Date().toISOString().split("T")[0],metodo_pago:newPago.metodo,referencia:newPago.referencia||null,nota:newPago.notas||null});
    if(res&&res[0]){
      setPagos([...pagos,res[0]]);
      const c=cxp.find(x=>x.id===newPago.cxp_id);
      if(c){
        const nuevoMontoPagado=parseFloat(c.monto_pagado||0)+newPago.monto;
        const nuevoEstatus=nuevoMontoPagado>=parseFloat(c.monto_total)?"pagado":"parcial";
        await sbPatch("cuentas_por_pagar",c.id,{monto_pagado:nuevoMontoPagado,estatus:nuevoEstatus});
        setCxp(cxp.map(x=>x.id===c.id?{...x,monto_pagado:nuevoMontoPagado,estatus:nuevoEstatus}:x));
      }
      setNewPago({cxp_id:"",monto:0,metodo:"transferencia",referencia:"",notas:""});
      alert("Pago registrado");
    }
    setSaving(false);
  };

  const tabs3=[{id:"pendientes",l:`Pendientes (${pendientes.length})`},{id:"pagar",l:"Registrar pago"},{id:"historial",l:"Historial"},{id:"resumen",l:"Resumen"}];

  return(<div>
    <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div><h2 className="text-lg font-bold text-gray-900">Finanzas — Cuentas por Pagar</h2><p className="text-sm text-gray-500">Control de facturas y pagos</p></div>
      <div className="flex gap-3">
        <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-2 text-right"><p className="text-xs text-red-600">Total adeudado</p><p className="text-xl font-bold text-red-700">{fmt(totalAdeudado)}</p></div>
        <div className="bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-2 text-right"><p className="text-xs text-emerald-600">Pagado este mes</p><p className="text-xl font-bold text-emerald-700">{fmt(totalPagadoMes)}</p></div>
      </div>
    </div>

    <div className="flex gap-1 mb-4">{tabs3.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${tab===t.id?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={tab===t.id?{background:"#d6816c"}:{}}>{t.l}</button>)}</div>

    {/* PENDIENTES */}
    {tab==="pendientes"&&<div>{pendientes.length===0?<div className="bg-white border border-gray-200 rounded-xl p-8 text-center"><p className="text-gray-400">Sin cuentas pendientes</p></div>
    :<div className="bg-white border border-gray-200 rounded-xl overflow-hidden"><table className="w-full text-sm"><thead className="bg-gray-50"><tr>
      {["Pedido","Proveedor","Monto","Pagado","Saldo","Factura","Estatus",""].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${["Monto","Pagado","Saldo"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}
    </tr></thead><tbody>{pendientes.map(c=>{
      const ped=pedidos.find(p=>p.id===c.pedido_id);
      const prov=proveedores.find(p=>p.id===c.proveedor_id);
      const saldo=parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0);
      const isEdit=editingCxp===c.id;
      return(<tr key={c.id} className={`border-t border-gray-100 ${isEdit?"bg-amber-50":""}`}>
        <td className="px-3 py-2 font-medium text-gray-800">{ped?.numero_pedido||"—"}</td>
        <td className="px-3 py-2 text-gray-600 text-xs">{prov?.nombre||"?"}</td>
        <td className="px-3 py-2 text-right font-semibold">{fmt(c.monto_total)}</td>
        <td className="px-3 py-2 text-right text-emerald-600">{fmt(c.monto_pagado||0)}</td>
        <td className="px-3 py-2 text-right font-bold text-red-600">{fmt(saldo)}</td>
        <td className="px-3 py-2">{isEdit?<div className="flex gap-1"><input className="w-24 border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" placeholder="# factura" value={editFact.numero} onChange={e=>setEditFact({...editFact,numero:e.target.value})}/><input type="date" className="border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" value={editFact.fecha} onChange={e=>setEditFact({...editFact,fecha:e.target.value})}/><button onClick={()=>saveFact(c.id)} className="text-xs bg-emerald-500 text-white px-2 py-0.5 rounded">✓</button></div>:<span className="text-xs text-gray-500">{c.numero_factura||<button onClick={()=>{setEditingCxp(c.id);setEditFact({numero:c.numero_factura||"",fecha:c.fecha_factura||""});}} className="text-amber-600 hover:text-amber-800 font-medium">+ Factura</button>}</span>}</td>
        <td className="px-3 py-2"><Badge v={c.estatus==="pagado"?"success":c.estatus==="parcial"?"warning":"danger"}>{c.estatus}</Badge></td>
        <td className="px-3 py-2">{!isEdit&&c.numero_factura&&<button onClick={()=>{setEditingCxp(c.id);setEditFact({numero:c.numero_factura||"",fecha:c.fecha_factura||""});}} className="text-xs text-amber-600 hover:text-amber-800">Editar</button>}</td>
      </tr>);})}</tbody></table></div>}</div>}

    {/* REGISTRAR PAGO */}
    {tab==="pagar"&&<div className="bg-white border-2 border-emerald-300 rounded-xl p-4">
      <h3 className="text-sm font-bold text-emerald-800 mb-3">Registrar pago</h3>
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-3">
        <div><label className="text-xs text-gray-500 block mb-1">Cuenta por pagar</label><select className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={newPago.cxp_id} onChange={e=>{setNewPago({...newPago,cxp_id:e.target.value});const c=pendientes.find(x=>x.id===e.target.value);if(c)setNewPago(p=>({...p,cxp_id:e.target.value,monto:parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0)}));}}><option value="">Seleccionar...</option>{pendientes.map(c=>{const ped=pedidos.find(p=>p.id===c.pedido_id);const prov=proveedores.find(p=>p.id===c.proveedor_id);const saldo=parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0);return<option key={c.id} value={c.id}>{ped?.numero_pedido} — {prov?.nombre} — Saldo: {fmt(saldo)}</option>;})}</select></div>
        <div><label className="text-xs text-gray-500 block mb-1">Monto a pagar</label><input type="number" min="0" step="0.01" className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={newPago.monto||""} onChange={e=>setNewPago({...newPago,monto:parseFloat(e.target.value)||0})}/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Método de pago</label><select className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={newPago.metodo} onChange={e=>setNewPago({...newPago,metodo:e.target.value})}><option value="transferencia">Transferencia</option><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option></select></div>
