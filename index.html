// ======================== ESTADOS FINANCIEROS (v7.0) ========================
// Estado de resultados y flujo de efectivo del mes, integrando: ventas de SR,
// costo de ventas por recetas (kárdex de sucursal), merma, gastos operativos,
// CxP/pagos y valor de inventarios. Cifras de venta sin IVA (subtotal).
function EstadosView({ventas,mermas,gastosOp,comprasDirectas,cxp,pagos,inventario,invSucursal,movSucursal,catalogo}){
  const [mesOffset,setMesOffset]=useState(0);
  const now=new Date();
  const mesActual=new Date(now.getFullYear(),now.getMonth()-mesOffset,1);
  const mesNombre=mesActual.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
  const mesInicio=mesActual.toISOString().split("T")[0];
  const mesFin=new Date(mesActual.getFullYear(),mesActual.getMonth()+1,0).toISOString().split("T")[0];
  const enMes=(f)=>f>=mesInicio&&f<=mesFin;

  const vMes=ventas.filter(v=>v.estatus!=="cancelada"&&enMes(v.fecha||""));
  const ventasNetas=vMes.reduce((s,v)=>s+parseFloat(v.subtotal||0),0);
  const ivaVentas=vMes.reduce((s,v)=>s+parseFloat(v.iva||0),0);
  const ventasBrutas=vMes.reduce((s,v)=>s+parseFloat(v.total||0),0);
  const porCanal={};vMes.forEach(v=>{const k=v.canal||"otro";porCanal[k]=(porCanal[k]||0)+parseFloat(v.total||0);});

  // Costo de ventas: kárdex (salida_venta con costo); si no hay movimientos usa el costo teórico de las ventas
  const cogsKardex=movSucursal.filter(m=>m.tipo==="salida_venta"&&enMes(m.fecha||"")).reduce((s,m)=>s+(parseFloat(m.cantidad)||0)*(parseFloat(m.costo_unitario)||0),0);
  const cogsTeorico=vMes.reduce((s,v)=>s+parseFloat(v.costo_teorico||0),0);
  const costoVentas=cogsKardex>0?cogsKardex:cogsTeorico;

  // Mermas del mes = mermas registradas + faltantes netos de conteo físico.
  // Los ajustes de conteo se guardan como entrada/salida_ajuste; la baja
  // (salida) es faltante/merma, la alta (entrada) es sobrante y la reduce.
  // Se excluye el "Inventario inicial" (carga, no sobrante real).
  const mermaRegistrada=mermas.filter(m=>enMes(m.fecha||"")).reduce((s,m)=>s+parseFloat(m.costo_total||0),0);
  const ajusteFaltante=movSucursal.filter(m=>enMes(m.fecha||"")&&(m.tipo==="salida_ajuste"||m.tipo==="entrada_ajuste")&&(m.nota||"")!=="Inventario inicial").reduce((s,m)=>{const val=(parseFloat(m.cantidad)||0)*(parseFloat(m.costo_unitario)||0);return s+(m.tipo==="salida_ajuste"?val:-val);},0);
  const mermaMes=Math.round((mermaRegistrada+ajusteFaltante)*100)/100;
  const gMes=gastosOp.filter(g=>enMes(g.fecha||g.created_at?.split("T")[0]||""));
  const gastosTotal=gMes.reduce((s,g)=>s+parseFloat(g.monto||0),0);
  const gPorCat={};gMes.forEach(g=>{const k=g.categoria||"Otros";gPorCat[k]=(gPorCat[k]||0)+parseFloat(g.monto||0);});
  const gCats=Object.entries(gPorCat).sort((a,b)=>b[1]-a[1]);

  const utilidadBruta=ventasNetas-costoVentas;
  const utilidadOperativa=utilidadBruta-mermaMes-gastosTotal;
  const margenBruto=ventasNetas>0?utilidadBruta/ventasNetas*100:0;
  const margenOperativo=ventasNetas>0?utilidadOperativa/ventasNetas*100:0;
  const foodCost=ventasNetas>0?costoVentas/ventasNetas*100:0;

  // Flujo de efectivo del mes
  const inEfectivo=vMes.reduce((s,v)=>s+parseFloat(v.total_efectivo||0),0);
  const inTarjeta=vMes.reduce((s,v)=>s+parseFloat(v.total_tarjeta||0),0);
  const inPlataforma=vMes.reduce((s,v)=>s+parseFloat(v.total_plataforma||0),0);
  const inOtros=vMes.reduce((s,v)=>s+parseFloat(v.total_otros||0),0);
  const entradas=inEfectivo+inTarjeta+inPlataforma+inOtros;
  const pagosMes=pagos.filter(p=>enMes(p.fecha_pago||p.created_at?.split("T")[0]||"")).reduce((s,p)=>s+parseFloat(p.monto_pagado||0),0);
  const cdMes=comprasDirectas.filter(c=>c.metodo_pago!=="credito"&&enMes(c.fecha||c.created_at?.split("T")[0]||"")).reduce((s,c)=>s+parseFloat(c.costo_total||0),0);
  // Los gastos "Auto:" (insumos tipo gasto recibidos) no salen de caja por sí
  // mismos: su efectivo ya está contado en pagos CxP / compras directas.
  const gastosFlujo=gMes.filter(g=>!(g.nota||"").startsWith("Auto:")).reduce((s,g)=>s+parseFloat(g.monto||0),0);
  const salidas=pagosMes+cdMes+gastosFlujo;
  const flujoNeto=entradas-salidas;

  // Posición (a hoy, no del mes)
  const cxpPendiente=cxp.filter(c=>c.estatus!=="pagado").reduce((s,c)=>s+(parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0)),0);
  const valorAlmacen=inventario.reduce((s,p)=>s+(parseFloat(p.existencia)||0)*(parseFloat(p.costo_unitario_actual)||0),0);
  const valorSucursal=invSucursal.reduce((s,i)=>s+Math.max(0,parseFloat(i.existencia)||0)*costoInsumo(i.insumo_id,invSucursal,catalogo),0);

  const Row=({label,value,bold,color,pct,indent})=>(<div className={`flex justify-between py-1.5 ${bold?"border-t-2 border-gray-300 font-bold text-gray-900":"border-t border-gray-50"}`}><span className={`${indent?"pl-4 text-gray-600":""} ${bold?"":"text-gray-700"} text-sm`}>{label}</span><span className={`text-sm font-semibold ${color||""}`}>{value}{pct!=null&&<span className="text-xs text-gray-400 ml-2">({pct.toFixed(1)}%)</span>}</span></div>);

  return(<div>
    <div className="flex items-center justify-between mb-6">
      <div className="flex items-center gap-3"><Logo size={40}/><div><h2 className="text-lg font-bold text-gray-900">Estados financieros</h2><p className="text-sm text-gray-500">Resultados, flujo y posición — integrado con ventas SR</p></div></div>
      <div className="flex items-center gap-2">
        <button onClick={()=>setMesOffset(mesOffset+1)} className="px-3 py-1.5 rounded-lg text-sm border border-gray-200 hover:bg-gray-100">←</button>
        <span className="text-sm font-semibold text-gray-800 capitalize min-w-32 text-center">{mesNombre}</span>
        <button onClick={()=>setMesOffset(Math.max(0,mesOffset-1))} disabled={mesOffset===0} className="px-3 py-1.5 rounded-lg text-sm border border-gray-200 hover:bg-gray-100 disabled:opacity-30">→</button>
      </div>
    </div>

    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Ventas del mes (con IVA)</p><p className="text-xl font-bold text-gray-900">{fmt(ventasBrutas)}</p></div>
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Food cost</p><p className={`text-xl font-bold ${foodCost>40?"text-red-600":foodCost>32?"text-orange-500":"text-emerald-600"}`}>{ventasNetas>0?foodCost.toFixed(1)+"%":"—"}</p></div>
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Utilidad operativa</p><p className={`text-xl font-bold ${utilidadOperativa>=0?"text-emerald-600":"text-red-600"}`}>{fmt(utilidadOperativa)}</p></div>
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Flujo neto del mes</p><p className={`text-xl font-bold ${flujoNeto>=0?"text-emerald-600":"text-red-600"}`}>{fmt(flujoNeto)}</p></div>
    </div>

    {/* RESUMEN DEL MES: TRES LÍNEAS SEPARADAS — Costos / Gastos / Mermas */}
    <div className="rounded-xl p-4 mb-6" style={{background:"#2D2D2D"}}>
      <h3 className="text-sm font-bold text-white mb-3">Resumen del mes — <span className="capitalize">{mesNombre}</span></h3>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div className="bg-white rounded-xl p-4">
          <div className="flex items-center gap-2 mb-1"><span className="w-2.5 h-2.5 rounded-full" style={{background:"#e2a52a"}}></span><p className="text-xs font-semibold text-gray-600 uppercase tracking-wide">Costos (materia prima)</p></div>
          <p className="text-2xl font-bold text-gray-900">{fmt(costoVentas)}</p>
          <p className="text-xs text-gray-400 mt-1">{ventasNetas>0?`${foodCost.toFixed(1)}% de la venta neta`:"—"} · {cogsKardex>0?"consumo real (kárdex)":"costo teórico de recetas"}</p>
        </div>
        <div className="bg-white rounded-xl p-4">
          <div className="flex items-center gap-2 mb-1"><span className="w-2.5 h-2.5 rounded-full" style={{background:"#2a78d6"}}></span><p className="text-xs font-semibold text-gray-600 uppercase tracking-wide">Gastos del mes</p></div>
          <p className="text-2xl font-bold text-gray-900">{fmt(gastosTotal)}</p>
          <p className="text-xs text-gray-400 mt-1">{gCats.length} categoría{gCats.length===1?"":"s"} de gasto operativo</p>
        </div>
        <div className="bg-white rounded-xl p-4">
          <div className="flex items-center gap-2 mb-1"><span className="w-2.5 h-2.5 rounded-full" style={{background:"#bb4430"}}></span><p className="text-xs font-semibold text-gray-600 uppercase tracking-wide">Mermas del mes</p></div>
          <p className="text-2xl font-bold" style={{color:"#bb4430"}}>{fmt(mermaMes)}</p>
          <p className="text-xs text-gray-400 mt-1">{fmt(mermaRegistrada)} registradas{ajusteFaltante!==0?` · ${fmt(ajusteFaltante)} de conteo físico`:""}</p>
        </div>
      </div>
      <p className="text-xs text-gray-400 mt-3">Tres bloques independientes del corte mensual. Las <b className="text-gray-200">mermas</b> (faltantes por caducidad, daño y diferencias de conteo físico) se reportan por separado de los <b className="text-gray-200">costos</b> de materia prima vendida y de los <b className="text-gray-200">gastos</b> operativos.</p>
    </div>

    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      {/* ESTADO DE RESULTADOS */}
      <div className="bg-white border border-gray-200 rounded-xl p-4">
        <h3 className="text-sm font-bold text-gray-700 mb-3">Estado de resultados — <span className="capitalize">{mesNombre}</span></h3>
        {vMes.length===0&&gMes.length===0?<p className="text-sm text-gray-400">Sin datos este mes. Importa ventas de SoftRestaurant para ver resultados.</p>:<div>
          <Row label="Ventas netas (sin IVA)" value={fmt(ventasNetas)}/>
          {Object.entries(porCanal).map(([c,t])=><Row key={c} label={`Canal ${c} (con IVA)`} value={fmt(t)} indent/>)}
          <Row label="(−) Costo de ventas (insumos por receta)" value={fmt(-costoVentas)} color="text-red-600"/>
          <Row label="Utilidad bruta" value={fmt(utilidadBruta)} bold color={utilidadBruta>=0?"text-emerald-700":"text-red-600"} pct={margenBruto}/>
          <Row label="(−) Mermas (total)" value={fmt(-mermaMes)} color="text-red-600"/>
          <Row label="Mermas registradas (caducidad, daño…)" value={fmt(-mermaRegistrada)} color="text-red-500" indent/>
          {ajusteFaltante!==0&&<Row label={`${ajusteFaltante>=0?"Faltantes":"Sobrantes"} de conteo físico`} value={fmt(-ajusteFaltante)} color={ajusteFaltante>=0?"text-red-500":"text-emerald-600"} indent/>}
          {gCats.map(([c,t])=><Row key={c} label={`(−) ${c}`} value={fmt(-t)} color="text-red-500" indent/>)}
          <Row label="(−) Total gastos operativos" value={fmt(-gastosTotal)} color="text-red-600"/>
          <Row label="Utilidad operativa" value={fmt(utilidadOperativa)} bold color={utilidadOperativa>=0?"text-emerald-700":"text-red-600"} pct={margenOperativo}/>
          <p className="text-xs text-gray-400 mt-3">Costo de ventas: {cogsKardex>0?"kárdex de sucursal (consumo real registrado)":"costo teórico de recetas"}. Mermas del mes = mermas registradas + faltantes de conteo físico. IVA de ventas del mes: {fmt(ivaVentas)} (no es ingreso, se traslada al SAT).</p>
        </div>}
      </div>

      {/* FLUJO DE EFECTIVO */}
      <div className="bg-white border border-gray-200 rounded-xl p-4">
        <h3 className="text-sm font-bold text-gray-700 mb-3">Flujo de efectivo — <span className="capitalize">{mesNombre}</span></h3>
        <p className="text-xs font-semibold text-emerald-700 mb-1">Entradas (cobros de ventas)</p>
        <Row label="Efectivo" value={fmt(inEfectivo)} indent/>
        <Row label="Tarjeta (terminal bancaria)" value={fmt(inTarjeta)} indent/>
        <Row label="Plataformas (UberEats…)" value={fmt(inPlataforma)} indent/>
        {inOtros>0&&<Row label="Otros" value={fmt(inOtros)} indent/>}
        <Row label="Total entradas" value={fmt(entradas)} bold color="text-emerald-700"/>
        <p className="text-xs font-semibold text-red-700 mt-3 mb-1">Salidas</p>
        <Row label="Pagos a proveedores (CxP)" value={fmt(-pagosMes)} color="text-red-600" indent/>
        <Row label="Compras directas (contado)" value={fmt(-cdMes)} color="text-red-600" indent/>
        <Row label="Gastos operativos (pagados directo)" value={fmt(-gastosFlujo)} color="text-red-600" indent/>
        <Row label="Total salidas" value={fmt(-salidas)} bold color="text-red-700"/>
        <Row label="Flujo neto del mes" value={fmt(flujoNeto)} bold color={flujoNeto>=0?"text-emerald-700":"text-red-600"}/>
        {entradas===0&&vMes.length>0&&<p className="text-xs text-orange-600 mt-2">Tip: captura las formas de pago (efectivo/tarjeta/plataforma) al importar cada corte de SR para que el flujo sea real.</p>}
      </div>
    </div>

    {/* POSICIÓN */}
    <div className="bg-white border border-gray-200 rounded-xl p-4">
      <h3 className="text-sm font-bold text-gray-700 mb-3">Posición al día de hoy</h3>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div className="bg-teal-50 border border-teal-100 rounded-xl p-3"><p className="text-xs text-teal-600">Inventario almacén</p><p className="text-lg font-bold text-teal-700">{fmt(valorAlmacen)}</p></div>
        <div className="bg-teal-50 border border-teal-100 rounded-xl p-3"><p className="text-xs text-teal-600">Inventario sucursal</p><p className="text-lg font-bold text-teal-700">{fmt(valorSucursal)}</p></div>
        <div className="bg-red-50 border border-red-100 rounded-xl p-3"><p className="text-xs text-red-600">Cuentas por pagar</p><p className="text-lg font-bold text-red-700">{fmt(cxpPendiente)}</p></div>
        <div className="bg-amber-50 border border-amber-100 rounded-xl p-3"><p className="text-xs" style={{color:"#b8860b"}}>Inventarios − CxP</p><p className={`text-lg font-bold ${valorAlmacen+valorSucursal-cxpPendiente>=0?"text-emerald-700":"text-red-700"}`}>{fmt(valorAlmacen+valorSucursal-cxpPendiente)}</p></div>
      </div>
    </div>
  </div>);
}

// ======================== APP v7.0 ========================
function App(){
  const [rol,setRol]=useState(null);
  const [view,setView]=useState("bandeja");
  const [subview,setSubview]=useState(null);
  const [menuAbierto,setMenuAbierto]=useState(null);
  const [loading,setLoading]=useState(true);
  const [loadMsg,setLoadMsg]=useState("Iniciando...");
  const [error,setError]=useState(null);
  const [catalogo,setCatalogo]=useState([]);
  const [proveedores,setProveedores]=useState([]);
  const [inventario,setInventario]=useState([]);
  const [movimientos,setMovimientos]=useState([]);
  const [pedidos,setPedidos]=useState([]);
  const [selectedPedido,setSelectedPedido]=useState(null);
  const [pedidoDetalle,setPedidoDetalle]=useState([]);
  const [provEstatus,setProvEstatus]=useState([]);
  const [unidades,setUnidades]=useState([]);
  const [lotes,setLotes]=useState([]);
  const [provToken,setProvToken]=useState(null);
  const [recepciones,setRecepciones]=useState([]);
  const [recepcionDetalle,setRecepcionDetalle]=useState([]);
  const [cxp,setCxp]=useState([]);
  const [pagos,setPagos]=useState([]);
  const [comprasDirectas,setComprasDirectas]=useState([]);
  const [gastosOp,setGastosOp]=useState([]);
  const [catGastos,setCatGastos]=useState([]);
  const [flujos,setFlujos]=useState([]);
  // v7.0: ventas SR, inventario de sucursal, recetas, merma
  const [sucursales,setSucursales]=useState([]);
  const [productosVenta,setProductosVenta]=useState([]);
  // v7.16: los desactivados se cargan APARTE. La app los descartaba al cargar y
  // "desactivar" equivalía a "desaparecer" — el mismo patrón que dejó 115 recetas
  // con "?" y 21 presentaciones de compra invisibles. En su propia lista no
  // contaminan ningún contador y sí se pueden avisar.
  const [productosInactivos,setProductosInactivos]=useState([]);
  const [recetas,setRecetas]=useState([]);
  const [invSucursal,setInvSucursal]=useState([]);
  const [ventas,setVentas]=useState([]);
  const [ventaDetalle,setVentaDetalle]=useState([]);
  const [mermas,setMermas]=useState([]);
  const [movSucursal,setMovSucursal]=useState([]);
  const [insumos,setInsumos]=useState([]);

  // Check URL for provider token
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const t=params.get("token");
    if(t)setProvToken(t);
  },[]);

  useEffect(()=>{
    async function load(){
      setLoadMsg("Conectando...");

      // Fast-path proveedor: cuando se entra con ?token=, cargar SOLO el pedido
      // de ese proveedor en vez de toda la base. Antes se descargaban las 16
      // tablas del negocio (incluyendo finanzas) lo que en celulares lentos
      // dejaba al proveedor atorado en "Cargando..." y exponía datos privados.
      if(provToken){
        setLoadMsg("Validando link...");
        const peRows=await sbGet("pedido_proveedor_estatus",`token_acceso=eq.${encodeURIComponent(provToken)}`);
        const pe=(peRows||[])[0];
        if(!pe){setError("Link expirado o inválido.");setLoading(false);return;}
        setLoadMsg("Cargando pedido...");
        const [pedRows,det,ums,provRows]=await Promise.all([
          sbGet("pedidos",`id=eq.${pe.pedido_id}`),
          sbGet("pedido_detalle",`pedido_id=eq.${pe.pedido_id}&proveedor_id=eq.${pe.proveedor_id}`),
          sbGet("unidades_medida"),
          sbGet("proveedores",`id=eq.${pe.proveedor_id}`)
        ]);
        const ped=(pedRows||[])[0];
        if(!ped){setError("Link expirado o inválido.");setLoading(false);return;}
        const uMap={};(ums||[]).forEach(u=>{uMap[u.id]=u;});
        const catIds=[...new Set((det||[]).map(d=>d.catalogo_id).filter(Boolean))];
        const catRows=catIds.length?await sbGet("catalogo",`id=in.(${catIds.join(",")})`):[];
        setCatalogo((catRows||[]).map(c=>({id:c.id,sku:c.sku,articulo:c.articulo,unidad_clave:uMap[c.unidad_id]?.clave||"?",aplica_iva:c.aplica_iva!==false})));
        setPedidoDetalle(det||[]);
        setProvEstatus([pe]);
        setProveedores((provRows||[]).map(p=>({id:p.id,nombre:p.nombre})));
        setSelectedPedido(ped);
        setRol("proveedor_token");
        setLoading(false);
        return;
      }

      const tables=["catalogo","proveedores","tipos_flujo_costo","unidades_medida","inventario_almacen","pedidos","pedido_detalle","pedido_proveedor_estatus","lotes_almacen","recepciones","recepcion_detalle","cuentas_por_pagar","pagos","compras_directas","gastos_operativos","categorias_gastos","sucursales","productos_venta","recetas","inventario_sucursal","ventas","venta_detalle","mermas","movimientos_sucursal","insumos"];
      const results={};
      for(const t of tables){setLoadMsg(`Cargando ${t}...`);results[t]=await sbGet(t);}
      
      if(results.catalogo.length===0){setError("Sin datos. Verifica SQL y permisos.");setLoading(false);return;}

      const uMap={};(results.unidades_medida||[]).forEach(u=>{uMap[u.id]=u;});
      const pMap={};(results.proveedores||[]).forEach(p=>{pMap[p.id]=p;});
      const fMap={};(results.tipos_flujo_costo||[]).forEach(f=>{fMap[f.id]=f;});

      setCatalogo((results.catalogo||[]).filter(c=>c.activo!==false).map(c=>({id:c.id,sku:c.sku,articulo:c.articulo,tipo_producto:c.tipo_producto,unidad_clave:uMap[c.unidad_id]?.clave||"?",costo_referencia:parseFloat(c.costo_referencia)||0,proveedor_id:c.proveedor_id,proveedor_nombre:pMap[c.proveedor_id]?.nombre||"?",notas:c.notas,aplica_iva:c.aplica_iva!==false,inv_id:c.inventario_almacen_id,insumo_id:c.insumo_id,contenido:parseFloat(c.contenido)||1,preferida:c.preferida===true})));
      setProveedores((results.proveedores||[]).filter(p=>p.activo!==false).map(p=>{const fl=fMap[p.tipo_flujo_id]||{};return{id:p.id,nombre:p.nombre,tipo_flujo:fl.nombre||"?",quien_captura:fl.quien_captura_precio||"?"};}));
      setInventario((results.inventario_almacen||[]).map(i=>({id:i.id,sku:i.sku,descripcion:i.descripcion,unidad_clave:uMap[i.unidad_id]?.clave||"?",existencia:parseFloat(i.existencia)||0,costo_unitario_actual:parseFloat(i.costo_unitario_actual)||0,lead_time:i.lead_time,activo:i.activo!==false,variante_de:i.variante_de||null})));
      setPedidos((results.pedidos||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)));
      setPedidoDetalle(results.pedido_detalle||[]);
      setProvEstatus(results.pedido_proveedor_estatus||[]);
      setUnidades((results.unidades_medida||[]).filter(u=>u.activa!==false));
      setLotes(results.lotes_almacen||[]);
      setRecepciones(results.recepciones||[]);
      setRecepcionDetalle(results.recepcion_detalle||[]);
      setCxp(results.cuentas_por_pagar||[]);
      setPagos(results.pagos||[]);
      setComprasDirectas(results.compras_directas||[]);
      setGastosOp(results.gastos_operativos||[]);
      setCatGastos((results.categorias_gastos||[]).filter(c=>c.activa!==false));
      setFlujos((results.tipos_flujo_costo||[]).map(f=>({id:f.id,nombre:f.nombre,quien_captura_precio:f.quien_captura_precio})));
      // v7.0
      setSucursales((results.sucursales||[]).filter(s=>s.activa!==false));
      setProductosVenta((results.productos_venta||[]).filter(p=>p.activo!==false));
      setProductosInactivos((results.productos_venta||[]).filter(p=>p.activo===false));
      setRecetas(results.recetas||[]);
      setInvSucursal(results.inventario_sucursal||[]);
      setVentas(results.ventas||[]);
      setVentaDetalle(results.venta_detalle||[]);
      setMermas((results.mermas||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)));
      setMovSucursal(results.movimientos_sucursal||[]);
      setInsumos((results.insumos||[]).filter(i=>i.activo!==false));

      setLoading(false);
    }
    load();
  },[provToken]);

  // CREATE PEDIDO
  const handleCreatePedido=async(items,totalTeo)=>{
    const sucursal=await sbGet("sucursales","limit=1");
    const sucId=sucursal[0]?.id;
    const serial=genSerial(pedidos);
    const res=await sbPost("pedidos",{fecha:new Date().toISOString().split("T")[0],sucursal_id:sucId,estatus:"creado",total_teorico:Math.round(totalTeo*100)/100,numero_pedido:serial});
    if(!(res&&res[0])){alert("No se pudo crear el pedido. Revisa tu conexión e intenta de nuevo.");return;}
    const pedId=res[0].id;
    // Insertar TODAS las líneas en una sola operación para poder detectar fallos.
    // Antes se insertaban una por una ignorando errores, lo que dejaba pedidos
    // "fantasma" (con estatus pero sin productos) cuando el guardado fallaba.
    const detRows=items.map(item=>({pedido_id:pedId,catalogo_id:item.catalogo_id,proveedor_id:item.proveedor_id,cantidad:item.cantidad,costo_referencia:item.costo_referencia,cantidad_base:item.cantidad_base??null}));
    const detRes=await sbPost("pedido_detalle",detRows);
    if(!Array.isArray(detRes)||detRes.length!==detRows.length){
      // Falló el guardado de los productos: revertir el pedido para no dejarlo vacío.
      await sbDelete("pedidos",pedId);
      alert("No se pudieron guardar los productos del pedido (posible permiso o restricción en la base de datos). El pedido NO se creó; vuelve a intentarlo o avisa a soporte.");
      return;
    }
    // Crear estatus por proveedor
    const provIds=[...new Set(items.map(i=>i.proveedor_id))];
    for(const pid of provIds){await sbPost("pedido_proveedor_estatus",{pedido_id:pedId,proveedor_id:pid,estatus:"pendiente"});}
    // Reload
    setPedidos([{...res[0],numero_pedido:serial},...pedidos]);
    setPedidoDetalle([...pedidoDetalle,...detRes]);
    const pe=await sbGet("pedido_proveedor_estatus",`pedido_id=eq.${pedId}`);
    setProvEstatus([...provEstatus,...pe]);
    setSubview(null);
    alert(`Pedido ${serial} creado`);
  };

  // ACTIONS
  const handleAction=async(action,provId)=>{
    if(!selectedPedido)return;
    const pedId=selectedPedido.id;
    if(action==="enviar_proveedor"){
      const token=genToken();
      await sbPatch("pedido_proveedor_estatus",provEstatus.find(x=>x.pedido_id===pedId&&x.proveedor_id===provId)?.id,{estatus:"enviado",fecha_envio:new Date().toISOString(),token_acceso:token,token_activo:true});
      await sbPatch("pedidos",pedId,{estatus:"en_proceso"});
      setProvEstatus(provEstatus.map(x=>x.pedido_id===pedId&&x.proveedor_id===provId?{...x,estatus:"enviado",token_acceso:token,token_activo:true}:x));
      setPedidos(pedidos.map(p=>p.id===pedId?{...p,estatus:"en_proceso"}:p));
      setSelectedPedido({...selectedPedido,estatus:"en_proceso"});
      const link=`${window.location.origin}${window.location.pathname}?token=${token}`;
      alert(`Enviado. Link para proveedor:\n${link}`);
      navigator.clipboard.writeText(link);
    }
    if(action==="cerrar_manual"||action==="enviar_almacen"){
      const est=action==="cerrar_manual"?"completo":"enviado";
      const pe=provEstatus.find(x=>x.pedido_id===pedId&&x.proveedor_id===provId);
      if(pe)await sbPatch("pedido_proveedor_estatus",pe.id,{estatus:est,fecha_completado:new Date().toISOString()});
      setProvEstatus(provEstatus.map(x=>x.pedido_id===pedId&&x.proveedor_id===provId?{...x,estatus:est}:x));
    }
    if(action==="comprado"){
      const totalReal=pedidoDetalle.filter(d=>d.pedido_id===pedId).reduce((s,d)=>s+d.cantidad*(d.costo_real||d.costo_referencia),0);
      // Check if all receptions already exist → auto-close
      const allProvForPed=provEstatus.filter(x=>x.pedido_id===pedId);
      const allReceived=allProvForPed.every(x=>recepciones.some(r=>r.pedido_id===pedId&&r.proveedor_id===x.proveedor_id));
      if(allReceived){
        await sbPatch("pedidos",pedId,{estatus:"cerrado",total_real:totalReal});
        setPedidos(pedidos.map(p=>p.id===pedId?{...p,estatus:"cerrado",total_real:totalReal}:p));
        setSelectedPedido({...selectedPedido,estatus:"cerrado"});
        // Generate CxP
        const provIds=[...new Set(pedidoDetalle.filter(d=>d.pedido_id===pedId).map(d=>d.proveedor_id))];
        const newCxps=[];
        for(const pid of provIds){
          const provItems=pedidoDetalle.filter(d=>d.pedido_id===pedId&&d.proveedor_id===pid);
          const monto=montoConIva(provItems,catalogo);
          if(monto>0){const cxpRes=await sbPost("cuentas_por_pagar",{pedido_id:pedId,proveedor_id:pid,monto_total:Math.round(monto*100)/100,estatus:"pendiente"});if(cxpRes&&cxpRes[0])newCxps.push(cxpRes[0]);}
        }
        setCxp([...cxp,...newCxps]);
        alert("Pedido comprado y cerrado — recepciones ya estaban completas. CxP generadas.");
      } else {
        await sbPatch("pedidos",pedId,{estatus:"comprado",total_real:totalReal});
        setPedidos(pedidos.map(p=>p.id===pedId?{...p,estatus:"comprado",total_real:totalReal}:p));
        setSelectedPedido({...selectedPedido,estatus:"comprado"});
        alert("Pedido marcado como comprado — pendiente de recepción por Sucursal");
      }
    }
  };

  const handleReasignar=async(detalleId,nuevoProvId)=>{
    const det=pedidoDetalle.find(d=>d.id===detalleId);
    if(!det)return;
    const oldProvId=det.proveedor_id;
    await sbPost("pedido_reasignaciones",{pedido_detalle_id:detalleId,pedido_id:det.pedido_id,proveedor_original_id:oldProvId,proveedor_nuevo_id:nuevoProvId});
    await sbPatch("pedido_detalle",detalleId,{proveedor_id:nuevoProvId});
    const updatedDetalle=pedidoDetalle.map(d=>d.id===detalleId?{...d,proveedor_id:nuevoProvId}:d);
    setPedidoDetalle(updatedDetalle);
    // Clean orphan: if no items left for old provider, delete its estatus
    const remainingForOldProv=updatedDetalle.filter(d=>d.pedido_id===det.pedido_id&&d.proveedor_id===oldProvId);
    if(remainingForOldProv.length===0){
      const orphanPE=provEstatus.find(pe=>pe.pedido_id===det.pedido_id&&pe.proveedor_id===oldProvId);
      if(orphanPE){await sbDelete("pedido_proveedor_estatus",orphanPE.id);setProvEstatus(provEstatus.filter(pe=>pe.id!==orphanPE.id));}
    }
    // Ensure new provider has estatus
    const existsPE=provEstatus.find(pe=>pe.pedido_id===det.pedido_id&&pe.proveedor_id===nuevoProvId);
    if(!existsPE){const newPE=await sbPost("pedido_proveedor_estatus",{pedido_id:det.pedido_id,proveedor_id:nuevoProvId,estatus:"pendiente"});if(newPE&&newPE[0])setProvEstatus(prev=>[...prev,newPE[0]]);}
  };

  // v7.18: compras cambia la presentación de compra de una línea.
  // Recalcula desde cantidad_base (la NECESIDAD), no desde el volumen que iba a
  // llegar: el excedente del envase anterior es artefacto del empaque. Si la
  // presentación nueva es de otro proveedor, mueve la línea reusando la misma
  // mecánica de handleReasignar (estatus por proveedor + bitácora), porque un
  // simple PATCH al catalogo_id dejaría estatus huérfanos y el pedido se le
  // aparecería al proveedor equivocado en su link.
  const handleCambiarPresentacion=async(detalleId,nuevoCatId)=>{
    const det=pedidoDetalle.find(d=>d.id===detalleId);
    const nueva=catalogo.find(c=>c.id===nuevoCatId);
    if(!det||!nueva||det.catalogo_id===nuevoCatId)return;
    const vieja=catalogo.find(c=>c.id===det.catalogo_id)||{};
    // Pedidos anteriores a v7.18 no traen cantidad_base: se estima con lo que
    // iba a llegar. Es una estimación, y la pantalla lo dice.
    const base=parseFloat(det.cantidad_base)>0
      ? parseFloat(det.cantidad_base)
      : (parseFloat(det.cantidad)||0)*(parseFloat(vieja.contenido)||1);
    const cont=parseFloat(nueva.contenido)||1;
    const unidades=cont===1?base:Math.ceil(base/cont);
    if(!(unidades>0)){alert("No se pudo recalcular la cantidad para esa presentación.");return;}
    const provNuevo=nueva.proveedor_id;
    const provViejo=det.proveedor_id;
    const cambiaProv=provNuevo&&provNuevo!==provViejo;
    const r=await sbPatchE("pedido_detalle",detalleId,{catalogo_id:nuevoCatId,cantidad:unidades,costo_referencia:nueva.costo_referencia,costo_real:null,proveedor_id:provNuevo||provViejo});
    if(r.error){alert("No se pudo cambiar la presentación: "+(r.error.message||"error desconocido"));return;}
    await sbPost("pedido_presentacion_cambios",{pedido_detalle_id:detalleId,pedido_id:det.pedido_id,catalogo_original_id:det.catalogo_id,catalogo_nuevo_id:nuevoCatId,cantidad_original:det.cantidad,cantidad_nueva:unidades,cantidad_base:base,cambio_proveedor:!!cambiaProv,cambiado_por:rol});
    const upd=pedidoDetalle.map(d=>d.id===detalleId?{...d,catalogo_id:nuevoCatId,cantidad:unidades,costo_referencia:nueva.costo_referencia,costo_real:null,proveedor_id:provNuevo||provViejo}:d);
    setPedidoDetalle(upd);
    if(cambiaProv){
      await sbPost("pedido_reasignaciones",{pedido_detalle_id:detalleId,pedido_id:det.pedido_id,proveedor_original_id:provViejo,proveedor_nuevo_id:provNuevo,motivo:"Cambio de presentación de compra"});
      const quedan=upd.filter(d=>d.pedido_id===det.pedido_id&&d.proveedor_id===provViejo);
      if(quedan.length===0){
        const huerfano=provEstatus.find(pe=>pe.pedido_id===det.pedido_id&&pe.proveedor_id===provViejo);
        if(huerfano){await sbDelete("pedido_proveedor_estatus",huerfano.id);setProvEstatus(provEstatus.filter(pe=>pe.id!==huerfano.id));}
      }
      const existe=provEstatus.find(pe=>pe.pedido_id===det.pedido_id&&pe.proveedor_id===provNuevo);
      if(!existe){const nuevoPE=await sbPost("pedido_proveedor_estatus",{pedido_id:det.pedido_id,proveedor_id:provNuevo,estatus:"pendiente"});if(nuevoPE&&nuevoPE[0])setProvEstatus(prev=>[...prev,nuevoPE[0]]);}
    }
    // El total teórico del pedido se recalcula: si no, el costo teórico miente.
    const teo=upd.filter(d=>d.pedido_id===det.pedido_id).reduce((s,d)=>s+(parseFloat(d.cantidad)||0)*(parseFloat(d.costo_referencia)||0),0);
    await sbPatch("pedidos",det.pedido_id,{total_teorico:Math.round(teo*100)/100});
    setPedidos(prev=>prev.map(p=>p.id===det.pedido_id?{...p,total_teorico:Math.round(teo*100)/100}:p));
  };

  // v7.0: IMPORTAR CORTE DE VENTAS DE SOFTRESTAURANT
  // Da de alta productos SR nuevos, guarda venta + detalle (con rollback),
  // explota recetas y descuenta el inventario de sucursal (kárdex salida_venta).
  const handleImportVentas=async(fecha,canal,pagosFP,rows)=>{
    const sucId=sucursales[0]?.id||null;
    let prods=[...productosVenta];
    const rowsFinal=[];
    for(const r of rows){
      let prodId=r.prodId;
      if(!prodId){
        let res=await sbPost("productos_venta",{codigo_sr:r.codigo||null,nombre:r.nombre,precio_venta:Math.round((r.precio||0)*100)/100});
        if(!(res&&res[0]))res=await sbPost("productos_venta",{nombre:r.nombre,precio_venta:Math.round((r.precio||0)*100)/100});
        if(res&&res[0]){prods.push(res[0]);prodId=res[0].id;}else continue;
      }
      rowsFinal.push({...r,prodId});
    }
    if(rowsFinal.length===0){alert("No se pudo procesar ninguna línea del reporte.");return false;}
    // Los precios de SR ya incluyen IVA: separar subtotal e IVA por producto
    let subtotal=0,iva=0,costoTotal=0;
    const detRows=rowsFinal.map(r=>{
      const prod=prods.find(p=>p.id===r.prodId)||{};
      const sub=prod.aplica_iva!==false?r.importe/1.16:r.importe;
      subtotal+=sub;iva+=r.importe-sub;
      const cT=Math.round(costoReceta(r.prodId,recetas,invSucursal,catalogo,prods)*r.cantidad*100)/100;
      costoTotal+=cT;
      return{producto_venta_id:r.prodId,cantidad:r.cantidad,precio_unitario:Math.round((r.precio||0)*100)/100,importe:Math.round(r.importe*100)/100,costo_teorico:cT};
    });
    const total=rowsFinal.reduce((s,r)=>s+r.importe,0);
    const folio=`SR-${fecha.replace(/-/g,"")}-${String(ventas.filter(v=>v.fecha===fecha).length+1).padStart(2,"0")}`;
    const vRes=await sbPost("ventas",{sucursal_id:sucId,fecha,folio,origen:"importado_sr",canal,subtotal:Math.round(subtotal*100)/100,iva:Math.round(iva*100)/100,total:Math.round(total*100)/100,total_efectivo:pagosFP.efectivo||0,total_tarjeta:pagosFP.tarjeta||0,total_plataforma:pagosFP.plataforma||0,total_otros:pagosFP.otros||0,costo_teorico:Math.round(costoTotal*100)/100,registrado_por:rol});
    if(!(vRes&&vRes[0])){alert("No se pudo guardar la venta en la base de datos.");setProductosVenta(prods);return false;}
    const ventaId=vRes[0].id;
    const dRes=await sbPost("venta_detalle",detRows.map(d=>({...d,venta_id:ventaId})));
    if(!Array.isArray(dRes)||dRes.length!==detRows.length){
      await sbDelete("ventas",ventaId);
      alert("Falló el guardado del detalle; la venta NO se importó. Intenta de nuevo.");
      setProductosVenta(prods);return false;
    }
    // Consumo de insumos por receta (v7.1: explota también sub-recetas/preparaciones)
    const consumo={};
    rowsFinal.forEach(r=>explotarReceta(r.prodId,r.cantidad,recetas,prods,consumo));
    let invList=invSucursal;const movsNew=[];const negativos=[];
    if(sucId)for(const[insId,cant]of Object.entries(consumo)){
      let row=invList.find(i=>i.sucursal_id===sucId&&i.insumo_id===insId);
      const costoU=costoInsumo(insId,invList,catalogo);
      if(!row){const res=await sbPost("inventario_sucursal",{sucursal_id:sucId,insumo_id:insId,existencia:0,costo_promedio:costoU});if(res&&res[0]){row=res[0];invList=[...invList,row];}else continue;}
      const nueva=Math.round(((parseFloat(row.existencia)||0)-cant)*1000)/1000;
      await sbPatch("inventario_sucursal",row.id,{existencia:nueva,updated_at:new Date().toISOString()});
      invList=invList.map(i=>i.id===row.id?{...i,existencia:nueva}:i);
      const mv=await sbPost("movimientos_sucursal",{sucursal_id:sucId,insumo_id:insId,tipo:"salida_venta",cantidad:Math.round(cant*1000)/1000,costo_unitario:costoU,venta_id:ventaId,fecha,nota:`Venta ${folio}`,registrado_por:rol});
      if(mv&&mv[0])movsNew.push(mv[0]);
      if(nueva<0){const ins=insumos.find(x=>x.id===insId);negativos.push(`${ins?.nombre||"?"}: ${fmtQ(nueva,ins?.unidad_base||"")}`);}
    }
    setProductosVenta(prods);
    setVentas([vRes[0],...ventas]);
    setVentaDetalle([...ventaDetalle,...dRes]);
    setInvSucursal(invList);
    if(movsNew.length)setMovSucursal(prev=>[...prev,...movsNew]);
    alert(`Venta ${folio} importada: ${fmt(total)} (costo teórico ${fmt(costoTotal)})${negativos.length?"\n\n⚠ Insumos con existencia negativa (revisa recepciones o recetas):\n"+negativos.join("\n"):""}`);
    return true;
  };

  // v7.8: descuento PEPS del ALMACÉN para un pedido de "Almacén interno".
  // Reutilizable: lo llama el botón Surtir y, como red de seguridad, la
  // recepción de sucursal si el pedido nunca se surtió (así el almacén nunca
  // queda con inventario fantasma). cantMap: {pedido_detalle_id: cantidad}.
  // variantePref (opcional): {pedido_detalle_id: inventario_almacen_id} para
  // forzar el surtido desde una variante concreta del grupo (v7.10).
  const descontarAlmacenPEPS=async(pedId,cantMap,variantePref)=>{
    const almItems=pedidoDetalle.filter(d=>d.pedido_id===pedId&&proveedores.find(pr=>pr.id===d.proveedor_id)?.tipo_flujo==="Almacen interno");
    let updatedLotes=[...lotes];let updatedInv=[...inventario];const movsNew=[];
    const numPed=pedidos.find(p=>p.id===pedId)?.numero_pedido||"";
    for(const d of almItems){
      const cs=cantMap[d.id]||0;if(cs<=0)continue;
      const cat=catalogo.find(c=>c.id===d.catalogo_id);if(!cat)continue;
      const inv=cat.inv_id?updatedInv.find(i=>i.id===cat.inv_id):updatedInv.find(i=>{const dL=i.descripcion.toLowerCase();const words=cat.articulo.toLowerCase().split(" ");return words.some(w=>w.length>3&&dL.includes(w));});
      if(!inv)continue;
      // v7.10: el descuento recorre TODO el grupo de variantes (mismo insumo,
      // distinto branding) en orden PEPS estricto. Si el almacenista forzó una
      // variante para esta línea, solo se consume de ella.
      const forzado=variantePref&&variantePref[d.id]?updatedInv.find(i=>i.id===variantePref[d.id]):null;
      const prodLotes=forzado
        ?updatedLotes.filter(l=>l.inventario_id===forzado.id&&(l.existencia_restante||0)>0).sort((a,b)=>new Date(a.fecha_entrada)-new Date(b.fecha_entrada))
        :lotesGrupoPEPS(inv,updatedInv,updatedLotes);
      let remaining=cs;let costoPeps=0;
      // Consumido por SKU de almacén: un movimiento por SKU tocado.
      const consumoPorInv={};
      for(const lote of prodLotes){
        if(remaining<=0)break;
        const available=lote.existencia_restante||0;
        const take=Math.min(remaining,available);
        const costoU=parseFloat(lote.costo_unitario)||0; // v7.13: costeo sin IVA
        costoPeps+=take*costoU;
        if(!consumoPorInv[lote.inventario_id])consumoPorInv[lote.inventario_id]={qty:0,lotes:[]};
        consumoPorInv[lote.inventario_id].qty+=take;
        consumoPorInv[lote.inventario_id].lotes.push({lote,take,costoU});
        remaining-=take;
      }
      // Si el grupo no alcanzó, el faltante se carga al SKU base (queda en 0).
      if(remaining>0){
        const baseId=forzado?forzado.id:raizInv(inv);
        if(!consumoPorInv[baseId])consumoPorInv[baseId]={qty:0,lotes:[]};
        consumoPorInv[baseId].qty+=remaining;
        remaining=0;
      }
      for(const[invId,c]of Object.entries(consumoPorInv)){
        if(c.qty<=0)continue;
        const invRow=updatedInv.find(i=>i.id===invId);if(!invRow)continue;
        const esVariante=invId!==raizInv(inv);
        const movRes=await sbPost("movimientos_almacen",{inventario_id:invId,pedido_id:pedId,fecha:new Date().toISOString().split("T")[0],tipo:"salida",cantidad:c.qty,nota:`PEPS Pedido ${numPed}${esVariante?` (variante: ${invRow.descripcion})`:""}`});
        const movId=movRes&&movRes[0]?movRes[0].id:null;
        let costoInv=0;
        for(const{lote,take,costoU}of c.lotes){
          costoInv+=take*costoU;
          await sbPost("salidas_peps",{movimiento_id:movId,lote_id:lote.id,cantidad_consumida:take,costo_unitario_lote:costoU,costo_total:Math.round(take*costoU*100)/100});
          const newRest=(lote.existencia_restante||0)-take;
          await sbPatch("lotes_almacen",lote.id,{existencia_restante:newRest});
          updatedLotes=updatedLotes.map(l=>l.id===lote.id?{...l,existencia_restante:newRest}:l);
        }
        const newExist=Math.max(0,parseFloat(invRow.existencia)-c.qty);
        const avgInv=c.qty>0&&costoInv>0?costoInv/c.qty:invRow.costo_unitario_actual;
        await sbPatch("inventario_almacen",invId,{existencia:newExist,costo_unitario_actual:avgInv});
        updatedInv=updatedInv.map(p=>p.id===invId?{...p,existencia:newExist,costo_unitario_actual:avgInv}:p);
        movsNew.push({id:Date.now().toString()+d.id+invId,inv_id:invId,tipo:"salida",qty:c.qty,nota:`PEPS Pedido #${numPed}${esVariante?` (${invRow.descripcion})`:""}`,fecha:new Date().toLocaleDateString("es-MX")});
      }
      // Costo real de la línea: promedio ponderado de todo lo consumido del grupo.
      const avgCost=cs>0&&costoPeps>0?costoPeps/cs:inv.costo_unitario_actual;
      await sbPatch("pedido_detalle",d.id,{cantidad:cs,costo_real:avgCost,capturado_por:"sistema",fecha_captura:new Date().toISOString()});

  // RECEPCIÓN DE MERCANCÍA
  const handleRecibir=async(pedId,provId,estatus,items)=>{
    const res=await sbPost("recepciones",{pedido_id:pedId,proveedor_id:provId,estatus:estatus,recibido_por:"sucursal"});

      // Update pedido_proveedor_estatus
      const pe=provEstatus.find(x=>x.pedido_id===pedId&&x.proveedor_id===provId);

        }
      }
      setRecepciones([...recepciones,res[0]]);
      const detRes=await sbGet("recepcion_detalle",`recepcion_id=eq.${recId}`);
      setRecepcionDetalle([...recepcionDetalle,...(detRes||[])]);

      // v7.2: lo recibido entra al inventario de sucursal CONVERTIDO a unidad
      // base (6 botes × 900 ml = 5,400 ml) con costo por unidad base. Los
      // insumos tipo "gasto" (jabón, fibras…) no llevan inventario: su costo
      // se registra como gasto operativo con su categoría.
      const pedRec=pedidos.find(p=>p.id===pedId);
      const sucIdRec=pedRec?.sucursal_id||sucursales[0]?.id||null;
      if(sucIdRec){
        let invList=invSucursal;const movsNew=[];const gastosNew=[];
        for(const item of items){
          if((item.cantidad_recibida||0)<=0)continue;
          const det=pedidoDetalle.find(d=>d.id===item.pedido_detalle_id);
          if(!det)continue;
          const cat=catalogo.find(c=>c.id===det.catalogo_id);
          if(!cat?.insumo_id)continue;
          const ins=insumos.find(x=>x.id===cat.insumo_id);

            if(monto>0){const g=await sbPost("gastos_operativos",{categoria:ins.categoria_gasto||"Insumos generales",descripcion:`${cat.articulo} × ${item.cantidad_recibida} (recepción ${pedRec?.numero_pedido||""})`,monto,metodo_pago:"transferencia",fecha:new Date().toISOString().split("T")[0],registrado_por:"sistema",nota:"Auto: insumo tipo gasto"});if(g&&g[0])gastosNew.push(g[0]);}
            continue;
          }
          const r=await entradaSucursalDB(invList,sucIdRec,cat.insumo_id,item.cantidad_recibida*contenido,costoPres/contenido,"entrada_recepcion",{recepcion_id:recId,nota:`Recepción ${pedRec?.numero_pedido||""}: ${item.cantidad_recibida} × ${cat.articulo}`,registrado_por:"sucursal"});
          invList=r.invList;if(r.mov)movsNew.push(r.mov);
        }
        setInvSucursal(invList);
        if(movsNew.length)setMovSucursal(prev=>[...prev,...movsNew]);
        if(gastosNew.length)setGastosOp(prev=>[...gastosNew,...prev]);
      }

      // v7.8: RED DE SEGURIDAD — si el proveedor es "Almacén interno" y el
      // pedido NO se surtió (no hay salida de almacén registrada), descontar el
      // almacén ahora con lo efectivamente recibido. Evita el inventario
      // fantasma (mercancía que salió físicamente pero el sistema no descontó).

        if(!yaSurtido||yaSurtido.length===0){
          const cantMap={};items.forEach(it=>{cantMap[it.pedido_detalle_id]=it.cantidad_recibida||0;});

        const newCxps=[];
        for(const pid of provIds){

      } else if(allReceived){
        alert("Recepción registrada — Todas las recepciones completas. Falta que Compras marque como comprado para cerrar.");
      } else {
        alert(estatus==="completo"?"Recepción completa registrada":"Recepción con faltantes registrada — Compras puede ver las discrepancias");
      }
    }

      {view==="compras_directas"&&["sucursal","admin","compras","finanzas"].includes(rol)&&<ComprasDirectasView comprasDirectas={comprasDirectas} setComprasDirectas={setComprasDirectas} catalogo={catalogo} proveedores={proveedores} cxp={cxp} setCxp={setCxp} onEntrada={async(catId,cant,costoU)=>{
        const sucId=sucursales[0]?.id;if(!sucId)return;
        const cat=catalogo.find(c=>c.id===catId);if(!cat?.insumo_id)return;
        const ins=insumos.find(x=>x.id===cat.insumo_id);
        const contenido=parseFloat(cat.contenido)||1;
        if(ins?.tipo_control==="gasto"){
          const monto=Math.round(cant*costoU*100)/100;
          if(monto>0){const g=await sbPost("gastos_operativos",{categoria:ins.categoria_gasto||"Insumos generales",descripcion:`${cat.articulo} × ${cant} (compra directa)`,monto,metodo_pago:"transferencia",fecha:new Date().toISOString().split("T")[0],registrado_por:"sistema",nota:"Auto: insumo tipo gasto"});if(g&&g[0])setGastosOp(prev=>[g[0],...prev]);}
          return;
        }
        const r=await entradaSucursalDB(invSucursal,sucId,cat.insumo_id,cant*contenido,costoU/contenido,"entrada_compra_directa",{nota:`Compra directa: ${cant} × ${cat.articulo}`,registrado_por:rol});
        setInvSucursal(r.invList);if(r.mov)setMovSucursal(prev=>[...prev,r.mov]);
      }}/>}
      {view==="ventas"&&["admin","compras","sucursal","finanzas"].includes(rol)&&<VentasSRView productosVenta={productosVenta} setProductosVenta={setProductosVenta} productosInactivos={productosInactivos} setProductosInactivos={setProductosInactivos} recetas={recetas} setRecetas={setRecetas} ventas={ventas} ventaDetalle={ventaDetalle} catalogo={catalogo} insumos={insumos} invSucursal={invSucursal} onImport={handleImportVentas} rol={rol}/>}
      {view==="recetario"&&["admin","compras","sucursal","finanzas"].includes(rol)&&<VentasSRView key="recetario" tabInicial="productos" productosVenta={productosVenta} setProductosVenta={setProductosVenta} productosInactivos={productosInactivos} setProductosInactivos={setProductosInactivos} recetas={recetas} setRecetas={setRecetas} ventas={ventas} ventaDetalle={ventaDetalle} catalogo={catalogo} insumos={insumos} invSucursal={invSucursal} onImport={handleImportVentas} rol={rol}/>}
      {view==="inv_sucursal"&&["admin","compras","sucursal"].includes(rol)&&<SucursalInvView invSucursal={invSucursal} setInvSucursal={setInvSucursal} movSucursal={movSucursal} setMovSucursal={setMovSucursal} mermas={mermas} setMermas={setMermas} catalogo={catalogo} insumos={insumos} sucursales={sucursales} rol={rol}/>}
      {view==="estados"&&["admin","compras","finanzas"].includes(rol)&&<EstadosView ventas={ventas} mermas={mermas} gastosOp={gastosOp} comprasDirectas={comprasDirectas} cxp={cxp} pagos={pagos} inventario={inventario} invSucursal={invSucursal} movSucursal={movSucursal} catalogo={catalogo}/>}
      {view==="gastos"&&["sucursal","admin","compras","finanzas"].includes(rol)&&<GastosView gastosOp={gastosOp} setGastosOp={setGastosOp} catGastos={catGastos} setCatGastos={setCatGastos} rol={rol}/>}
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
