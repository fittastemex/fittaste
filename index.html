                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{new Date(e.fecha).toLocaleDateString("es-MX")}</td>
                <td className="px-3 py-1.5"><Badge v={e.cant>0?"success":"danger"}>{e.cant>0?"entrada":"salida"}</Badge></td>
                <td className="px-3 py-1.5 text-right font-medium text-emerald-700">{e.cant>0?fmtQ(e.cant,kardexProd.unidad_clave):"—"}</td>
                <td className="px-3 py-1.5 text-right font-medium text-red-600">{e.cant<0?fmtQ(-e.cant,kardexProd.unidad_clave):"—"}</td>
                <td className="px-3 py-1.5 text-right text-gray-500">{e.costo!=null?fmt(e.costo):"—"}</td>
                <td className="px-3 py-1.5 text-right font-bold text-gray-800">{fmtQ(e.saldo,kardexProd.unidad_clave)}</td>
                <td className="px-3 py-1.5 text-gray-500 max-w-[16rem] truncate" title={e.nota}>{e.nota||"—"}</td>
              </tr>))}</tbody></table>
            </div>
            <p className="text-xs text-gray-400 mt-2">Orden: más reciente arriba. Entradas = lotes recibidos · Salidas = surtidos/ajustes registrados.</p>
          </div>);})()}
        </div>
      </div>
    </div>}
  </div>);
}

// ======================== DASHBOARD FINANCIERO ========================
function DashboardView({pedidos,catalogo,proveedores,pedidoDetalle,inventario,comprasDirectas,gastosOp}){
  const [mesOffset,setMesOffset]=useState(0);
  const now=new Date();
  const mesActual=new Date(now.getFullYear(),now.getMonth()-mesOffset,1);
  const mesNombre=mesActual.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
  const mesInicio=mesActual.toISOString().split("T")[0];
  const mesFin=new Date(mesActual.getFullYear(),mesActual.getMonth()+1,0).toISOString().split("T")[0];

  // Pedidos del mes
  const pedidosMes=pedidos.filter(p=>{const f=p.fecha||p.created_at?.split("T")[0];return f>=mesInicio&&f<=mesFin;});
  const pedidosCerradosMes=pedidosMes.filter(p=>p.estatus==="cerrado");
  const pedidosActivosMes=pedidosMes.filter(p=>p.estatus!=="cerrado");

  // Detalle del mes
  const pedidoIdsMes=new Set(pedidosMes.map(p=>p.id));
  const detalleMes=pedidoDetalle.filter(d=>pedidoIdsMes.has(d.pedido_id));

  // Costo real del mes
  const costoRealMes=detalleMes.reduce((s,d)=>s+d.cantidad*(d.costo_real||0),0);
  const costoTeoricoMes=detalleMes.reduce((s,d)=>s+d.cantidad*d.costo_referencia,0);
  const desvMes=costoTeoricoMes>0?((costoRealMes-costoTeoricoMes)/costoTeoricoMes*100):0;

  // Por proveedor
  const byProv={};
  detalleMes.forEach(d=>{
    const prov=proveedores.find(p=>p.id===d.proveedor_id);
    const k=prov?.nombre||"Otro";
    if(!byProv[k])byProv[k]={total_real:0,total_teo:0,items:0};
    byProv[k].total_real+=d.cantidad*(d.costo_real||d.costo_referencia);
    byProv[k].total_teo+=d.cantidad*d.costo_referencia;
    byProv[k].items++;
  });
  const provSorted=Object.entries(byProv).sort((a,b)=>b[1].total_real-a[1].total_real);
  const maxProv=provSorted.length>0?provSorted[0][1].total_real:1;

  // Por SKU (top 15 por gasto)
  const bySku={};
  detalleMes.forEach(d=>{
    const cat=catalogo.find(c=>c.id===d.catalogo_id);
    if(!cat)return;
    const k=cat.articulo;
    if(!bySku[k])bySku[k]={total_real:0,total_teo:0,cantidad:0,unidad:cat.unidad_clave,sku:cat.sku,proveedor:cat.proveedor_nombre};
    bySku[k].total_real+=d.cantidad*(d.costo_real||d.costo_referencia);
    bySku[k].total_teo+=d.cantidad*d.costo_referencia;
    bySku[k].cantidad+=d.cantidad;
  });
  const skuSorted=Object.entries(bySku).sort((a,b)=>b[1].total_real-a[1].total_real);
  const maxSku=skuSorted.length>0?skuSorted[0][1].total_real:1;

  // Capital almacén
  const capAlmacen=inventario.reduce((s,p)=>s+p.existencia*p.costo_unitario_actual,0);

  return(<div>
    <div className="flex items-center justify-between mb-6">
      <div className="flex items-center gap-3"><Logo size={40}/><div><h2 className="text-lg font-bold text-gray-900">Dashboard financiero</h2><p className="text-sm text-gray-500">Fit Taste Roma — v{V}</p></div></div>
      <div className="flex items-center gap-2">
        <button onClick={()=>setMesOffset(mesOffset+1)} className="px-3 py-1.5 rounded-lg text-sm border border-gray-200 hover:bg-gray-100">←</button>
        <span className="text-sm font-semibold text-gray-800 capitalize min-w-32 text-center">{mesNombre}</span>
        <button onClick={()=>setMesOffset(Math.max(0,mesOffset-1))} disabled={mesOffset===0} className="px-3 py-1.5 rounded-lg text-sm border border-gray-200 hover:bg-gray-100 disabled:opacity-30">→</button>
      </div>
    </div>

    {/* KPIs principales */}
    <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Costo real del mes</p><p className="text-xl font-bold text-gray-900">{fmt(costoRealMes)}</p></div>
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Costo teórico</p><p className="text-xl font-bold text-gray-500">{fmt(costoTeoricoMes)}</p></div>
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Desviación</p><p className={`text-xl font-bold ${desvMes>5?"text-red-600":desvMes<-5?"text-emerald-600":"text-gray-800"}`}>{desvMes>0?"+":""}{desvMes.toFixed(1)}%</p></div>
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Pedidos mes</p><p className="text-xl font-bold text-amber-600">{pedidosMes.length}<span className="text-xs text-gray-400 ml-1">({pedidosCerradosMes.length} cerrados)</span></p></div>
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Capital almacén</p><p className="text-xl font-bold text-teal-600">{fmt(capAlmacen)}</p></div>
    </div>

    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      {/* GASTO POR PROVEEDOR */}
      <div className="bg-white border border-gray-200 rounded-xl p-4">
        <h3 className="text-sm font-bold text-gray-700 mb-3">Gasto por proveedor — <span className="capitalize">{mesNombre}</span></h3>
        {provSorted.length===0?<p className="text-sm text-gray-400">Sin datos para este mes</p>:provSorted.map(([prov,data])=>{
          const pct=maxProv>0?(data.total_real/maxProv)*100:0;
          const desv=data.total_teo>0?((data.total_real-data.total_teo)/data.total_teo*100):0;
          return(<div key={prov} className="mb-3">
            <div className="flex justify-between text-sm mb-1">
              <span className="text-gray-700 font-medium">{prov} <span className="text-gray-400 text-xs">({data.items} artículos)</span></span>
              <div className="flex items-center gap-2"><Badge v={Math.abs(desv)>10?"danger":Math.abs(desv)>5?"warning":"success"}>{desv>0?"+":""}{desv.toFixed(0)}%</Badge><span className="font-bold text-gray-800">{fmt(data.total_real)}</span></div>
            </div>
            <div className="w-full bg-gray-100 rounded-full h-3"><div className="h-3 rounded-full transition-all" style={{width:`${Math.min(pct,100)}%`,background:"#e2a52a"}}/></div>
          </div>);
        })}
        {provSorted.length>0&&<div className="border-t border-gray-100 pt-2 mt-2 flex justify-between font-bold text-sm"><span>Total</span><span>{fmt(costoRealMes)}</span></div>}
      </div>

      {/* CONSUMO POR SKU (top 15) */}
      <div className="bg-white border border-gray-200 rounded-xl p-4">
        <h3 className="text-sm font-bold text-gray-700 mb-3">Top consumo por SKU — <span className="capitalize">{mesNombre}</span></h3>
        {skuSorted.length===0?<p className="text-sm text-gray-400">Sin datos para este mes</p>:
        <div className="overflow-y-auto" style={{maxHeight:"400px"}}><table className="w-full text-sm"><thead className="sticky top-0 bg-white"><tr>
          {["Artículo","Cantidad","Costo real","% del total"].map(h=><th key={h} className={`px-2 py-1.5 font-medium text-gray-500 text-xs ${h==="Artículo"?"text-left":"text-right"}`}>{h}</th>)}
        </tr></thead><tbody>{skuSorted.slice(0,15).map(([art,data],i)=>{
          const pctTotal=costoRealMes>0?(data.total_real/costoRealMes*100):0;
          const desv=data.total_teo>0?((data.total_real-data.total_teo)/data.total_teo*100):0;
          return(<tr key={i} className="border-t border-gray-50">
            <td className="px-2 py-1.5"><p className="font-medium text-gray-800">{art}</p><p className="text-xs text-gray-400">{data.proveedor}</p></td>
            <td className="px-2 py-1.5 text-right text-gray-600">{data.unidad==="kg"?fmtQ(data.cantidad,"kg"):`${data.cantidad} ${data.unidad}`}</td>
            <td className="px-2 py-1.5 text-right"><span className="font-semibold">{fmt(data.total_real)}</span>{Math.abs(desv)>5&&<span className={`text-xs ml-1 ${desv>0?"text-red-500":"text-emerald-500"}`}>{desv>0?"+":""}{desv.toFixed(0)}%</span>}</td>
            <td className="px-2 py-1.5 text-right">
              <div className="flex items-center justify-end gap-1"><div className="w-12 bg-gray-100 rounded-full h-1.5"><div className="h-1.5 rounded-full" style={{width:`${Math.min(pctTotal,100)}%`,background:"#e2a52a"}}/></div><span className="text-xs text-gray-500 w-8">{pctTotal.toFixed(0)}%</span></div>
            </td>
          </tr>);})}</tbody></table></div>}
      </div>
    </div>

    {/* PEDIDOS ACTIVOS */}
    {pedidosActivosMes.length>0&&<div className="bg-white border border-gray-200 rounded-xl p-4">
      <h3 className="text-sm font-bold text-gray-700 mb-3">Pedidos activos</h3>
      {pedidosActivosMes.map(p=>{
        const det=pedidoDetalle.filter(d=>d.pedido_id===p.id);
        const real=det.reduce((s,d)=>s+d.cantidad*(d.costo_real||d.costo_referencia),0);
        const sinPrecio=det.filter(d=>!d.costo_real).length;
        return(<div key={p.id} className="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
          <div className="flex items-center gap-2"><span className="font-medium text-gray-800">#{p.numero_pedido}</span>{estatusBadge(p.estatus)}{sinPrecio>0&&<span className="text-xs text-amber-600">{sinPrecio} sin precio</span>}</div>
          <span className="font-semibold text-gray-700">{fmt(real)}</span>
        </div>);
      })}
    </div>}

    {/* COMPRAS DIRECTAS Y GASTOS DEL MES */}
    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
      <div className="bg-white border border-gray-200 rounded-xl p-4">
        <h3 className="text-sm font-bold text-gray-700 mb-3">Compras directas — <span className="capitalize">{mesNombre}</span></h3>
        {(()=>{const cdMes=(comprasDirectas||[]).filter(c=>{const f=c.fecha||c.created_at?.split("T")[0];return f>=mesInicio&&f<=mesFin;});const totalCD=cdMes.reduce((s,c)=>s+parseFloat(c.costo_total||0),0);return cdMes.length===0?<p className="text-sm text-gray-400">Sin compras directas este mes</p>:<div>
          <div className="flex justify-between mb-3"><span className="text-sm text-gray-600">{cdMes.length} compras</span><span className="font-bold" style={{color:"#e2a52a"}}>{fmt(totalCD)}</span></div>
          <div className="space-y-1">{cdMes.slice(0,8).map(c=>{const cat=catalogo.find(x=>x.id===c.catalogo_id)||{};const prov=proveedores.find(x=>x.id===c.proveedor_id)||{};return(<div key={c.id} className="flex justify-between text-sm py-1 border-b border-gray-50"><div><span className="text-gray-800">{cat.articulo||"?"}</span><span className="text-gray-400 text-xs ml-2">{prov.nombre||""}</span></div><span className="font-semibold text-gray-700">{fmt(c.costo_total)}</span></div>);})}</div>
        </div>;})()}
      </div>
      <div className="bg-white border border-gray-200 rounded-xl p-4">
        <h3 className="text-sm font-bold text-gray-700 mb-3">Gastos operativos — <span className="capitalize">{mesNombre}</span></h3>
        {(()=>{const gMes=(gastosOp||[]).filter(g=>{const f=g.fecha||g.created_at?.split("T")[0];return f>=mesInicio&&f<=mesFin;});const totalG=gMes.reduce((s,g)=>s+parseFloat(g.monto||0),0);const byCat={};gMes.forEach(g=>{const k=g.categoria||"Otros";if(!byCat[k])byCat[k]=0;byCat[k]+=parseFloat(g.monto||0);});const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);return gMes.length===0?<p className="text-sm text-gray-400">Sin gastos este mes</p>:<div>
          <div className="flex justify-between mb-3"><span className="text-sm text-gray-600">{gMes.length} gastos</span><span className="font-bold text-red-600">{fmt(totalG)}</span></div>
          {cats.map(([cat,total])=><div key={cat} className="flex justify-between text-sm py-1 border-b border-gray-50"><span className="text-gray-800">{cat}</span><span className="font-semibold text-red-600">{fmt(total)}</span></div>)}
        </div>;})()}
      </div>
    </div>
  </div>);
}

// ======================== CATÁLOGO (solo Admin) ========================
function CatalogoView({catalogo,setCatalogo,proveedores,setProveedores,unidades,inventario,flujos,insumos,setInsumos}){
  const [filter,setFilter]=useState("");
  const [filterProv,setFilterProv]=useState("");
  const [editing,setEditing]=useState(null);
  const [editData,setEditData]=useState({});
  const [adding,setAdding]=useState(false);
  const [newItem,setNewItem]=useState({sku:"",articulo:"",tipo_producto:"VERDURA",unidad_clave:"kg",costo_referencia:0,proveedor_id:"",notas:""});
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState(null);
  const [addingProv,setAddingProv]=useState(false);
  const [newProv,setNewProv]=useState({nombre:"",tipo_flujo_id:""});
  const [catTab,setCatTab]=useState("productos");
  const [editingProvId,setEditingProvId]=useState(null);
  const [editProvData,setEditProvData]=useState({nombre:"",tipo_flujo_id:""});
  // v7.2: gestión de insumos base
  const [editingIns,setEditingIns]=useState(null);
  const [editInsData,setEditInsData]=useState({});
  const [filterIns,setFilterIns]=useState("");
  // v7.8: alta unificada — insumo + su presentación de compra en un solo popup
  const [modalOpen,setModalOpen]=useState(false);
  const [nModo,setNModo]=useState("nuevo"); // "nuevo" | "existente"
  const [nIns,setNIns]=useState({nombre:"",unidad_base:"g",tipo_control:"inventariable",categoria_gasto:""});
  const [nInsExist,setNInsExist]=useState(null); // {id,nombre,unidad_base}
  const [nPres,setNPres]=useState({tipo_producto:"ABARROTES",articulo:"",unidad_clave:"pz",contenido:1,costo_referencia:0,proveedor_id:"",aplica_iva:true,notas:""});
  // v7.17: el aviso del popup vive DENTRO del popup. Antes los errores del alta
  // (falta proveedor, falta nombre, error del servidor) se escribían en el
  // banner de la página, que queda TAPADO por el overlay del popup: se
  // apretaba "Guardar", no pasaba nada visible y parecía que sí había guardado.
  const [modalMsg,setModalMsg]=useState(null);

  const saveIns=async(x)=>{
    setSaving(true);
    const upd={nombre:editInsData.nombre.trim().toUpperCase(),unidad_base:editInsData.unidad_base,tipo_control:editInsData.tipo_control,categoria_gasto:editInsData.tipo_control==="gasto"?(editInsData.categoria_gasto||"Insumos generales"):null};
    await sbPatch("insumos",x.id,upd);
    setInsumos(insumos.map(i=>i.id===x.id?{...i,...upd}:i));
    setMsg(`${upd.nombre} actualizado`);
    setEditingIns(null);setSaving(false);
    setTimeout(()=>setMsg(null),3000);
  };
  // v7.18: marca esta presentación como la preferida del insumo — la que se
  // sugiere a sucursal por omisión. Hay un índice único de una preferida por
  // insumo, así que primero se apaga la anterior y luego se prende la nueva.
  const togglePreferida=async(p)=>{
    if(!p.insumo_id||p.preferida)return;
    setSaving(true);
    const hermanas=catalogo.filter(c=>c.insumo_id===p.insumo_id&&c.preferida&&c.id!==p.id);
    for(const h of hermanas)await sbPatch("catalogo",h.id,{preferida:false});
    const r=await sbPatchE("catalogo",p.id,{preferida:true});
    if(r.error){
      setMsg("No se pudo marcar como preferida: "+(r.error.message||"error desconocido"));
      for(const h of hermanas)await sbPatch("catalogo",h.id,{preferida:true});
    }else{
      setCatalogo(catalogo.map(c=>c.insumo_id===p.insumo_id?{...c,preferida:c.id===p.id}:c));
      setMsg(`${p.articulo} es ahora la presentación sugerida a sucursal`);
    }
    setSaving(false);
    setTimeout(()=>setMsg(null),4000);
  };
  const delIns=async(x)=>{
    const nPres=catalogo.filter(c=>c.insumo_id===x.id).length;
    if(nPres>0){alert(`"${x.nombre}" tiene ${nPres} presentación(es) en el catálogo — apunta esos productos a otro insumo primero.`);return;}
    if(!confirm(`¿Desactivar insumo "${x.nombre}"?`))return;
    await sbPatch("insumos",x.id,{activo:false});
    setInsumos(insumos.filter(i=>i.id!==x.id));
  };

  // Auto-serial SKU por tipo
  const prefixMap={PROTEINAS:"PRO",SUPLEMENTO:"SUP",EMPAQUE:"EMP",VERDURA:"VER",FRUTA:"FRU",LIMPIEZA:"LIM",ABARROTES:"ABA",COCINA:"COC",OTRO:"OTR"};
  const genCatSku=(tipo)=>{
    const prefix=prefixMap[tipo]||tipo.substring(0,3).toUpperCase();
    const existing=catalogo.filter(c=>c.sku.startsWith(prefix+"-")).map(c=>parseInt(c.sku.split("-")[1])||0);
    const next=existing.length>0?Math.max(...existing)+1:1;
    return`${prefix}-${String(next).padStart(3,"0")}`;
  };

  // Delete product (soft delete)
  const handleDelete=async(p)=>{
    const hasInv=p.inv_id;
    const msg=hasInv?`¿Eliminar "${p.articulo}" del catálogo Y del inventario de almacén?`:`¿Eliminar "${p.articulo}" del catálogo?`;
    if(!confirm(msg))return;
    setSaving(true);
    // First desvinculate
    if(hasInv)await sbPatch("catalogo",p.id,{inventario_almacen_id:null});
    // Soft delete catálogo
    await sbPatch("catalogo",p.id,{activo:false});
    // Delete almacén + lotes if linked
    if(hasInv){
      await sbDeleteWhere("lotes_almacen",`inventario_id=eq.${hasInv}`);
      await sbDelete("inventario_almacen",hasInv);
    }
    // v7.18: si la que se va era la preferida, se hereda a otra hermana. Si no,
    // el insumo se queda sin default y vuelve callado a "la más barata por
    // unidad base", que es justo el criterio que estamos corrigiendo.
    let resto=catalogo.filter(c=>c.id!==p.id);
    if(p.preferida&&p.insumo_id){
      const heredera=resto.find(c=>c.insumo_id===p.insumo_id);
      if(heredera){await sbPatch("catalogo",heredera.id,{preferida:true});resto=resto.map(c=>c.id===heredera.id?{...c,preferida:true}:c);}
    }
    setCatalogo(resto);
    setMsg(`${p.articulo} eliminado${hasInv?" (catálogo + almacén)":""}`);
    setSaving(false);
    setTimeout(()=>setMsg(null),3000);
  };

  // Add new provider (Admin only)
  const handleAddProv=async()=>{
    if(!newProv.nombre.trim()||!newProv.tipo_flujo_id){setMsg("Completa nombre y tipo de flujo");return;}
    setSaving(true);
    const res=await sbPost("proveedores",{nombre:newProv.nombre.trim(),tipo_flujo_id:newProv.tipo_flujo_id,activo:true});
    if(res&&res[0]){
      const fl=(flujos||[]).find(f=>f.id===newProv.tipo_flujo_id)||{};
      setProveedores([...proveedores,{id:res[0].id,nombre:newProv.nombre.trim(),tipo_flujo:fl.nombre||"?",quien_captura:fl.quien_captura_precio||"?"}]);
      setMsg(`Proveedor "${newProv.nombre.trim()}" agregado`);
      setNewProv({nombre:"",tipo_flujo_id:""});
      setAddingProv(false);
    }else{setMsg("Error al agregar proveedor");}
    setSaving(false);
    setTimeout(()=>setMsg(null),3000);
  };

  const startEditProv=(p)=>{setEditingProvId(p.id);const fl=(flujos||[]).find(f=>f.nombre===p.tipo_flujo);setEditProvData({nombre:p.nombre,tipo_flujo_id:fl?.id||""});};

  const saveEditProv=async(p)=>{
    setSaving(true);
    const fl=(flujos||[]).find(f=>f.id===editProvData.tipo_flujo_id)||{};
    await sbPatch("proveedores",p.id,{nombre:editProvData.nombre.trim(),tipo_flujo_id:editProvData.tipo_flujo_id});
    setProveedores(proveedores.map(pr=>pr.id===p.id?{...pr,nombre:editProvData.nombre.trim(),tipo_flujo:fl.nombre||pr.tipo_flujo,quien_captura:fl.quien_captura_precio||pr.quien_captura}:pr));
    setMsg(`${editProvData.nombre.trim()} actualizado`);
    setEditingProvId(null);setSaving(false);
    setTimeout(()=>setMsg(null),3000);
  };

  const handleDeleteProv=async(p)=>{
    const usedInCat=catalogo.some(c=>c.proveedor_id===p.id);
    if(usedInCat){alert(`No se puede eliminar "${p.nombre}" — tiene productos asignados en catálogo. Reasígnalos primero.`);return;}
    if(!confirm(`¿Eliminar proveedor "${p.nombre}"?`))return;
    setSaving(true);
    await sbPatch("proveedores",p.id,{activo:false});
    setProveedores(proveedores.filter(pr=>pr.id!==p.id));
    setMsg(`${p.nombre} eliminado`);
    setSaving(false);
    setTimeout(()=>setMsg(null),3000);
  };

  const norm=(s)=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const filtered=catalogo.filter(p=>{const q=norm(filter);const insN=insumos.find(x=>x.id===p.insumo_id)?.nombre||"";const textMatch=!q||norm(p.articulo).includes(q)||norm(p.sku).includes(q)||norm(p.tipo_producto).includes(q)||norm(p.proveedor_nombre).includes(q)||norm(insN).includes(q);const provMatch=!filterProv||p.proveedor_id===filterProv;return textMatch&&provMatch;});
  const tipos=[...new Set(catalogo.map(c=>c.tipo_producto))].sort();

  const startEdit=(p)=>{setEditing(p.id);setEditData({articulo:p.articulo,costo_referencia:p.costo_referencia,proveedor_id:p.proveedor_id,unidad_clave:p.unidad_clave,notas:p.notas||"",aplica_iva:p.aplica_iva!==false,inv_id:p.inv_id||"",insumo_id:p.insumo_id||"",contenido:p.contenido||1});};

  const saveEdit=async(p)=>{
    setSaving(true);setMsg(null);
    const unid=unidades.find(u=>u.clave===editData.unidad_clave);
    const updates={articulo:editData.articulo.toUpperCase().trim(),costo_referencia:editData.costo_referencia,proveedor_id:editData.proveedor_id,notas:editData.notas||null,aplica_iva:editData.aplica_iva,inventario_almacen_id:editData.inv_id||null,insumo_id:editData.insumo_id||null,contenido:parseFloat(editData.contenido)||1};
    if(unid)updates.unidad_id=unid.id;
    const res=await sbPatch("catalogo",p.id,updates);
    if(res){
      const prov=proveedores.find(pr=>pr.id===editData.proveedor_id);
      setCatalogo(catalogo.map(c=>c.id===p.id?{...c,articulo:editData.articulo.toUpperCase().trim(),costo_referencia:parseFloat(editData.costo_referencia),proveedor_id:editData.proveedor_id,proveedor_nombre:prov?.nombre||c.proveedor_nombre,unidad_clave:editData.unidad_clave,notas:editData.notas,aplica_iva:editData.aplica_iva,inv_id:editData.inv_id||null,insumo_id:editData.insumo_id||null,contenido:parseFloat(editData.contenido)||1}:c));
      setMsg(`${editData.articulo.toUpperCase().trim()} actualizado`);
    }else{setMsg("Error al guardar");}
    setEditing(null);setSaving(false);
    setTimeout(()=>setMsg(null),3000);
  };

  // v7.7: SKU único garantizado. genCatSku solo ve el catálogo activo en
  // memoria; si un producto se borró (queda inactivo) su SKU sigue ocupado en la
  // base y el UNIQUE(sku) rechaza el alta. Aquí consultamos el número más alto
  // real (activos + inactivos) del prefijo y arrancamos desde ahí.
  const siguienteSkuReal=async(tipo)=>{
    const prefix=prefixMap[tipo]||tipo.substring(0,3).toUpperCase();
    let maxN=0;
    try{
      const filas=await sbGet("catalogo",`sku=like.${prefix}-*&select=sku`);
      (filas||[]).forEach(r=>{const n=parseInt(String(r.sku).split("-")[1])||0;if(n>maxN)maxN=n;});
    }catch(e){/* si falla la consulta caemos al cálculo local */}
    // nunca por debajo de lo que ya vemos activo
    catalogo.filter(c=>c.sku.startsWith(prefix+"-")).forEach(c=>{const n=parseInt(c.sku.split("-")[1])||0;if(n>maxN)maxN=n;});
    return{prefix,n:maxN+1};
  };
  const bumpSku=(sku)=>{const[p,n]=sku.split("-");return`${p}-${String((parseInt(n)||0)+1).padStart(3,"0")}`;};
  const esDupSku=(err,status)=>status===409||(err&&(String(err.code)==="23505"||/duplicat|already exists|unique|sku/i.test(err.message||err.details||"")));

  const saveNew=async()=>{
    if(!newItem.articulo||!newItem.proveedor_id){setMsg("Completa artículo y proveedor");return;}
    setSaving(true);setMsg(null);
    const unid=unidades.find(u=>u.clave===newItem.unidad_clave);
    if(!unid){setMsg(`Error: unidad "${newItem.unidad_clave}" no encontrada. Recarga la página.`);setSaving(false);return;}
    // v7.2: cada producto nuevo del catálogo nace con su insumo base (contenido=1);
    // si es una presentación de un insumo existente, se re-apunta después con Editar.
    const esGasto=newItem.tipo_producto==="LIMPIEZA";
    const insRes=await sbPost("insumos",{nombre:newItem.articulo.toUpperCase().trim(),unidad_base:newItem.unidad_clave,tipo_control:esGasto?"gasto":"inventariable",categoria_gasto:esGasto?"Limpieza":null});
    const insumoId=insRes&&insRes[0]?insRes[0].id:null;
    // SKU real y reintento ante choque de clave única
    const{prefix,n}=await siguienteSkuReal(newItem.tipo_producto);
    let sku=`${prefix}-${String(n).padStart(3,"0")}`;
    let res=null,lastErr=null;
    for(let intento=0;intento<25;intento++){
      const data={sku,articulo:newItem.articulo.toUpperCase().trim(),tipo_producto:newItem.tipo_producto,unidad_id:unid.id,costo_referencia:newItem.costo_referencia||0,proveedor_id:newItem.proveedor_id,notas:newItem.notas||null,activo:true,insumo_id:insumoId,contenido:1};
      const r=await sbPostE("catalogo",data);
      if(r.data&&r.data[0]){res=r.data;break;}
      lastErr=r.error;
      if(esDupSku(r.error,r.status)){sku=bumpSku(sku);continue;}
      break; // error distinto: no tiene sentido reintentar
    }
    if(res&&res[0]){
      const prov=proveedores.find(pr=>pr.id===newItem.proveedor_id);
      if(insumoId)setInsumos(prev=>[...prev,insRes[0]]);
      setCatalogo([...catalogo,{id:res[0].id,sku,articulo:newItem.articulo.toUpperCase().trim(),tipo_producto:newItem.tipo_producto,unidad_clave:newItem.unidad_clave,costo_referencia:parseFloat(newItem.costo_referencia)||0,proveedor_id:newItem.proveedor_id,proveedor_nombre:prov?.nombre||"?",notas:newItem.notas,aplica_iva:true,inv_id:res[0].inventario_almacen_id||null,insumo_id:insumoId,contenido:1}]);
      setMsg(`${newItem.articulo.toUpperCase().trim()} agregado como ${sku}`);
      setNewItem({sku:genCatSku(newItem.tipo_producto),articulo:"",tipo_producto:newItem.tipo_producto,unidad_clave:"kg",costo_referencia:0,proveedor_id:"",notas:""});
      setAdding(false);
    }else{
      // Falló: revertir el insumo recién creado para no dejar huérfanos.
      if(insumoId)await sbDelete("insumos",insumoId);
      const det=lastErr?(lastErr.message||lastErr.details||JSON.stringify(lastErr)):"causa desconocida";
      setMsg(`Error al agregar: ${det}`);
    }
    setSaving(false);
    setTimeout(()=>setMsg(null),6000);
  };

  // v7.8: abre el popup unificado en limpio
  const abrirModal=()=>{
    setNModo("nuevo");
    setNIns({nombre:"",unidad_base:"g",tipo_control:"inventariable",categoria_gasto:""});
    setNInsExist(null);
    setNPres({tipo_producto:"ABARROTES",articulo:"",unidad_clave:"pz",contenido:1,costo_referencia:0,proveedor_id:"",aplica_iva:true,notas:""});
    setModalMsg(null);
    setModalOpen(true);
  };
  // v7.8: crea (insumo nuevo + presentación) o (solo presentación de un insumo existente)
  const guardarNuevo=async()=>{
    if(nModo==="nuevo"&&!nIns.nombre.trim()){setModalMsg("Falta el nombre del insumo (paso 1).");return;}
    if(nModo==="existente"&&!nInsExist){setModalMsg("Falta elegir el insumo existente (paso 1).");return;}
    if(!nPres.articulo.trim()){setModalMsg("Falta el nombre de la presentación de compra (paso 2).");return;}
    if(!nPres.proveedor_id){setModalMsg("Falta elegir el proveedor (paso 2). Sin proveedor no se puede guardar la presentación.");return;}
    const cont=parseFloat(nPres.contenido);
    if(!(cont>0)){setModalMsg("El contenido debe ser mayor a 0 (paso 2): cuántos "+(nModo==="existente"?(nInsExist?.unidad_base||"unidades base"):nIns.unidad_base)+" trae el paquete.");return;}
    const unid=unidades.find(u=>u.clave===nPres.unidad_clave);
    if(!unid){setModalMsg("Unidad de compra inválida.");return;}
    setSaving(true);setModalMsg(null);
    let insumoId,insumoObj,createdIns=false;
    if(nModo==="existente"){insumoId=nInsExist.id;insumoObj=insumos.find(i=>i.id===insumoId)||nInsExist;}
    else{
      const esGasto=nIns.tipo_control==="gasto";
      // v7.17: sbPostE en vez de sbPost para poder decir POR QUÉ falló en lugar
      // de adivinar "¿nombre repetido?".
      const insR=await sbPostE("insumos",{nombre:nIns.nombre.toUpperCase().trim(),unidad_base:nIns.unidad_base,tipo_control:nIns.tipo_control,categoria_gasto:esGasto?(nIns.categoria_gasto.trim()||"Insumos generales"):null,activo:true});
      const ins=insR.data;
      if(!(ins&&ins[0])){setModalMsg("No se pudo crear el insumo: "+(insR.error?.message||insR.error?.details||"causa desconocida"));setSaving(false);return;}
      insumoId=ins[0].id;insumoObj=ins[0];createdIns=true;
    }
    const{prefix,n}=await siguienteSkuReal(nPres.tipo_producto);
    let sku=`${prefix}-${String(n).padStart(3,"0")}`;
    let res=null,lastErr=null;
    for(let i=0;i<25;i++){
      // v7.18: la primera presentación de un insumo nace preferida. Las
      // siguientes no, para no robarle el default a la que ya se compra.
      const esPrimera=!catalogo.some(c=>c.insumo_id===insumoId);
      const data={sku,articulo:nPres.articulo.toUpperCase().trim(),tipo_producto:nPres.tipo_producto,unidad_id:unid.id,costo_referencia:parseFloat(nPres.costo_referencia)||0,proveedor_id:nPres.proveedor_id,notas:nPres.notas||null,activo:true,insumo_id:insumoId,contenido:cont,aplica_iva:nPres.aplica_iva,preferida:esPrimera};
      const r=await sbPostE("catalogo",data);
      if(r.data&&r.data[0]){res=r.data;break;}
      lastErr=r.error;
      if(esDupSku(r.error,r.status)){sku=bumpSku(sku);continue;}
      break;
    }
    if(res&&res[0]){
      const prov=proveedores.find(pr=>pr.id===nPres.proveedor_id);
      if(createdIns)setInsumos(prev=>[...prev,insumoObj]);
      setCatalogo([...catalogo,{id:res[0].id,sku,articulo:nPres.articulo.toUpperCase().trim(),tipo_producto:nPres.tipo_producto,unidad_clave:nPres.unidad_clave,costo_referencia:parseFloat(nPres.costo_referencia)||0,proveedor_id:nPres.proveedor_id,proveedor_nombre:prov?.nombre||"?",notas:nPres.notas,aplica_iva:nPres.aplica_iva,inv_id:res[0].inventario_almacen_id||null,insumo_id:insumoId,contenido:cont,preferida:res[0].preferida===true}]);
      setMsg(`${nPres.articulo.toUpperCase().trim()} agregada como ${sku} — insumo: ${insumoObj.nombre}`);
      setModalMsg(null);
      setModalOpen(false);
    }else{
      if(createdIns)await sbDelete("insumos",insumoId);
      const det=lastErr?(lastErr.message||lastErr.details||JSON.stringify(lastErr)):"causa desconocida";
      setModalMsg(`No se guardó nada. Error al agregar la presentación: ${det}`);
    }
    setSaving(false);
    setTimeout(()=>setMsg(null),6000);
  };

  return(<div>
    <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div><h2 className="text-lg font-bold text-gray-900">Catálogo</h2><p className="text-sm text-gray-500">{catalogo.length} presentaciones de compra · {proveedores.length} proveedores</p></div>
      <div className="flex gap-2">
        {(catTab==="productos"||catTab==="insumos")&&<Btn onClick={abrirModal}>+ Nuevo insumo / presentación</Btn>}
        {catTab==="proveedores"&&<Btn onClick={()=>setAddingProv(!addingProv)}>{addingProv?"Cancelar":"+ Nuevo proveedor"}</Btn>}
      </div>
    </div>

    <div className="flex gap-1 mb-4">
      <button onClick={()=>{setCatTab("productos");setAddingProv(false);}} className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all ${catTab==="productos"?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={catTab==="productos"?{background:"#e2a52a"}:{}}>Presentaciones de compra ({catalogo.length})</button>
      <button onClick={()=>{setCatTab("proveedores");setAdding(false);}} className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all ${catTab==="proveedores"?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={catTab==="proveedores"?{background:"#d6816c"}:{}}>Proveedores ({proveedores.length})</button>
      <button onClick={()=>{setCatTab("insumos");setAdding(false);setAddingProv(false);}} className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all ${catTab==="insumos"?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={catTab==="insumos"?{background:"#77b7b4"}:{}}>Insumos ({insumos.length})</button>
    </div>

    {msg&&<div className={`rounded-xl p-3 mb-4 text-sm font-medium ${msg.includes("Error")||msg.includes("No se puede")?"bg-red-50 text-red-800 border border-red-200":"bg-emerald-50 text-emerald-800 border border-emerald-200"}`}>{msg}</div>}

    {/* ===== PRODUCTOS TAB ===== */}
    {catTab==="productos"&&<div>
    <div className="flex gap-2 mb-4">
      <div className="relative flex-1"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none">🔍</span><input className="w-full border border-gray-200 rounded-xl pl-9 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-amber-400" placeholder="Buscar presentación por nombre, SKU, tipo, insumo o proveedor..." value={filter} onChange={e=>setFilter(e.target.value)}/></div>
      <select className="border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white" value={filterProv} onChange={e=>setFilterProv(e.target.value)}>
        <option value="">Todos los proveedores</option>
        {proveedores.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}
      </select>
    </div>
    <div className="overflow-x-auto rounded-xl border border-gray-200 bg-white">
      <table className="w-full text-sm"><thead className="bg-gray-50"><tr>
        {["SKU","Artículo","Tipo","Unidad","Costo ref","IVA","Insumo / contenido","Proveedor","Almacén","Notas",""].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${h==="Costo ref"?"text-right":h==="IVA"?"text-center":"text-left"}`}>{h}</th>)}
      </tr></thead><tbody>{filtered.map(p=>{
        const isEditing=editing===p.id;
        return(<tr key={p.id} className={`border-t border-gray-100 ${isEditing?"bg-amber-50":""}`}>
          <td className="px-3 py-2 font-mono text-xs text-gray-500">{p.sku}</td>
          <td className="px-3 py-2 font-medium text-gray-900">{isEditing?<input className="w-full border border-amber-300 rounded px-1 py-0.5 text-sm bg-amber-50 font-medium focus:ring-2 focus:ring-amber-400" value={editData.articulo} onChange={e=>setEditData({...editData,articulo:e.target.value})}/>:p.articulo}</td>
          <td className="px-3 py-2"><Badge v={({PROTEINAS:"danger",SUPLEMENTO:"purple",EMPAQUE:"info",FRUTA:"warning"})[p.tipo_producto]||"success"}>{p.tipo_producto}</Badge></td>
          <td className="px-3 py-2">{isEditing?<select className="border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" value={editData.unidad_clave} onChange={e=>setEditData({...editData,unidad_clave:e.target.value})}>{unidades.map(u=><option key={u.clave} value={u.clave}>{u.clave}</option>)}</select>:<span className="text-gray-600">{p.unidad_clave}</span>}</td>
          <td className="px-3 py-2 text-right">{isEditing?<input type="number" step="0.01" className="w-24 text-right border border-amber-300 rounded px-1 py-0.5 text-sm bg-amber-50 focus:ring-2 focus:ring-amber-400" value={editData.costo_referencia} onChange={e=>setEditData({...editData,costo_referencia:parseFloat(e.target.value)||0})}/>:<span className="font-semibold text-gray-800">{fmt(p.costo_referencia)}</span>}</td>
          <td className="px-3 py-2 text-center">{isEditing?<label className="flex items-center justify-center gap-1 cursor-pointer"><input type="checkbox" checked={editData.aplica_iva} onChange={e=>setEditData({...editData,aplica_iva:e.target.checked})} className="w-4 h-4 rounded border-amber-300 text-amber-500 focus:ring-amber-400"/><span className="text-xs">{editData.aplica_iva?"Sí":"No"}</span></label>:p.aplica_iva?<span className="text-xs text-gray-500">16%</span>:<span className="text-xs text-emerald-600 font-semibold">Exento</span>}</td>
          <td className="px-3 py-2">{isEditing?<div className="flex gap-1 items-center"><select className="border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" style={{maxWidth:"110px"}} value={editData.insumo_id||""} onChange={e=>setEditData({...editData,insumo_id:e.target.value})}><option value="">Sin insumo</option>{insumos.map(x=><option key={x.id} value={x.id}>{x.nombre}</option>)}</select><span className="text-xs text-gray-400">×</span><input type="number" min="0" step="0.01" className="w-16 border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50 text-right" title="Contenido: unidades base por unidad de compra" value={editData.contenido} onChange={e=>setEditData({...editData,contenido:e.target.value})}/></div>:(()=>{const ins=insumos.find(x=>x.id===p.insumo_id);if(!ins)return<span className="text-xs text-red-500 font-medium">sin insumo</span>;
            // v7.18: la estrella sólo tiene sentido cuando el insumo tiene varias
            // presentaciones; con una sola es preferida por definición.
            const varias=catalogo.filter(c=>c.insumo_id===p.insumo_id).length>1;
            return<span className="text-xs text-gray-600">{ins.nombre} <span className="text-teal-600 font-semibold">×{p.contenido} {ins.unidad_base}</span>{ins.tipo_control==="gasto"&&<Badge v="default">gasto</Badge>}
              {varias&&(p.preferida
                ? <span className="ml-1 text-amber-500 font-bold" title="Presentación sugerida a sucursal por omisión">★</span>

// ======================== RECEPCIÓN DE MERCANCÍA (Sucursal) ========================
function RecepcionView({pedidos,pedidoDetalle,proveedores,provEstatus,catalogo,recepciones,recepcionDetalle,onRecibir}){
  const [recibiendo,setRecibiendo]=useState(null); // {pedId, provId}
  const [cantRecibida,setCantRecibida]=useState({});
  const [notasRecep,setNotasRecep]=useState({});
  const [saving,setSaving]=useState(false);

  // Pedidos con proveedores pendientes de recepción
  const pendientes=[];
  pedidos.forEach(p=>{
    if(p.estatus==="cerrado")return;
    provEstatus.filter(pe=>pe.pedido_id===p.id).forEach(pe=>{
      if(!["enviado","precios_capturados","completo","surtido"].includes(pe.estatus))return;
      const yaRecibido=recepciones.some(r=>r.pedido_id===p.id&&r.proveedor_id===pe.proveedor_id);
      if(yaRecibido)return;
      const prov=proveedores.find(pr=>pr.id===pe.proveedor_id);
      const items=pedidoDetalle.filter(d=>d.pedido_id===p.id&&d.proveedor_id===pe.proveedor_id);
      if(items.length>0)pendientes.push({pedido:p,proveedor:prov,pe,items});
    });
  });

  // Recientes (ya recibidos)
  const recientes=recepciones.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,10);

  const startRecibir=(pedId,provId,items)=>{
    setRecibiendo({pedId,provId});
    const c={};const n={};
    items.forEach(d=>{c[d.id]=d.cantidad;n[d.id]="";});
    setCantRecibida(c);setNotasRecep(n);
  };

  const confirmarRecepcion=async()=>{
    if(!recibiendo||saving)return;
    setSaving(true);
    const{pedId,provId}=recibiendo;
    const items=pedidoDetalle.filter(d=>d.pedido_id===pedId&&d.proveedor_id===provId);
    const hayFaltante=items.some(d=>(cantRecibida[d.id]||0)!==d.cantidad);
    const estatus=hayFaltante?"con_faltantes":"completo";
    await onRecibir(pedId,provId,estatus,items.map(d=>({pedido_detalle_id:d.id,cantidad_pedida:d.cantidad,cantidad_esperada:d.cantidad,cantidad_recibida:cantRecibida[d.id]||0,tiene_discrepancia:(cantRecibida[d.id]||0)!==d.cantidad,nota:notasRecep[d.id]||null})));
    setRecibiendo(null);setSaving(false);
  };

  if(recibiendo){
    const{pedId,provId}=recibiendo;
    const ped=pedidos.find(p=>p.id===pedId);
    const prov=proveedores.find(p=>p.id===provId);
    const items=pedidoDetalle.filter(d=>d.pedido_id===pedId&&d.proveedor_id===provId);
    const hayFaltante=items.some(d=>(cantRecibida[d.id]||0)!==d.cantidad);
    const todoOk=items.every(d=>(cantRecibida[d.id]||0)===d.cantidad);
    return(<div>
      <button onClick={()=>setRecibiendo(null)} className="text-sm text-gray-500 hover:text-gray-700 mb-4">← Volver</button>
      <div className="flex items-center justify-between mb-4"><div><h2 className="text-lg font-bold text-gray-900">Recepción — {prov?.nombre}</h2><p className="text-sm text-gray-500">Pedido {ped?.numero_pedido} — Valida cantidades recibidas</p></div>
        {todoOk&&<Badge v="success">Todo coincide</Badge>}
        {hayFaltante&&<Badge v="warning">Hay diferencias</Badge>}
      </div>
      <div className="bg-white border border-gray-200 rounded-xl overflow-hidden mb-4"><table className="w-full text-sm"><thead className="bg-gray-50"><tr>
        {["Artículo","Esperado","Recibido","Nota"].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${h==="Esperado"||h==="Recibido"?"text-center":"text-left"}`}>{h}</th>)}
      </tr></thead><tbody>{items.map(d=>{
        const cat=catalogo.find(c=>c.id===d.catalogo_id)||{};
        const esperado=d.cantidad;
        const recibido=cantRecibida[d.id]||0;
        const diff=recibido!==esperado;
        return(<tr key={d.id} className={`border-t border-gray-100 ${diff?"bg-orange-50":""}`}>
          <td className="px-3 py-2 font-medium text-gray-900">{cat.articulo} <span className="text-gray-400 text-xs">{cat.unidad_clave}</span></td>
          <td className="px-3 py-2 text-center text-gray-500">{cat.unidad_clave==="kg"?fmtQ(esperado,"kg"):esperado}</td>
          <td className="px-3 py-2 text-center"><input type="number" min="0" step={cat.unidad_clave==="kg"?"0.25":"1"} className={`w-20 text-center border rounded-lg px-1 py-1 text-sm ${diff?"border-orange-400 bg-orange-50":"border-gray-200"}`} value={cantRecibida[d.id]||""} onChange={e=>setCantRecibida({...cantRecibida,[d.id]:parseFloat(e.target.value)||0})}/></td>
          <td className="px-3 py-2"><input className="w-full border border-gray-200 rounded-lg px-2 py-1 text-xs" placeholder="Nota opcional" value={notasRecep[d.id]||""} onChange={e=>setNotasRecep({...notasRecep,[d.id]:e.target.value})}/></td>
        </tr>);})}</tbody></table></div>
      {hayFaltante&&<div className="bg-orange-50 border border-orange-200 rounded-xl p-3 mb-3"><p className="text-sm font-semibold text-orange-800">Artículos con diferencias:</p><div className="text-xs text-orange-700 mt-1">{items.filter(d=>(cantRecibida[d.id]||0)!==d.cantidad).map(d=>{const cat=catalogo.find(c=>c.id===d.catalogo_id)||{};return<p key={d.id}>{cat.articulo}: esperado {d.cantidad} → recibido {cantRecibida[d.id]||0}</p>;})}</div></div>}
      <div className="flex justify-end gap-2">
        <Btn onClick={()=>{const c={};items.forEach(d=>{c[d.id]=d.cantidad;});setCantRecibida(c);}} color="amber">Todo correcto</Btn>
        <Btn onClick={confirmarRecepcion} disabled={saving} color="green">{saving?"Guardando...":hayFaltante?"Confirmar con faltantes":"Recepción completa ✓"}</Btn>
      </div>
    </div>);
  }

  return(<div>
    <h2 className="text-lg font-bold text-gray-900 mb-1">Recepción de mercancía</h2>
    <p className="text-sm text-gray-500 mb-4">Valida que la mercancía llegó completa</p>
    {pendientes.length===0&&recientes.length===0&&<div className="bg-white border border-gray-200 rounded-xl p-8 text-center"><p className="text-gray-400">No hay recepciones pendientes</p></div>}
    {pendientes.length>0&&<div className="rounded-xl p-4 border-2 border-amber-300 bg-amber-50 mb-4"><h3 className="text-sm font-bold text-amber-800 mb-3">Pendientes de recepción ({pendientes.length})</h3>
      {pendientes.map((p,i)=>{const tot=p.items.reduce((s,d)=>s+d.cantidad*(d.costo_real||d.costo_referencia),0);return(<div key={i} className="bg-white rounded-xl p-3 mb-2 border border-amber-200"><div className="flex justify-between items-center mb-2"><div><span className="font-bold text-gray-900">Pedido {p.pedido.numero_pedido}</span><span className="text-xs text-gray-500 ml-2">{p.proveedor?.nombre}</span><span className="text-xs text-gray-400 ml-2">{p.items.length} artículos</span></div><div className="flex items-center gap-2"><span className="text-sm font-semibold text-gray-700">{fmt(tot)}</span><Btn onClick={()=>startRecibir(p.pedido.id,p.proveedor?.id,p.items)}>Recibir mercancía</Btn></div></div>
        <div className="text-xs text-gray-600">{p.items.map(d=>{const cat=catalogo.find(c=>c.id===d.catalogo_id)||{};return<span key={d.id} className="inline-block bg-gray-100 rounded px-2 py-0.5 mr-1 mb-1">{cat.articulo} ({cat.unidad_clave==="kg"?fmtQ(d.cantidad,"kg"):d.cantidad+" "+cat.unidad_clave})</span>})}</div>
      </div>);})}
    </div>}
    {recientes.length>0&&<div className="rounded-xl p-4 border border-emerald-200 bg-emerald-50"><h3 className="text-sm font-bold text-emerald-800 mb-3">Recepciones recientes</h3>
      {recientes.map(r=>{const ped=pedidos.find(p=>p.id===r.pedido_id);const prov=proveedores.find(p=>p.id===r.proveedor_id);return(<div key={r.id} className="flex items-center justify-between py-2 border-b border-emerald-100 last:border-0"><div className="flex items-center gap-2"><span className="font-medium text-gray-800">Pedido {ped?.numero_pedido}</span><span className="text-xs text-gray-500">{prov?.nombre}</span></div><div className="flex items-center gap-2"><Badge v={r.estatus==="completo"?"success":"warning"}>{r.estatus==="completo"?"Completo":"Con faltantes"}</Badge><span className="text-xs text-gray-400">{new Date(r.created_at).toLocaleDateString("es-MX")}</span></div></div>);})}
    </div>}
  </div>);
}

// ======================== FINANZAS CxP ========================
function FinanzasView({cxp,setCxp,pagos,setPagos,pedidos,proveedores,pedidoDetalle,catalogo}){
  const [tab,setTab]=useState("pendientes");
  const [editingCxp,setEditingCxp]=useState(null);
  const [editFact,setEditFact]=useState({numero:"",fecha:""});
  const [newPago,setNewPago]=useState({cxp_id:"",monto:0,metodo:"transferencia",referencia:"",notas:""});
  const [saving,setSaving]=useState(false);

  const pendientes=cxp.filter(c=>c.estatus!=="pagado");
  const pagados=cxp.filter(c=>c.estatus==="pagado");
  const totalAdeudado=pendientes.reduce((s,c)=>s+(parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0)),0);
  const totalPagadoMes=pagos.filter(p=>{const f=p.fecha_pago||p.created_at?.split("T")[0];const hoy=new Date();const mesInicio=new Date(hoy.getFullYear(),hoy.getMonth(),1).toISOString().split("T")[0];return f>=mesInicio;}).reduce((s,p)=>s+parseFloat(p.monto_pagado),0);

  // By proveedor
  const byProv={};
  pendientes.forEach(c=>{const prov=proveedores.find(p=>p.id===c.proveedor_id);const k=prov?.nombre||"?";if(!byProv[k])byProv[k]={total:0,count:0};byProv[k].total+=parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0);byProv[k].count++;});
  const provSorted=Object.entries(byProv).sort((a,b)=>b[1].total-a[1].total);
  const maxProv=provSorted.length>0?provSorted[0][1].total:1;

  const saveFact=async(cxpId)=>{
    setSaving(true);
    await sbPatch("cuentas_por_pagar",cxpId,{numero_factura:editFact.numero||null,fecha_factura:editFact.fecha||null});
    setCxp(cxp.map(c=>c.id===cxpId?{...c,numero_factura:editFact.numero,fecha_factura:editFact.fecha}:c));
    setEditingCxp(null);setSaving(false);
  };

  const registrarPago=async()=>{
    if(!newPago.cxp_id||newPago.monto<=0)return;
    setSaving(true);
    const res=await sbPost("pagos",{cuenta_id:newPago.cxp_id,monto_pagado:newPago.monto,fecha_pago:new Date().toISOString().split("T")[0],metodo_pago:newPago.metodo,referencia:newPago.referencia||null,nota:newPago.notas||null});
    if(res&&res[0]){
      setPagos([...pagos,res[0]]);
      const c=cxp.find(x=>x.id===newPago.cxp_id);
      if(c){
        const nuevoMontoPagado=parseFloat(c.monto_pagado||0)+newPago.monto;
        const nuevoEstatus=nuevoMontoPagado>=parseFloat(c.monto_total)?"pagado":"parcial";
        await sbPatch("cuentas_por_pagar",c.id,{monto_pagado:nuevoMontoPagado,estatus:nuevoEstatus});
        setCxp(cxp.map(x=>x.id===c.id?{...x,monto_pagado:nuevoMontoPagado,estatus:nuevoEstatus}:x));
      }
      setNewPago({cxp_id:"",monto:0,metodo:"transferencia",referencia:"",notas:""});
      alert("Pago registrado");
    }
    setSaving(false);
  };

  const tabs3=[{id:"pendientes",l:`Pendientes (${pendientes.length})`},{id:"pagar",l:"Registrar pago"},{id:"historial",l:"Historial"},{id:"resumen",l:"Resumen"}];

  return(<div>
    <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div><h2 className="text-lg font-bold text-gray-900">Finanzas — Cuentas por Pagar</h2><p className="text-sm text-gray-500">Control de facturas y pagos</p></div>
      <div className="flex gap-3">
        <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-2 text-right"><p className="text-xs text-red-600">Total adeudado</p><p className="text-xl font-bold text-red-700">{fmt(totalAdeudado)}</p></div>
        <div className="bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-2 text-right"><p className="text-xs text-emerald-600">Pagado este mes</p><p className="text-xl font-bold text-emerald-700">{fmt(totalPagadoMes)}</p></div>
      </div>
    </div>

    <div className="flex gap-1 mb-4">{tabs3.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${tab===t.id?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={tab===t.id?{background:"#d6816c"}:{}}>{t.l}</button>)}</div>

    {/* PENDIENTES */}
    {tab==="pendientes"&&<div>{pendientes.length===0?<div className="bg-white border border-gray-200 rounded-xl p-8 text-center"><p className="text-gray-400">Sin cuentas pendientes</p></div>
    :<div className="bg-white border border-gray-200 rounded-xl overflow-hidden"><table className="w-full text-sm"><thead className="bg-gray-50"><tr>
      {["Pedido","Proveedor","Monto","Pagado","Saldo","Factura","Estatus",""].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${["Monto","Pagado","Saldo"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}
    </tr></thead><tbody>{pendientes.map(c=>{
      const ped=pedidos.find(p=>p.id===c.pedido_id);
      const prov=proveedores.find(p=>p.id===c.proveedor_id);
      const saldo=parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0);
      const isEdit=editingCxp===c.id;
      return(<tr key={c.id} className={`border-t border-gray-100 ${isEdit?"bg-amber-50":""}`}>
        <td className="px-3 py-2 font-medium text-gray-800">{ped?.numero_pedido||"—"}</td>
        <td className="px-3 py-2 text-gray-600 text-xs">{prov?.nombre||"?"}</td>
        <td className="px-3 py-2 text-right font-semibold">{fmt(c.monto_total)}</td>
        <td className="px-3 py-2 text-right text-emerald-600">{fmt(c.monto_pagado||0)}</td>
        <td className="px-3 py-2 text-right font-bold text-red-600">{fmt(saldo)}</td>
        <td className="px-3 py-2">{isEdit?<div className="flex gap-1"><input className="w-24 border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" placeholder="# factura" value={editFact.numero} onChange={e=>setEditFact({...editFact,numero:e.target.value})}/><input type="date" className="border border-amber-300 rounded px-1 py-0.5 text-xs bg-amber-50" value={editFact.fecha} onChange={e=>setEditFact({...editFact,fecha:e.target.value})}/><button onClick={()=>saveFact(c.id)} className="text-xs bg-emerald-500 text-white px-2 py-0.5 rounded">✓</button></div>:<span className="text-xs text-gray-500">{c.numero_factura||<button onClick={()=>{setEditingCxp(c.id);setEditFact({numero:c.numero_factura||"",fecha:c.fecha_factura||""});}} className="text-amber-600 hover:text-amber-800 font-medium">+ Factura</button>}</span>}</td>
        <td className="px-3 py-2"><Badge v={c.estatus==="pagado"?"success":c.estatus==="parcial"?"warning":"danger"}>{c.estatus}</Badge></td>
        <td className="px-3 py-2">{!isEdit&&c.numero_factura&&<button onClick={()=>{setEditingCxp(c.id);setEditFact({numero:c.numero_factura||"",fecha:c.fecha_factura||""});}} className="text-xs text-amber-600 hover:text-amber-800">Editar</button>}</td>
      </tr>);})}</tbody></table></div>}</div>}

    {/* REGISTRAR PAGO */}
    {tab==="pagar"&&<div className="bg-white border-2 border-emerald-300 rounded-xl p-4">
      <h3 className="text-sm font-bold text-emerald-800 mb-3">Registrar pago</h3>
      <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-3">
        <div><label className="text-xs text-gray-500 block mb-1">Cuenta por pagar</label><select className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={newPago.cxp_id} onChange={e=>{setNewPago({...newPago,cxp_id:e.target.value});const c=pendientes.find(x=>x.id===e.target.value);if(c)setNewPago(p=>({...p,cxp_id:e.target.value,monto:parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0)}));}}><option value="">Seleccionar...</option>{pendientes.map(c=>{const ped=pedidos.find(p=>p.id===c.pedido_id);const prov=proveedores.find(p=>p.id===c.proveedor_id);const saldo=parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0);return<option key={c.id} value={c.id}>{ped?.numero_pedido} — {prov?.nombre} — Saldo: {fmt(saldo)}</option>;})}</select></div>
        <div><label className="text-xs text-gray-500 block mb-1">Monto a pagar</label><input type="number" min="0" step="0.01" className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={newPago.monto||""} onChange={e=>setNewPago({...newPago,monto:parseFloat(e.target.value)||0})}/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Método de pago</label><select className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={newPago.metodo} onChange={e=>setNewPago({...newPago,metodo:e.target.value})}><option value="transferencia">Transferencia</option><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option></select></div>
      </div>
      <div className="grid grid-cols-2 gap-3 mb-4">
        <div><label className="text-xs text-gray-500 block mb-1">Referencia</label><input className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="# transferencia, recibo, etc." value={newPago.referencia} onChange={e=>setNewPago({...newPago,referencia:e.target.value})}/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Notas</label><input className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="Opcional" value={newPago.notas} onChange={e=>setNewPago({...newPago,notas:e.target.value})}/></div>
      </div>
      <Btn onClick={registrarPago} disabled={saving||!newPago.cxp_id||newPago.monto<=0} color="green">{saving?"Guardando...":"Registrar pago"}</Btn>
    </div>}

    {/* HISTORIAL */}
    {tab==="historial"&&<div className="bg-white border border-gray-200 rounded-xl overflow-hidden">{pagos.length===0?<div className="p-8 text-center"><p className="text-gray-400">Sin pagos registrados</p></div>
    :<table className="w-full text-sm"><thead className="bg-gray-50"><tr>
      {["Fecha","Pedido","Proveedor","Monto","Método","Referencia"].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${h==="Monto"?"text-right":"text-left"}`}>{h}</th>)}
    </tr></thead><tbody>{pagos.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(p=>{
      const c=cxp.find(x=>x.id===p.cuenta_id);
      const ped=pedidos.find(x=>x.id===c?.pedido_id);
      const prov=proveedores.find(x=>x.id===c?.proveedor_id);
      return(<tr key={p.id} className="border-t border-gray-100">
        <td className="px-3 py-2 text-gray-600 text-xs">{new Date(p.fecha_pago||p.created_at).toLocaleDateString("es-MX")}</td>
        <td className="px-3 py-2 font-medium text-gray-800">{ped?.numero_pedido||"—"}</td>
        <td className="px-3 py-2 text-gray-600 text-xs">{prov?.nombre||"?"}</td>
        <td className="px-3 py-2 text-right font-bold text-emerald-600">{fmt(p.monto_pagado)}</td>
        <td className="px-3 py-2"><Badge v={p.metodo_pago==="transferencia"?"info":p.metodo_pago==="efectivo"?"warning":"purple"}>{p.metodo_pago}</Badge></td>
        <td className="px-3 py-2 text-gray-400 text-xs">{p.referencia||"—"}</td>
      </tr>);})}</tbody></table>}</div>}

    {/* RESUMEN */}
    {tab==="resumen"&&<div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div className="bg-white border border-gray-200 rounded-xl p-4"><h3 className="text-sm font-bold text-gray-700 mb-3">Saldos por proveedor</h3>
          {provSorted.length===0?<p className="text-sm text-gray-400">Sin saldos pendientes</p>:provSorted.map(([prov,data])=>{
            const pct=maxProv>0?(data.total/maxProv)*100:0;
            return(<div key={prov} className="mb-3"><div className="flex justify-between text-sm mb-1"><span className="text-gray-700 font-medium">{prov} <span className="text-gray-400 text-xs">({data.count} facturas)</span></span><span className="font-bold text-red-600">{fmt(data.total)}</span></div><div className="w-full bg-gray-100 rounded-full h-3"><div className="h-3 rounded-full transition-all" style={{width:`${Math.min(pct,100)}%`,background:"#ef4444"}}/></div></div>);
          })}
          {provSorted.length>0&&<div className="border-t border-gray-100 pt-2 mt-2 flex justify-between font-bold text-sm"><span>Total adeudado</span><span className="text-red-600">{fmt(totalAdeudado)}</span></div>}
        </div>
        <div className="bg-white border border-gray-200 rounded-xl p-4"><h3 className="text-sm font-bold text-gray-700 mb-3">Métodos de pago (este mes)</h3>
          {(()=>{const hoy=new Date();const mesInicio=new Date(hoy.getFullYear(),hoy.getMonth(),1).toISOString().split("T")[0];const pagosMes=pagos.filter(p=>(p.fecha_pago||p.created_at?.split("T")[0])>=mesInicio);const byMetodo={};pagosMes.forEach(p=>{const m=p.metodo_pago||"otro";if(!byMetodo[m])byMetodo[m]=0;byMetodo[m]+=parseFloat(p.monto_pagado);});const metodos=Object.entries(byMetodo).sort((a,b)=>b[1]-a[1]);return metodos.length===0?<p className="text-sm text-gray-400">Sin pagos este mes</p>:metodos.map(([m,total])=><div key={m} className="flex justify-between py-2 border-b border-gray-50 last:border-0"><div className="flex items-center gap-2"><Badge v={m==="transferencia"?"info":m==="efectivo"?"warning":"purple"}>{m}</Badge></div><span className="font-bold text-gray-800">{fmt(total)}</span></div>);})()}
        </div>
      </div>
    </div>}
  </div>);
}

// ======================== COMPRAS DIRECTAS (Sucursal) ========================
function ComprasDirectasView({comprasDirectas,setComprasDirectas,catalogo,proveedores,cxp,setCxp,onEntrada}){
  const [form,setForm]=useState({catalogo_id:"",proveedor_id:"",cantidad:0,costo_unitario:0,metodo_pago:"efectivo",nota:""});
  const [saving,setSaving]=useState(false);
  const [filter,setFilter]=useState("");

  const total=form.cantidad*form.costo_unitario;
  const recientes=comprasDirectas.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,20);
  const totalMes=(()=>{const hoy=new Date();const mesInicio=new Date(hoy.getFullYear(),hoy.getMonth(),1).toISOString().split("T")[0];return comprasDirectas.filter(c=>(c.fecha||c.created_at?.split("T")[0])>=mesInicio).reduce((s,c)=>s+parseFloat(c.costo_total||0),0);})();

  const handleSave=async()=>{
    if(!form.catalogo_id||!form.proveedor_id||form.cantidad<=0||form.costo_unitario<=0){alert("Completa todos los campos");return;}
    setSaving(true);
    const costoTotal=Math.round(form.cantidad*form.costo_unitario*100)/100;

        <div><label className="text-xs text-gray-500 block mb-1">Descripción</label><input className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="Pago de luz enero" value={form.descripcion} onChange={e=>setForm({...form,descripcion:e.target.value})}/></div>

        {["Fecha","Categoría","Descripción","Monto","Pago"].map(h=><th key={h} className={`px-3 py-2 font-medium text-gray-500 text-xs ${h==="Monto"?"text-right":"text-left"}`}>{h}</th>)}
