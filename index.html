// SoftRestaurant sigue siendo el POS (ahí viven la terminal bancaria y UberEats).
// FitTaste importa su reporte de "Ventas por producto" (copiado desde Excel/CSV),
// explota recetas y descuenta el inventario de sucursal. El campo ventas.origen
// deja listo el terreno para un conector automático (agente SQL Server o API).
function VentasSRView({productosVenta,setProductosVenta,recetas,setRecetas,ventas,ventaDetalle,catalogo,insumos,invSucursal,onImport,rol}){
  const [tab,setTab]=useState("importar");
  const [fecha,setFecha]=useState(new Date().toISOString().split("T")[0]);
  const [canal,setCanal]=useState("mostrador");
  const [pagosImp,setPagosImp]=useState({efectivo:0,tarjeta:0,plataforma:0,otros:0});
  const [raw,setRaw]=useState("");
  const [importing,setImporting]=useState(false);
  const [editingProd,setEditingProd]=useState(null);
  const [prodData,setProdData]=useState({});
  const [addingProd,setAddingProd]=useState(false);
  const [newProd,setNewProd]=useState({codigo_sr:"",nombre:"",categoria:"",precio_venta:0});
  const [recetaDe,setRecetaDe]=useState(null);
  const [newLinea,setNewLinea]=useState({ref:"",cantidad:0,merma_pct:0});
  // v7.1: preparaciones (sub-recetas)
  const [verTipo,setVerTipo]=useState("platillos");
  const [addingPrep,setAddingPrep]=useState(false);
  const [newPrep,setNewPrep]=useState({nombre:"",unidad:"kg",rendimiento:0});
  const [saving,setSaving]=useState(false);
  const [selVenta,setSelVenta]=useState(null);

  // Parser del texto pegado: TSV (copiado de Excel) o CSV con , o ;
  const parsed=useMemo(()=>{
    const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
    if(lines.length===0)return{rows:[]};
    const first=lines[0];
    const sep=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
    const cells=lines.map(l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,"")));
    const hdr=cells[0].map(c=>c.toLowerCase());
    const findCol=(...keys)=>hdr.findIndex(h=>keys.some(k=>h.includes(k)));
    let iCod=findCol("clave","codigo","código"),iNom=findCol("descrip","producto","nombre","artic"),iCant=findCol("cant"),iImp=findCol("importe","total","venta","monto"),iPre=findCol("precio");
    let dataRows=cells;
    const hasHeader=iNom>=0||iCant>=0||iImp>=0;
    if(hasHeader)dataRows=cells.slice(1);
    else{const n=cells[0].length;if(n>=4){iCod=0;iNom=1;iCant=2;iImp=3;iPre=-1;}else if(n===3){iCod=-1;iNom=0;iCant=1;iImp=2;iPre=-1;}else return{rows:[],error:"Se necesitan al menos 3 columnas: producto, cantidad, importe"};}
    const num=(v)=>parseFloat(String(v||"").replace(/[$,\s]/g,""))||0;
    const rows=dataRows.map(c=>{
      const codigo=iCod>=0?(c[iCod]||""):"";
      const nombre=iNom>=0?(c[iNom]||""):"";
      const cantidad=num(c[iCant]);
      const importe=num(c[iImp]);
      const precio=iPre>=0&&num(c[iPre])>0?num(c[iPre]):(cantidad>0?importe/cantidad:0);
      if(!nombre&&!codigo)return null;
      if(cantidad<=0&&importe<=0)return null;
      const vendibles=productosVenta.filter(p=>!p.es_preparacion);
      const prod=vendibles.find(p=>codigo&&p.codigo_sr&&String(p.codigo_sr).toLowerCase()===codigo.toLowerCase())||vendibles.find(p=>p.nombre.toLowerCase()===(nombre||"").toLowerCase());
      return{codigo,nombre:nombre||codigo,cantidad,importe,precio,prodId:prod?.id||null};
    }).filter(Boolean);
    return{rows};
  },[raw,productosVenta]);

  const nuevos=parsed.rows.filter(r=>!r.prodId).length;
  const sinReceta=parsed.rows.filter(r=>r.prodId&&!recetas.some(x=>x.producto_venta_id===r.prodId)).length;
  const totalImporte=parsed.rows.reduce((s,r)=>s+r.importe,0);
  const totalPagos=(pagosImp.efectivo||0)+(pagosImp.tarjeta||0)+(pagosImp.plataforma||0)+(pagosImp.otros||0);

  const handleImport=async()=>{
    if(parsed.rows.length===0||importing)return;
    setImporting(true);
    const ok=await onImport(fecha,canal,pagosImp,parsed.rows);
    if(ok){setRaw("");setPagosImp({efectivo:0,tarjeta:0,plataforma:0,otros:0});setTab("historial");}
    setImporting(false);
  };

  // --- Productos y recetas ---
  const saveProd=async(p)=>{setSaving(true);const upd=p.es_preparacion?{nombre:prodData.nombre.trim().toUpperCase(),unidad:prodData.unidad||"kg",rendimiento:parseFloat(prodData.rendimiento)||1,updated_at:new Date().toISOString()}:{codigo_sr:prodData.codigo_sr||null,nombre:prodData.nombre.trim(),categoria:prodData.categoria||null,precio_venta:parseFloat(prodData.precio_venta)||0,updated_at:new Date().toISOString()};const res=await sbPatch("productos_venta",p.id,upd);if(res)setProductosVenta(productosVenta.map(x=>x.id===p.id?{...x,...upd}:x));setEditingProd(null);setSaving(false);};
  const addProd=async()=>{if(!newProd.nombre.trim())return;setSaving(true);const res=await sbPost("productos_venta",{codigo_sr:newProd.codigo_sr.trim()||null,nombre:newProd.nombre.trim(),categoria:newProd.categoria.trim()||null,precio_venta:parseFloat(newProd.precio_venta)||0});if(res&&res[0]){setProductosVenta([...productosVenta,res[0]]);setNewProd({codigo_sr:"",nombre:"",categoria:"",precio_venta:0});setAddingProd(false);}else alert("Error al guardar (¿código SR duplicado?)");setSaving(false);};
  const delProd=async(p)=>{
    if(p.es_preparacion&&recetas.some(r=>r.preparacion_id===p.id)){alert(`"${p.nombre}" se usa en otras recetas — quítala de esas recetas primero.`);return;}
    if(!confirm(`¿Desactivar "${p.nombre}"?${p.es_preparacion?"":" Sus ventas históricas se conservan."}`))return;
    await sbPatch("productos_venta",p.id,{activo:false});setProductosVenta(productosVenta.filter(x=>x.id!==p.id));
  };
  const addPrep=async()=>{if(!newPrep.nombre.trim()||newPrep.rendimiento<=0)return;setSaving(true);const res=await sbPost("productos_venta",{nombre:newPrep.nombre.trim().toUpperCase(),es_preparacion:true,unidad:newPrep.unidad,rendimiento:newPrep.rendimiento,precio_venta:0});if(res&&res[0]){setProductosVenta([...productosVenta,res[0]]);setNewPrep({nombre:"",unidad:"kg",rendimiento:0});setAddingPrep(false);setRecetaDe(res[0].id);}else alert("Error al guardar la preparación");setSaving(false);};
  const addLinea=async()=>{
    if(!recetaDe||!newLinea.ref||newLinea.cantidad<=0)return;
    setSaving(true);
    const [tipoRef,refId]=newLinea.ref.split(":");
    const payload={producto_venta_id:recetaDe,cantidad:newLinea.cantidad,merma_pct:newLinea.merma_pct||0};
    if(tipoRef==="prep")payload.preparacion_id=refId;else payload.insumo_id=refId;
    const res=await sbPost("recetas",payload);
    if(res&&res[0]){setRecetas([...recetas,res[0]]);setNewLinea({ref:"",cantidad:0,merma_pct:0});}
    else alert("Error al agregar (¿el insumo ya está en la receta?)");
    setSaving(false);
  };
  const delLinea=async(id)=>{await sbDelete("recetas",id);setRecetas(recetas.filter(r=>r.id!==id));};
  const updLinea=async(id,campo,valor)=>{await sbPatch("recetas",id,{[campo]:valor});setRecetas(recetas.map(r=>r.id===id?{...r,[campo]:valor}:r));};

  const ventasSorted=ventas.slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)||new Date(b.created_at)-new Date(a.created_at));
  const canalBadge=(c)=>({mostrador:"info",ubereats:"success",rappi:"warning",didi:"purple"})[c]||"default";
  const tabsV=[{id:"importar",l:"Importar de SR"},{id:"historial",l:`Historial (${ventas.length})`},{id:"productos",l:`Productos y recetas (${productosVenta.length})`}];

  // v7.1: editor de receta compartido entre platillos y preparaciones.
  // Una línea puede ser insumo del catálogo (cat:) o preparación (prep:).
  const recetaEditorRow=(p,cR,colSpan)=>{
    const esPrepDueno=!!p.es_preparacion;
    const rend=parseFloat(p.rendimiento)||1;
    const precio=parseFloat(p.precio_venta)||0;
    const margen=precio>0?(precio/1.16-cR)/(precio/1.16)*100:0;
    return(<tr><td colSpan={colSpan} className="bg-teal-50/60 px-4 py-3 border-t border-teal-100">
      <p className="text-xs font-bold text-teal-800 mb-2">Receta de {p.nombre}{esPrepDueno?` — ingredientes de UNA TANDA (rinde ${rend} ${p.unidad||"u"})`:" — consumo por unidad vendida"}</p>
      <table className="w-full text-xs mb-2"><thead><tr>{["Ingrediente","Cantidad","Unidad","Merma extra %","Costo unit.","Costo línea",""].map(h=><th key={h} className={`px-2 py-1 font-medium text-gray-500 ${["Cantidad","Merma extra %","Costo unit.","Costo línea"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}</tr></thead><tbody>
      {recetas.filter(r=>r.producto_venta_id===p.id).map(r=>{
        const esPrep=!!r.preparacion_id;
        const prep=esPrep?productosVenta.find(x=>x.id===r.preparacion_id):null;
        const ins=esPrep?null:(insumos.find(x=>x.id===r.insumo_id)||{});
        const cU=esPrep?(costoReceta(r.preparacion_id,recetas,invSucursal,catalogo,productosVenta)/(parseFloat(prep?.rendimiento)||1)):costoInsumo(r.insumo_id,invSucursal,catalogo);
        const cL=(parseFloat(r.cantidad)||0)*(1+(parseFloat(r.merma_pct)||0)/100)*cU;
        return(<tr key={r.id} className="border-t border-teal-100">
          <td className="px-2 py-1 font-medium text-gray-800">{esPrep?<span>{prep?.nombre||"?"} <Badge v="purple">prep</Badge></span>:(ins.nombre||"?")}</td>
          <td className="px-2 py-1 text-right"><input type="number" min="0" step="0.001" className="w-20 text-right border border-gray-200 rounded px-1 py-0.5" defaultValue={r.cantidad} onBlur={e=>{const v=parseFloat(e.target.value)||0;if(v!==parseFloat(r.cantidad))updLinea(r.id,"cantidad",v);}}/></td>
          <td className="px-2 py-1 text-gray-500">{esPrep?(prep?.unidad||"u"):ins.unidad_base}</td>
          <td className="px-2 py-1 text-right"><input type="number" min="0" step="1" className="w-14 text-right border border-gray-200 rounded px-1 py-0.5" defaultValue={r.merma_pct} onBlur={e=>{const v=parseFloat(e.target.value)||0;if(v!==parseFloat(r.merma_pct))updLinea(r.id,"merma_pct",v);}}/></td>
          <td className="px-2 py-1 text-right text-gray-600">{fmt(cU)}</td>
          <td className="px-2 py-1 text-right font-semibold text-teal-700">{fmt(cL)}</td>
          <td className="px-2 py-1 text-right"><button onClick={()=>delLinea(r.id)} className="text-red-400 hover:text-red-600 px-1">✕</button></td>
        </tr>);})}
      </tbody></table>
      <div className="flex gap-2 items-end flex-wrap">
        <div className="flex-1"><label className="text-xs text-gray-500">Agregar ingrediente</label><select className="w-full border border-gray-200 rounded-lg px-2 py-1.5 text-xs" value={newLinea.ref} onChange={e=>setNewLinea({...newLinea,ref:e.target.value})}>
          <option value="">Seleccionar...</option>
          <optgroup label="Preparaciones (sub-recetas)">
            {productosVenta.filter(x=>x.es_preparacion&&x.id!==p.id&&!recetas.some(r=>r.producto_venta_id===p.id&&r.preparacion_id===x.id)).map(x=>{const rx=parseFloat(x.rendimiento)||1;return<option key={x.id} value={"prep:"+x.id}>{x.nombre} ({x.unidad||"u"}) — {fmt(costoReceta(x.id,recetas,invSucursal,catalogo,productosVenta)/rx)}</option>;})}
          </optgroup>
          <optgroup label="Insumos">
            {insumos.filter(x=>x.tipo_control==="inventariable"&&!recetas.some(r=>r.producto_venta_id===p.id&&r.insumo_id===x.id)).map(x=><option key={x.id} value={"ins:"+x.id}>{x.nombre} ({x.unidad_base}) — {fmt(costoInsumo(x.id,invSucursal,catalogo))}/{x.unidad_base}</option>)}
          </optgroup>
        </select></div>
        <div><label className="text-xs text-gray-500">Cantidad</label><input type="number" min="0" step="0.001" className="w-24 border border-gray-200 rounded-lg px-2 py-1.5 text-xs" value={newLinea.cantidad||""} onChange={e=>setNewLinea({...newLinea,cantidad:parseFloat(e.target.value)||0})}/></div>
        <div><label className="text-xs text-gray-500">Merma %</label><input type="number" min="0" step="1" className="w-16 border border-gray-200 rounded-lg px-2 py-1.5 text-xs" value={newLinea.merma_pct||""} onChange={e=>setNewLinea({...newLinea,merma_pct:parseFloat(e.target.value)||0})}/></div>
        <Btn onClick={addLinea} disabled={saving||!newLinea.ref||newLinea.cantidad<=0} color="purple">{saving?"...":"Agregar"}</Btn>
      </div>
      <div className="flex justify-between mt-2 text-sm">
        <span className="text-teal-800 font-medium">{esPrepDueno?<span>Costo de la tanda: <b>{fmt(cR)}</b> → costo por {p.unidad||"u"}: <b>{fmt(cR/rend)}</b></span>:<span>Costo total receta: <b>{fmt(cR)}</b></span>}</span>
        {!esPrepDueno&&precio>0&&<span className="text-gray-600">Precio {fmt(precio)} (con IVA) → margen bruto <b className={margen<50?"text-red-600":"text-emerald-600"}>{margen.toFixed(1)}%</b></span>}
      </div>
    </td></tr>);
  };

  // v7.3: alarma de productos que YA vendieron y no tienen receta (su consumo
  // no está descontando inventario). Típico: alta nueva en SR sin capturar receta.
  const vendidosSinReceta=productosVenta.filter(p=>!p.es_preparacion&&!recetas.some(r=>r.producto_venta_id===p.id)&&ventaDetalle.some(d=>d.producto_venta_id===p.id));

  return(<div>
    <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div><h2 className="text-lg font-bold text-gray-900">Ventas — SoftRestaurant</h2><p className="text-sm text-gray-500">SR es el punto de venta; aquí se importan sus ventas para costeo e inventario</p></div>
    </div>
    {vendidosSinReceta.length>0&&<div className="bg-red-50 border-2 border-red-300 rounded-xl p-3 mb-4">
      <p className="text-sm font-bold text-red-800">⚠ {vendidosSinReceta.length} producto{vendidosSinReceta.length>1?"s":""} con ventas SIN receta — su consumo no está descontando inventario</p>
      <p className="text-xs text-red-700 mt-1">{vendidosSinReceta.slice(0,10).map(p=>p.nombre).join(" · ")}{vendidosSinReceta.length>10?` · y ${vendidosSinReceta.length-10} más…`:""}</p>
      <button onClick={()=>{setTab("productos");setVerTipo("platillos");}} className="text-xs font-semibold text-red-800 underline mt-1">Ir a capturar recetas →</button>
    </div>}
    <div className="flex gap-1 mb-4">{tabsV.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${tab===t.id?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={tab===t.id?{background:"#bfcd3b",color:"#2D2D2D"}:{}}>{t.l}</button>)}</div>

    {/* IMPORTAR */}
    {tab==="importar"&&<div>
      <div className="bg-white border-2 rounded-xl p-4 mb-4" style={{borderColor:"#bfcd3b"}}>
        <h3 className="text-sm font-bold text-gray-700 mb-1">Importar reporte de ventas por producto</h3>
        <p className="text-xs text-gray-500 mb-3">En SoftRestaurant abre el reporte de <b>ventas por producto</b> del día o corte, cópialo (o expórtalo a Excel y copia las celdas) y pégalo aquí. Columnas esperadas: clave/código, descripción, cantidad, importe.</p>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
          <div><label className="text-xs text-gray-500 block mb-1">Fecha de venta</label><input type="date" className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={fecha} onChange={e=>setFecha(e.target.value)}/></div>
          <div><label className="text-xs text-gray-500 block mb-1">Canal</label><select className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={canal} onChange={e=>setCanal(e.target.value)}><option value="mostrador">Mostrador / salón</option><option value="ubereats">UberEats</option><option value="rappi">Rappi</option><option value="didi">DiDi Food</option><option value="otro">Otro</option></select></div>
        </div>
        <textarea className="w-full border border-gray-200 rounded-xl px-3 py-2 text-xs font-mono h-40 focus:ring-2 focus:ring-lime-400" placeholder={"Pega aquí el reporte. Ejemplo:\nClave\tDescripción\tCantidad\tImporte\nBOWL01\tBOWL DE POLLO\t12\t1,548.00\nJUG02\tJUGO VERDE\t8\t440.00"} value={raw} onChange={e=>setRaw(e.target.value)}/>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 my-3">
          {[["efectivo","Efectivo"],["tarjeta","Tarjeta (terminal)"],["plataforma","Plataformas (UberEats…)"],["otros","Otros"]].map(([k,l])=>(<div key={k}><label className="text-xs text-gray-500 block mb-1">{l}</label><input type="number" min="0" step="0.01" className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={pagosImp[k]||""} onChange={e=>setPagosImp({...pagosImp,[k]:parseFloat(e.target.value)||0})}/></div>))}
        </div>
        {totalPagos>0&&Math.abs(totalPagos-totalImporte)>1&&<div className="bg-orange-50 border border-orange-200 rounded-xl p-2 mb-3 text-xs text-orange-800">Formas de pago ({fmt(totalPagos)}) no cuadran con el importe del reporte ({fmt(totalImporte)}). Puedes continuar, pero revisa el corte.</div>}
        {parsed.error&&<div className="bg-red-50 border border-red-200 rounded-xl p-2 mb-3 text-xs text-red-800">{parsed.error}</div>}
        {parsed.rows.length>0&&<div className="mb-3">
          <div className="flex gap-3 mb-2 flex-wrap">
            <Badge v="info">{parsed.rows.length} productos</Badge>
            <Badge v="success">{fmt(totalImporte)} vendidos</Badge>
            {nuevos>0&&<Badge v="warning">{nuevos} productos nuevos (se darán de alta)</Badge>}
            {sinReceta>0&&<Badge v="danger">{sinReceta} sin receta (no descuentan inventario)</Badge>}
          </div>
          <div className="bg-white border border-gray-200 rounded-xl overflow-hidden max-h-64 overflow-y-auto"><table className="w-full text-xs"><thead className="bg-gray-50 sticky top-0"><tr>{["Código SR","Producto","Cant","Importe","Estado","Receta","Costo teórico"].map(h=><th key={h} className={`px-2 py-1.5 font-semibold text-gray-600 uppercase ${["Cant","Importe","Costo teórico"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}</tr></thead><tbody>
            {parsed.rows.map((r,i)=>{const nRec=r.prodId?recetas.filter(x=>x.producto_venta_id===r.prodId).length:0;const cT=r.prodId?costoReceta(r.prodId,recetas,invSucursal,catalogo,productosVenta)*r.cantidad:0;return(<tr key={i} className="border-t border-gray-50">
              <td className="px-2 py-1 font-mono text-gray-500">{r.codigo||"—"}</td>
              <td className="px-2 py-1 font-medium text-gray-800">{r.nombre}</td>
              <td className="px-2 py-1 text-right">{r.cantidad}</td>
              <td className="px-2 py-1 text-right font-semibold">{fmt(r.importe)}</td>
              <td className="px-2 py-1">{r.prodId?<Badge v="success">ok</Badge>:<Badge v="warning">nuevo</Badge>}</td>
              <td className="px-2 py-1">{r.prodId?(nRec>0?<span className="text-teal-600 font-medium">{nRec} insumos</span>:<span className="text-red-500">sin receta</span>):<span className="text-gray-400">—</span>}</td>
              <td className="px-2 py-1 text-right text-gray-600">{cT>0?fmt(cT):"—"}</td>
            </tr>);})}
          </tbody></table></div>
        </div>}
        <Btn onClick={handleImport} disabled={parsed.rows.length===0||importing} color="green">{importing?"Importando...":`Importar ${parsed.rows.length} productos (${fmt(totalImporte)})`}</Btn>
      </div>
    </div>}

    {/* HISTORIAL */}
    {tab==="historial"&&<div>
      {ventasSorted.length===0?<div className="bg-white border border-gray-200 rounded-xl p-8 text-center"><p className="text-gray-400">Sin ventas importadas aún</p><Btn onClick={()=>setTab("importar")}>Importar primer reporte</Btn></div>
      :<div className="bg-white border border-gray-200 rounded-xl overflow-hidden"><table className="w-full text-sm"><thead className="bg-gray-50"><tr>
        {["Fecha","Folio","Canal","Venta total","Costo teórico","Utilidad","Food cost",""].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${["Venta total","Costo teórico","Utilidad","Food cost"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}
      </tr></thead><tbody>{ventasSorted.map(v=>{
        const cT=parseFloat(v.costo_teorico)||0;const sub=parseFloat(v.subtotal)||0;const util=sub-cT;const fc=sub>0?cT/sub*100:0;
        return(<React.Fragment key={v.id}><tr className={`border-t border-gray-100 ${selVenta===v.id?"bg-lime-50":"hover:bg-gray-50"}`}>
          <td className="px-3 py-2 text-gray-600">{new Date(v.fecha+"T12:00:00").toLocaleDateString("es-MX")}</td>
          <td className="px-3 py-2 font-mono text-xs text-gray-500">{v.folio}</td>
          <td className="px-3 py-2"><Badge v={canalBadge(v.canal)}>{v.canal}</Badge></td>
          <td className="px-3 py-2 text-right font-bold text-gray-800">{fmt(v.total)}</td>
          <td className="px-3 py-2 text-right text-gray-600">{fmt(cT)}</td>
          <td className="px-3 py-2 text-right font-semibold text-emerald-600">{fmt(util)}</td>
          <td className="px-3 py-2 text-right"><Badge v={fc>40?"danger":fc>32?"warning":"success"}>{fc.toFixed(0)}%</Badge></td>
          <td className="px-3 py-2 text-right"><button onClick={()=>setSelVenta(selVenta===v.id?null:v.id)} className="text-xs text-amber-700 hover:bg-amber-50 px-2 py-1 rounded">{selVenta===v.id?"Cerrar":"Ver detalle"}</button></td>
        </tr>
        {selVenta===v.id&&<tr><td colSpan="8" className="bg-lime-50/50 px-4 py-3">
          <table className="w-full text-xs"><thead><tr>{["Producto","Cant","Precio","Importe","Costo teórico"].map(h=><th key={h} className={`px-2 py-1 font-medium text-gray-500 ${h!=="Producto"?"text-right":"text-left"}`}>{h}</th>)}</tr></thead><tbody>
          {ventaDetalle.filter(d=>d.venta_id===v.id).map(d=>{const prod=productosVenta.find(p=>p.id===d.producto_venta_id);return(<tr key={d.id} className="border-t border-lime-100"><td className="px-2 py-1 font-medium text-gray-800">{prod?.nombre||"?"}</td><td className="px-2 py-1 text-right">{d.cantidad}</td><td className="px-2 py-1 text-right">{fmt(d.precio_unitario)}</td><td className="px-2 py-1 text-right font-semibold">{fmt(d.importe)}</td><td className="px-2 py-1 text-right text-gray-600">{fmt(d.costo_teorico)}</td></tr>);})}
          </tbody></table>
          <div className="flex gap-4 mt-2 text-xs text-gray-600 flex-wrap">{parseFloat(v.total_efectivo)>0&&<span>Efectivo: <b>{fmt(v.total_efectivo)}</b></span>}{parseFloat(v.total_tarjeta)>0&&<span>Tarjeta: <b>{fmt(v.total_tarjeta)}</b></span>}{parseFloat(v.total_plataforma)>0&&<span>Plataformas: <b>{fmt(v.total_plataforma)}</b></span>}{parseFloat(v.total_otros)>0&&<span>Otros: <b>{fmt(v.total_otros)}</b></span>}</div>
        </td></tr>}
        </React.Fragment>);})}</tbody></table></div>}
    </div>}

    {/* PRODUCTOS Y RECETAS */}
    {tab==="productos"&&<div>
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div className="flex gap-1">
          <button onClick={()=>setVerTipo("platillos")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${verTipo==="platillos"?"bg-gray-800 text-white":"bg-white border border-gray-200 text-gray-500 hover:text-gray-700"}`}>Platillos ({productosVenta.filter(p=>!p.es_preparacion).length})</button>
          <button onClick={()=>setVerTipo("preparaciones")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${verTipo==="preparaciones"?"bg-gray-800 text-white":"bg-white border border-gray-200 text-gray-500 hover:text-gray-700"}`}>Preparaciones ({productosVenta.filter(p=>p.es_preparacion).length})</button>
        </div>
        {verTipo==="platillos"&&!addingProd&&<Btn onClick={()=>setAddingProd(true)} color="green">+ Nuevo producto</Btn>}
        {verTipo==="preparaciones"&&!addingPrep&&<Btn onClick={()=>setAddingPrep(true)} color="purple">+ Nueva preparación</Btn>}
      </div>
      {verTipo==="preparaciones"&&addingPrep&&<div className="bg-white border-2 border-teal-300 rounded-xl p-3 mb-3"><h3 className="text-sm font-bold text-teal-800 mb-2">Nueva preparación (sub-receta)</h3><div className="flex gap-2 items-end flex-wrap">
        <div className="flex-1"><label className="text-xs text-gray-500 block mb-1">Nombre</label><input className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="SALSA DE LA CASA" value={newPrep.nombre} onChange={e=>setNewPrep({...newPrep,nombre:e.target.value})}/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Se mide en</label><select className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={newPrep.unidad} onChange={e=>setNewPrep({...newPrep,unidad:e.target.value})}><option value="kg">kg</option><option value="lt">lt</option><option value="pz">pz</option><option value="porcion">porción</option></select></div>
        <div><label className="text-xs text-gray-500 block mb-1">Rinde por tanda</label><input type="number" min="0" step="0.1" className="w-28 border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="ej. 2.5" value={newPrep.rendimiento||""} onChange={e=>setNewPrep({...newPrep,rendimiento:parseFloat(e.target.value)||0})}/></div>
        <Btn onClick={addPrep} disabled={saving||!newPrep.nombre.trim()||newPrep.rendimiento<=0} color="purple">{saving?"...":"Crear y armar receta"}</Btn>
        <button onClick={()=>setAddingPrep(false)} className="text-xs text-gray-500 px-2 py-1.5">Cancelar</button>
      </div><p className="text-xs text-gray-400 mt-2">La receta que le captures es de UNA TANDA completa; el rendimiento dice cuánto produce esa tanda (ej. 2.5 kg de salsa). El costo por unidad se calcula solo y los platillos la usan como un ingrediente más.</p></div>}
      {verTipo==="platillos"&&addingProd&&<div className="bg-white border-2 rounded-xl p-3 mb-3" style={{borderColor:"#bfcd3b"}}><h3 className="text-sm font-bold text-gray-700 mb-2">Nuevo producto de venta</h3><div className="flex gap-2 items-end flex-wrap">
        <div><label className="text-xs text-gray-500 block mb-1">Código SR</label><input className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm w-28" placeholder="BOWL01" value={newProd.codigo_sr} onChange={e=>setNewProd({...newProd,codigo_sr:e.target.value})}/></div>
        <div className="flex-1"><label className="text-xs text-gray-500 block mb-1">Nombre</label><input className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="Como aparece en SoftRestaurant" value={newProd.nombre} onChange={e=>setNewProd({...newProd,nombre:e.target.value})}/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Categoría</label><input className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm w-28" placeholder="BOWLS" value={newProd.categoria} onChange={e=>setNewProd({...newProd,categoria:e.target.value})}/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Precio venta</label><input type="number" min="0" step="0.01" className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm w-24" value={newProd.precio_venta||""} onChange={e=>setNewProd({...newProd,precio_venta:parseFloat(e.target.value)||0})}/></div>
        <Btn onClick={addProd} disabled={saving||!newProd.nombre.trim()} color="green">{saving?"...":"Guardar"}</Btn>
        <button onClick={()=>setAddingProd(false)} className="text-xs text-gray-500 px-2 py-1.5">Cancelar</button>
      </div></div>}
      {(()=>{const lista=productosVenta.filter(p=>verTipo==="preparaciones"?p.es_preparacion:!p.es_preparacion);
      return lista.length===0?<div className="bg-white border border-gray-200 rounded-xl p-8 text-center"><p className="text-gray-400 mb-2">{verTipo==="preparaciones"?"Sin preparaciones":"Sin productos de venta"}</p><p className="text-xs text-gray-400">{verTipo==="preparaciones"?"Una preparación (salsa, arroz cocido, aderezo…) tiene su propia receta y los platillos la usan como un ingrediente más":"Se crean automáticamente al importar tu primer reporte de SR, o agrégalos manualmente"}</p></div>
      :<div className="bg-white border border-gray-200 rounded-xl overflow-hidden"><table className="w-full text-sm"><thead className="bg-gray-50"><tr>
        {(verTipo==="preparaciones"?["Preparación","Se mide en","Rinde/tanda","Costo tanda","Costo unidad","Receta",""]:["Código SR","Producto","Categoría","Precio","Costo receta","Margen","Receta",""]).map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${["Precio","Costo receta","Margen","Rinde/tanda","Costo tanda","Costo unidad"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}
      </tr></thead><tbody>{lista.map(p=>{
        const isE=editingProd===p.id;
        const cR=costoReceta(p.id,recetas,invSucursal,catalogo,productosVenta);
        const nRec=recetas.filter(r=>r.producto_venta_id===p.id).length;
        const precio=parseFloat(isE?prodData.precio_venta:p.precio_venta)||0;
        const margen=precio>0?(precio/1.16-cR)/(precio/1.16)*100:0;
        const openReceta=recetaDe===p.id;
        const rend=parseFloat(isE?prodData.rendimiento:p.rendimiento)||1;
        if(p.es_preparacion){return(<React.Fragment key={p.id}><tr className={`border-t border-gray-100 ${isE||openReceta?"bg-teal-50/60":"hover:bg-gray-50"}`}>
          <td className="px-3 py-2 font-medium text-gray-900">{isE?<input className="w-full border border-teal-400 rounded px-1 py-0.5 text-sm" value={prodData.nombre} onChange={e=>setProdData({...prodData,nombre:e.target.value})}/>:<span>{p.nombre} <Badge v="purple">prep</Badge></span>}</td>
          <td className="px-3 py-2 text-xs text-gray-500">{isE?<select className="border border-teal-400 rounded px-1 py-0.5 text-xs" value={prodData.unidad} onChange={e=>setProdData({...prodData,unidad:e.target.value})}><option value="kg">kg</option><option value="lt">lt</option><option value="pz">pz</option><option value="porcion">porción</option></select>:(p.unidad||"u")}</td>
          <td className="px-3 py-2 text-right">{isE?<input type="number" min="0" step="0.1" className="w-20 text-right border border-teal-400 rounded px-1 py-0.5 text-sm" value={prodData.rendimiento} onChange={e=>setProdData({...prodData,rendimiento:e.target.value})}/>:`${p.rendimiento||1} ${p.unidad||"u"}`}</td>
          <td className="px-3 py-2 text-right text-gray-600">{nRec>0?fmt(cR):<span className="text-gray-300">—</span>}</td>
          <td className="px-3 py-2 text-right font-semibold text-teal-700">{nRec>0?`${fmt(cR/rend)}/${p.unidad||"u"}`:"—"}</td>
          <td className="px-3 py-2"><button onClick={()=>{setRecetaDe(openReceta?null:p.id);setNewLinea({ref:"",cantidad:0,merma_pct:0});}} className={`text-xs px-2 py-1 rounded font-medium ${nRec>0?"text-teal-700 hover:bg-teal-50":"text-red-500 hover:bg-red-50"}`}>{nRec>0?`${nRec} ingredientes ${openReceta?"▲":"▼"}`:"+ Crear receta"}</button></td>
          <td className="px-3 py-2 text-right">{isE?<div className="flex gap-1 justify-end"><button onClick={()=>saveProd(p)} disabled={saving} className="text-xs bg-emerald-500 text-white px-2 py-1 rounded">{saving?"...":"Guardar"}</button><button onClick={()=>setEditingProd(null)} className="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded">X</button></div>:<div className="flex gap-1 justify-end"><button onClick={()=>{setEditingProd(p.id);setProdData({nombre:p.nombre,unidad:p.unidad||"kg",rendimiento:p.rendimiento||1});}} className="text-xs text-amber-700 hover:bg-amber-100 px-2 py-1 rounded">Editar</button><button onClick={()=>delProd(p)} className="text-xs text-red-400 hover:text-red-600 hover:bg-red-50 px-2 py-1 rounded">✕</button></div>}</td>
        </tr>
        {openReceta&&recetaEditorRow(p,cR,7)}
        </React.Fragment>);}
        return(<React.Fragment key={p.id}><tr className={`border-t border-gray-100 ${isE||openReceta?"bg-lime-50/60":"hover:bg-gray-50"}`}>
          <td className="px-3 py-2 font-mono text-xs text-gray-500">{isE?<input className="w-20 border border-lime-400 rounded px-1 py-0.5 text-xs" value={prodData.codigo_sr||""} onChange={e=>setProdData({...prodData,codigo_sr:e.target.value})}/>:(p.codigo_sr||"—")}</td>
          <td className="px-3 py-2 font-medium text-gray-900">{isE?<input className="w-full border border-lime-400 rounded px-1 py-0.5 text-sm" value={prodData.nombre} onChange={e=>setProdData({...prodData,nombre:e.target.value})}/>:p.nombre}</td>
          <td className="px-3 py-2 text-xs text-gray-500">{isE?<input className="w-20 border border-lime-400 rounded px-1 py-0.5 text-xs" value={prodData.categoria||""} onChange={e=>setProdData({...prodData,categoria:e.target.value})}/>:(p.categoria||"—")}</td>
          <td className="px-3 py-2 text-right">{isE?<input type="number" step="0.01" className="w-20 text-right border border-lime-400 rounded px-1 py-0.5 text-sm" value={prodData.precio_venta} onChange={e=>setProdData({...prodData,precio_venta:e.target.value})}/>:<span className="font-semibold">{fmt(p.precio_venta)}</span>}</td>
          <td className="px-3 py-2 text-right text-gray-600">{nRec>0?fmt(cR):<span className="text-gray-300">—</span>}</td>
          <td className="px-3 py-2 text-right">{nRec>0&&precio>0?<Badge v={margen<50?"danger":margen<65?"warning":"success"}>{margen.toFixed(0)}%</Badge>:"—"}</td>
          <td className="px-3 py-2"><button onClick={()=>{setRecetaDe(openReceta?null:p.id);setNewLinea({ref:"",cantidad:0,merma_pct:0});}} className={`text-xs px-2 py-1 rounded font-medium ${nRec>0?"text-teal-700 hover:bg-teal-50":"text-red-500 hover:bg-red-50"}`}>{nRec>0?`${nRec} insumos ${openReceta?"▲":"▼"}`:"+ Crear receta"}</button></td>
          <td className="px-3 py-2 text-right">{isE?<div className="flex gap-1 justify-end"><button onClick={()=>saveProd(p)} disabled={saving} className="text-xs bg-emerald-500 text-white px-2 py-1 rounded">{saving?"...":"Guardar"}</button><button onClick={()=>setEditingProd(null)} className="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded">X</button></div>:<div className="flex gap-1 justify-end"><button onClick={()=>{setEditingProd(p.id);setProdData({codigo_sr:p.codigo_sr||"",nombre:p.nombre,categoria:p.categoria||"",precio_venta:p.precio_venta});}} className="text-xs text-amber-700 hover:bg-amber-100 px-2 py-1 rounded">Editar</button><button onClick={()=>delProd(p)} className="text-xs text-red-400 hover:text-red-600 hover:bg-red-50 px-2 py-1 rounded">✕</button></div>}</td>
        </tr>
        {openReceta&&recetaEditorRow(p,cR,8)}
        </React.Fragment>);})}</tbody></table></div>;})()}
    </div>}
  </div>);
}

// ======================== INVENTARIO SUCURSAL + MERMA (v7.0) ========================
function SucursalInvView({invSucursal,setInvSucursal,movSucursal,setMovSucursal,mermas,setMermas,catalogo,insumos,sucursales,rol}){
  const [tab,setTab]=useState("inventario");
  const sucId=sucursales[0]?.id||null;
  const [adding,setAdding]=useState(false);
  const [newRow,setNewRow]=useState({insumo_id:"",existencia:0,costo:0,minimo:0});
  const [ajustando,setAjustando]=useState(null);
  const [ajusteVal,setAjusteVal]=useState(0);
  const [ajusteNota,setAjusteNota]=useState("");
  const [fMerma,setFMerma]=useState({insumo_id:"",cantidad:0,motivo:"caducidad",nota:""});
  const [saving,setSaving]=useState(false);

  const rows=invSucursal.filter(i=>!sucId||i.sucursal_id===sucId).map(i=>({...i,ins:insumos.find(x=>x.id===i.insumo_id)||{}})).sort((a,b)=>(a.ins.nombre||"").localeCompare(b.ins.nombre||""));
  const valor=rows.reduce((s,i)=>s+Math.max(0,parseFloat(i.existencia)||0)*costoInsumo(i.insumo_id,invSucursal,catalogo),0);
  const hoy=new Date();const mesInicio=new Date(hoy.getFullYear(),hoy.getMonth(),1).toISOString().split("T")[0];
  const mermaMes=mermas.filter(m=>(m.fecha||"")>=mesInicio).reduce((s,m)=>s+parseFloat(m.costo_total||0),0);
  const disponibles=insumos.filter(x=>x.tipo_control==="inventariable"&&!rows.some(r=>r.insumo_id===x.id));

  const addInsumo=async()=>{
    if(!sucId){alert("No hay sucursal registrada");return;}
    if(!newRow.insumo_id)return;
    setSaving(true);
    const costo=newRow.costo>0?newRow.costo:costoInsumo(newRow.insumo_id,invSucursal,catalogo);
    const res=await sbPost("inventario_sucursal",{sucursal_id:sucId,insumo_id:newRow.insumo_id,existencia:newRow.existencia||0,costo_promedio:costo,minimo_stock:newRow.minimo||0});
    if(res&&res[0]){
      setInvSucursal([...invSucursal,res[0]]);
      if((newRow.existencia||0)>0){const mv=await sbPost("movimientos_sucursal",{sucursal_id:sucId,insumo_id:newRow.insumo_id,tipo:"entrada_ajuste",cantidad:newRow.existencia,costo_unitario:costo,fecha:new Date().toISOString().split("T")[0],nota:"Inventario inicial",registrado_por:rol});if(mv&&mv[0])setMovSucursal(prev=>[...prev,mv[0]]);}
      setNewRow({insumo_id:"",existencia:0,costo:0,minimo:0});setAdding(false);
    }else alert("Error (¿el insumo ya está en inventario de sucursal?)");
    setSaving(false);
  };

  const confirmarAjuste=async(row)=>{
    const actual=parseFloat(row.existencia)||0;
    const diff=Math.round((ajusteVal-actual)*1000)/1000;
    if(diff===0){setAjustando(null);return;}
    setSaving(true);
    const costo=costoInsumo(row.insumo_id,invSucursal,catalogo);
    const mv=await sbPost("movimientos_sucursal",{sucursal_id:row.sucursal_id,insumo_id:row.insumo_id,tipo:diff>0?"entrada_ajuste":"salida_ajuste",cantidad:Math.abs(diff),costo_unitario:costo,fecha:new Date().toISOString().split("T")[0],nota:ajusteNota||"Ajuste por conteo físico",registrado_por:rol});
    if(mv&&mv[0])setMovSucursal(prev=>[...prev,mv[0]]);
    await sbPatch("inventario_sucursal",row.id,{existencia:ajusteVal,updated_at:new Date().toISOString()});
    setInvSucursal(invSucursal.map(i=>i.id===row.id?{...i,existencia:ajusteVal}:i));
    setAjustando(null);setAjusteNota("");setSaving(false);
  };

  const registrarMerma=async()=>{
    if(!fMerma.insumo_id||fMerma.cantidad<=0||saving)return;
    setSaving(true);
    const row=rows.find(r=>r.insumo_id===fMerma.insumo_id);
    const costo=costoInsumo(fMerma.insumo_id,invSucursal,catalogo);
    const costoTotal=Math.round(fMerma.cantidad*costo*100)/100;
    const res=await sbPost("mermas",{sucursal_id:sucId,insumo_id:fMerma.insumo_id,cantidad:fMerma.cantidad,motivo:fMerma.motivo,costo_unitario:costo,costo_total:costoTotal,fecha:new Date().toISOString().split("T")[0],nota:fMerma.nota||null,registrado_por:rol});
    if(res&&res[0]){
      setMermas([res[0],...mermas]);
      const mv=await sbPost("movimientos_sucursal",{sucursal_id:sucId,insumo_id:fMerma.insumo_id,tipo:"salida_merma",cantidad:fMerma.cantidad,costo_unitario:costo,merma_id:res[0].id,fecha:new Date().toISOString().split("T")[0],nota:`Merma: ${fMerma.motivo}`,registrado_por:rol});
      if(mv&&mv[0])setMovSucursal(prev=>[...prev,mv[0]]);
      if(row){const nueva=(parseFloat(row.existencia)||0)-fMerma.cantidad;await sbPatch("inventario_sucursal",row.id,{existencia:nueva,updated_at:new Date().toISOString()});setInvSucursal(invSucursal.map(i=>i.id===row.id?{...i,existencia:nueva}:i));}
      setFMerma({insumo_id:"",cantidad:0,motivo:"caducidad",nota:""});
      alert(`Merma registrada — ${fmt(costoTotal)} de pérdida`);
    }else alert("Error al registrar merma");
    setSaving(false);
  };

  const motivoBadge=(m)=>({caducidad:"warning",dano:"danger",produccion:"info",robo:"danger",ajuste_inventario:"default"})[m]||"default";
  const movsSorted=movSucursal.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,40);
  const tabsS=[{id:"inventario",l:`Inventario (${rows.length})`},{id:"merma",l:"Registrar merma"},{id:"movimientos",l:"Movimientos"}];

  return(<div>
    <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div><h2 className="text-lg font-bold text-gray-900">Inventario de sucursal</h2><p className="text-sm text-gray-500">{sucursales[0]?.nombre||"Sucursal"} — entradas por recepción, salidas por venta (recetas SR) y merma</p></div>
      <div className="flex gap-3">
        <div className="bg-teal-50 border border-teal-200 rounded-xl px-4 py-2 text-right"><p className="text-xs text-teal-600">Valor inventario</p><p className="text-xl font-bold text-teal-700">{fmt(valor)}</p></div>
        <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-2 text-right"><p className="text-xs text-red-600">Merma del mes</p><p className="text-xl font-bold text-red-700">{fmt(mermaMes)}</p></div>
      </div>
    </div>
    <div className="flex gap-1 mb-4">{tabsS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${tab===t.id?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={tab===t.id?{background:"#77b7b4"}:{}}>{t.l}</button>)}</div>

    {tab==="inventario"&&<div>
      <div className="flex justify-end mb-3">{adding?<div className="bg-white border-2 border-teal-300 rounded-xl p-3 w-full"><h3 className="text-sm font-bold text-teal-800 mb-2">Agregar insumo al inventario de sucursal</h3><div className="flex gap-2 items-end flex-wrap">
        <div className="flex-1"><label className="text-xs text-gray-500 block mb-1">Insumo</label><select className="w-full border border-gray-200 rounded-lg px-2 py-1.5 text-sm" value={newRow.insumo_id} onChange={e=>setNewRow({...newRow,insumo_id:e.target.value,costo:costoInsumo(e.target.value,invSucursal,catalogo)})}><option value="">Seleccionar insumo...</option>{disponibles.map(x=><option key={x.id} value={x.id}>{x.nombre} ({x.unidad_base})</option>)}</select></div>
        <div><label className="text-xs text-gray-500 block mb-1">Existencia inicial</label><input type="number" min="0" step="0.25" className="w-24 border border-gray-200 rounded-lg px-2 py-1.5 text-sm" value={newRow.existencia||""} onChange={e=>setNewRow({...newRow,existencia:parseFloat(e.target.value)||0})}/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Costo unit.</label><input type="number" min="0" step="0.01" className="w-24 border border-gray-200 rounded-lg px-2 py-1.5 text-sm" value={newRow.costo||""} onChange={e=>setNewRow({...newRow,costo:parseFloat(e.target.value)||0})}/></div>
        <div><label className="text-xs text-gray-500 block mb-1">Mínimo</label><input type="number" min="0" step="0.25" className="w-20 border border-gray-200 rounded-lg px-2 py-1.5 text-sm" value={newRow.minimo||""} onChange={e=>setNewRow({...newRow,minimo:parseFloat(e.target.value)||0})}/></div>
        <Btn onClick={addInsumo} disabled={saving||!newRow.insumo_id} color="purple">{saving?"...":"Agregar"}</Btn>
        <button onClick={()=>setAdding(false)} className="text-xs text-gray-500 px-2 py-1.5">Cancelar</button>
      </div></div>:<Btn onClick={()=>setAdding(true)} color="purple">+ Agregar insumo</Btn>}</div>
      {rows.length===0?<div className="bg-white border border-gray-200 rounded-xl p-8 text-center"><p className="text-gray-400 mb-1">Sin insumos en inventario de sucursal</p><p className="text-xs text-gray-400">Se llena automáticamente al recibir mercancía de pedidos; también puedes cargar un inventario inicial</p></div>
      :<div className="bg-white border border-gray-200 rounded-xl overflow-hidden"><table className="w-full text-sm"><thead className="bg-gray-50"><tr>
        {["Insumo","Existencia","Costo prom.","Valor","Mínimo","Estado",""].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${["Existencia","Costo prom.","Valor","Mínimo"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}
      </tr></thead><tbody>{rows.map(r=>{
        const ex=parseFloat(r.existencia)||0;
        const costo=costoInsumo(r.insumo_id,invSucursal,catalogo);
        const min=parseFloat(r.minimo_stock)||0;
        const low=min>0&&ex<=min;
        const isAj=ajustando===r.id;
        return(<tr key={r.id} className={`border-t border-gray-100 ${ex<0?"bg-red-50":low?"bg-orange-50/50":"hover:bg-gray-50"}`}>
          <td className="px-3 py-2 font-medium text-gray-900">{r.ins.nombre||"?"} <span className="text-gray-400 text-xs">{r.ins.unidad_base}</span></td>
          <td className="px-3 py-2 text-right font-bold">{isAj?<input type="number" step="0.25" className="w-24 text-right border border-teal-400 rounded px-1 py-0.5 text-sm bg-teal-50" value={ajusteVal} onChange={e=>setAjusteVal(parseFloat(e.target.value)||0)} autoFocus/>:<span className={ex<0?"text-red-600":""}>{fmtQ(ex,r.ins.unidad_base||"")}</span>}</td>
          <td className="px-3 py-2 text-right text-gray-600">{fmt(costo)}</td>
          <td className="px-3 py-2 text-right font-medium">{fmt(Math.max(0,ex)*costo)}</td>
          <td className="px-3 py-2 text-right text-gray-400">{min>0?fmtQ(min,r.ins.unidad_base||""):"—"}</td>
          <td className="px-3 py-2">{ex<0?<Badge v="danger">Negativo</Badge>:ex===0?<Badge v="danger">Agotado</Badge>:low?<Badge v="warning">Bajo</Badge>:<Badge v="success">OK</Badge>}</td>
          <td className="px-3 py-2 text-right">{isAj?<div className="flex gap-1 justify-end items-center"><input className="w-32 border border-gray-200 rounded px-1 py-0.5 text-xs" placeholder="Motivo del ajuste" value={ajusteNota} onChange={e=>setAjusteNota(e.target.value)}/><button onClick={()=>confirmarAjuste(r)} disabled={saving} className="text-xs bg-emerald-500 text-white px-2 py-1 rounded">{saving?"...":"✓"}</button><button onClick={()=>setAjustando(null)} className="text-xs bg-gray-200 px-2 py-1 rounded">✕</button></div>:<button onClick={()=>{setAjustando(r.id);setAjusteVal(ex);setAjusteNota("");}} className="text-xs text-teal-700 hover:bg-teal-50 px-2 py-1 rounded font-medium">Ajustar</button>}</td>
        </tr>);})}</tbody></table></div>}
      <p className="text-xs text-gray-400 mt-2">El ajuste registra la diferencia como movimiento de conteo físico. Las existencias negativas indican ventas sin recepción registrada o recetas con cantidades altas — revísalas.</p>
    </div>}

    {tab==="merma"&&<div className="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div className="bg-white border-2 border-red-200 rounded-xl p-4">
        <h3 className="text-sm font-bold text-red-800 mb-3">Registrar merma</h3>
        <div className="space-y-3">
          <div><label className="text-xs text-gray-500 block mb-1">Insumo</label><select className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={fMerma.insumo_id} onChange={e=>setFMerma({...fMerma,insumo_id:e.target.value})}><option value="">Seleccionar...</option>{rows.map(r=><option key={r.insumo_id} value={r.insumo_id}>{r.ins.nombre} — hay {fmtQ(parseFloat(r.existencia)||0,r.ins.unidad_base||"")}</option>)}</select></div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs text-gray-500 block mb-1">Cantidad</label><input type="number" min="0" step="0.25" className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={fMerma.cantidad||""} onChange={e=>setFMerma({...fMerma,cantidad:parseFloat(e.target.value)||0})}/></div>
            <div><label className="text-xs text-gray-500 block mb-1">Motivo</label><select className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={fMerma.motivo} onChange={e=>setFMerma({...fMerma,motivo:e.target.value})}><option value="caducidad">Caducidad</option><option value="dano">Daño / mal estado</option><option value="produccion">Error de producción</option><option value="robo">Robo / faltante</option><option value="ajuste_inventario">Ajuste de inventario</option><option value="otro">Otro</option></select></div>
          </div>
          <div><label className="text-xs text-gray-500 block mb-1">Nota</label><input className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" placeholder="Opcional" value={fMerma.nota} onChange={e=>setFMerma({...fMerma,nota:e.target.value})}/></div>
          {fMerma.insumo_id&&fMerma.cantidad>0&&<div className="bg-red-50 rounded-xl p-3 text-sm text-red-800">Pérdida estimada: <b>{fmt(fMerma.cantidad*costoInsumo(fMerma.insumo_id,invSucursal,catalogo))}</b></div>}
          <Btn onClick={registrarMerma} disabled={saving||!fMerma.insumo_id||fMerma.cantidad<=0} color="red">{saving?"Guardando...":"Registrar merma"}</Btn>
        </div>
      </div>
      <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
        <div className="px-4 py-2 bg-gray-50 border-b border-gray-100 flex justify-between items-center"><h3 className="text-sm font-bold text-gray-700">Mermas recientes</h3><span className="text-xs text-red-600 font-bold">{fmt(mermaMes)} este mes</span></div>
        {mermas.length===0?<div className="p-8 text-center text-gray-400 text-sm">Sin mermas registradas</div>
        :<table className="w-full text-xs"><thead><tr>{["Fecha","Insumo","Cant","Motivo","Costo"].map(h=><th key={h} className={`px-2 py-1.5 font-medium text-gray-500 ${["Cant","Costo"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}</tr></thead><tbody>
        {mermas.slice(0,15).map(m=>{const ins=insumos.find(x=>x.id===m.insumo_id)||{};return(<tr key={m.id} className="border-t border-gray-50">
          <td className="px-2 py-1.5 text-gray-500">{new Date((m.fecha||m.created_at)+"T12:00:00").toLocaleDateString("es-MX")}</td>
          <td className="px-2 py-1.5 font-medium text-gray-800">{ins.nombre||"?"}</td>
          <td className="px-2 py-1.5 text-right">{fmtQ(parseFloat(m.cantidad)||0,ins.unidad_base||"")}</td>
          <td className="px-2 py-1.5"><Badge v={motivoBadge(m.motivo)}>{(m.motivo||"").replace(/_/g," ")}</Badge></td>
          <td className="px-2 py-1.5 text-right font-bold text-red-600">{fmt(m.costo_total)}</td>
        </tr>);})}</tbody></table>}
      </div>
    </div>}

    {tab==="movimientos"&&<div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
      {movsSorted.length===0?<div className="p-8 text-center text-gray-400 text-sm">Sin movimientos</div>
      :<table className="w-full text-xs"><thead className="bg-gray-50"><tr>{["Fecha","Tipo","Insumo","Cantidad","Costo unit.","Nota"].map(h=><th key={h} className={`px-3 py-2 font-semibold text-gray-600 uppercase ${["Cantidad","Costo unit."].includes(h)?"text-right":"text-left"}`}>{h}</th>)}</tr></thead><tbody>
      {movsSorted.map(m=>{const ins=insumos.find(x=>x.id===m.insumo_id)||{};const esEntrada=m.tipo.startsWith("entrada");return(<tr key={m.id} className="border-t border-gray-50">
        <td className="px-3 py-1.5 text-gray-500">{new Date((m.fecha||m.created_at)+"T12:00:00").toLocaleDateString("es-MX")}</td>
        <td className="px-3 py-1.5"><Badge v={esEntrada?"success":m.tipo==="salida_merma"?"danger":m.tipo==="salida_venta"?"info":"warning"}>{m.tipo.replace(/_/g," ")}</Badge></td>
        <td className="px-3 py-1.5 font-medium text-gray-800">{ins.nombre||"?"}</td>
        <td className={`px-3 py-1.5 text-right font-semibold ${esEntrada?"text-emerald-600":"text-red-600"}`}>{esEntrada?"+":"−"}{fmtQ(parseFloat(m.cantidad)||0,ins.unidad_base||"")}</td>
        <td className="px-3 py-1.5 text-right text-gray-600">{fmt(m.costo_unitario)}</td>
        <td className="px-3 py-1.5 text-gray-400">{m.nota||"—"}</td>
      </tr>);})}</tbody></table>}

}

// ======================== ESTADOS FINANCIEROS (v7.0) ========================
// Estado de resultados y flujo de efectivo del mes, integrando: ventas de SR,
// costo de ventas por recetas (kárdex de sucursal), merma, gastos operativos,
// CxP/pagos y valor de inventarios. Cifras de venta sin IVA (subtotal).
function EstadosView({ventas,mermas,gastosOp,comprasDirectas,cxp,pagos,inventario,invSucursal,movSucursal,catalogo}){
  const [mesOffset,setMesOffset]=useState(0);
  const now=new Date();
  const mesActual=new Date(now.getFullYear(),now.getMonth()-mesOffset,1);
  const mesNombre=mesActual.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
  const mesInicio=mesActual.toISOString().split("T")[0];
  const mesFin=new Date(mesActual.getFullYear(),mesActual.getMonth()+1,0).toISOString().split("T")[0];
  const enMes=(f)=>f>=mesInicio&&f<=mesFin;

  const vMes=ventas.filter(v=>v.estatus!=="cancelada"&&enMes(v.fecha||""));
  const ventasNetas=vMes.reduce((s,v)=>s+parseFloat(v.subtotal||0),0);
  const ivaVentas=vMes.reduce((s,v)=>s+parseFloat(v.iva||0),0);
  const ventasBrutas=vMes.reduce((s,v)=>s+parseFloat(v.total||0),0);
  const porCanal={};vMes.forEach(v=>{const k=v.canal||"otro";porCanal[k]=(porCanal[k]||0)+parseFloat(v.total||0);});

  // Costo de ventas: kárdex (salida_venta con costo); si no hay movimientos usa el costo teórico de las ventas
  const cogsKardex=movSucursal.filter(m=>m.tipo==="salida_venta"&&enMes(m.fecha||"")).reduce((s,m)=>s+(parseFloat(m.cantidad)||0)*(parseFloat(m.costo_unitario)||0),0);
  const cogsTeorico=vMes.reduce((s,v)=>s+parseFloat(v.costo_teorico||0),0);
  const costoVentas=cogsKardex>0?cogsKardex:cogsTeorico;

  const mermaMes=mermas.filter(m=>enMes(m.fecha||"")).reduce((s,m)=>s+parseFloat(m.costo_total||0),0);
  const gMes=gastosOp.filter(g=>enMes(g.fecha||g.created_at?.split("T")[0]||""));
  const gastosTotal=gMes.reduce((s,g)=>s+parseFloat(g.monto||0),0);
  const gPorCat={};gMes.forEach(g=>{const k=g.categoria||"Otros";gPorCat[k]=(gPorCat[k]||0)+parseFloat(g.monto||0);});
  const gCats=Object.entries(gPorCat).sort((a,b)=>b[1]-a[1]);

  const utilidadBruta=ventasNetas-costoVentas;
  const utilidadOperativa=utilidadBruta-mermaMes-gastosTotal;
  const margenBruto=ventasNetas>0?utilidadBruta/ventasNetas*100:0;
  const margenOperativo=ventasNetas>0?utilidadOperativa/ventasNetas*100:0;
  const foodCost=ventasNetas>0?costoVentas/ventasNetas*100:0;

  // Flujo de efectivo del mes
  const inEfectivo=vMes.reduce((s,v)=>s+parseFloat(v.total_efectivo||0),0);
  const inTarjeta=vMes.reduce((s,v)=>s+parseFloat(v.total_tarjeta||0),0);
  const inPlataforma=vMes.reduce((s,v)=>s+parseFloat(v.total_plataforma||0),0);
  const inOtros=vMes.reduce((s,v)=>s+parseFloat(v.total_otros||0),0);
  const entradas=inEfectivo+inTarjeta+inPlataforma+inOtros;
  const pagosMes=pagos.filter(p=>enMes(p.fecha_pago||p.created_at?.split("T")[0]||"")).reduce((s,p)=>s+parseFloat(p.monto_pagado||0),0);
  const cdMes=comprasDirectas.filter(c=>c.metodo_pago!=="credito"&&enMes(c.fecha||c.created_at?.split("T")[0]||"")).reduce((s,c)=>s+parseFloat(c.costo_total||0),0);
  // Los gastos "Auto:" (insumos tipo gasto recibidos) no salen de caja por sí
  // mismos: su efectivo ya está contado en pagos CxP / compras directas.
  const gastosFlujo=gMes.filter(g=>!(g.nota||"").startsWith("Auto:")).reduce((s,g)=>s+parseFloat(g.monto||0),0);
  const salidas=pagosMes+cdMes+gastosFlujo;
  const flujoNeto=entradas-salidas;

  // Posición (a hoy, no del mes)
  const cxpPendiente=cxp.filter(c=>c.estatus!=="pagado").reduce((s,c)=>s+(parseFloat(c.monto_total)-parseFloat(c.monto_pagado||0)),0);
  const valorAlmacen=inventario.reduce((s,p)=>s+(parseFloat(p.existencia)||0)*(parseFloat(p.costo_unitario_actual)||0),0);
  const valorSucursal=invSucursal.reduce((s,i)=>s+Math.max(0,parseFloat(i.existencia)||0)*costoInsumo(i.insumo_id,invSucursal,catalogo),0);

  const Row=({label,value,bold,color,pct,indent})=>(<div className={`flex justify-between py-1.5 ${bold?"border-t-2 border-gray-300 font-bold text-gray-900":"border-t border-gray-50"}`}><span className={`${indent?"pl-4 text-gray-600":""} ${bold?"":"text-gray-700"} text-sm`}>{label}</span><span className={`text-sm font-semibold ${color||""}`}>{value}{pct!=null&&<span className="text-xs text-gray-400 ml-2">({pct.toFixed(1)}%)</span>}</span></div>);

  return(<div>
    <div className="flex items-center justify-between mb-6">
      <div className="flex items-center gap-3"><Logo size={40}/><div><h2 className="text-lg font-bold text-gray-900">Estados financieros</h2><p className="text-sm text-gray-500">Resultados, flujo y posición — integrado con ventas SR</p></div></div>
      <div className="flex items-center gap-2">
        <button onClick={()=>setMesOffset(mesOffset+1)} className="px-3 py-1.5 rounded-lg text-sm border border-gray-200 hover:bg-gray-100">←</button>
        <span className="text-sm font-semibold text-gray-800 capitalize min-w-32 text-center">{mesNombre}</span>
        <button onClick={()=>setMesOffset(Math.max(0,mesOffset-1))} disabled={mesOffset===0} className="px-3 py-1.5 rounded-lg text-sm border border-gray-200 hover:bg-gray-100 disabled:opacity-30">→</button>
      </div>
    </div>

    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Ventas del mes (con IVA)</p><p className="text-xl font-bold text-gray-900">{fmt(ventasBrutas)}</p></div>
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Food cost</p><p className={`text-xl font-bold ${foodCost>40?"text-red-600":foodCost>32?"text-orange-500":"text-emerald-600"}`}>{ventasNetas>0?foodCost.toFixed(1)+"%":"—"}</p></div>
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Utilidad operativa</p><p className={`text-xl font-bold ${utilidadOperativa>=0?"text-emerald-600":"text-red-600"}`}>{fmt(utilidadOperativa)}</p></div>
      <div className="bg-white border border-gray-200 rounded-xl p-3"><p className="text-xs text-gray-500">Flujo neto del mes</p><p className={`text-xl font-bold ${flujoNeto>=0?"text-emerald-600":"text-red-600"}`}>{fmt(flujoNeto)}</p></div>
    </div>

    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      {/* ESTADO DE RESULTADOS */}
      <div className="bg-white border border-gray-200 rounded-xl p-4">
        <h3 className="text-sm font-bold text-gray-700 mb-3">Estado de resultados — <span className="capitalize">{mesNombre}</span></h3>
        {vMes.length===0&&gMes.length===0?<p className="text-sm text-gray-400">Sin datos este mes. Importa ventas de SoftRestaurant para ver resultados.</p>:<div>
          <Row label="Ventas netas (sin IVA)" value={fmt(ventasNetas)}/>
          {Object.entries(porCanal).map(([c,t])=><Row key={c} label={`Canal ${c} (con IVA)`} value={fmt(t)} indent/>)}
          <Row label="(−) Costo de ventas (insumos por receta)" value={fmt(-costoVentas)} color="text-red-600"/>
          <Row label="Utilidad bruta" value={fmt(utilidadBruta)} bold color={utilidadBruta>=0?"text-emerald-700":"text-red-600"} pct={margenBruto}/>
          <Row label="(−) Merma" value={fmt(-mermaMes)} color="text-red-600"/>
          {gCats.map(([c,t])=><Row key={c} label={`(−) ${c}`} value={fmt(-t)} color="text-red-500" indent/>)}
          <Row label="(−) Total gastos operativos" value={fmt(-gastosTotal)} color="text-red-600"/>
          <Row label="Utilidad operativa" value={fmt(utilidadOperativa)} bold color={utilidadOperativa>=0?"text-emerald-700":"text-red-600"} pct={margenOperativo}/>
          <p className="text-xs text-gray-400 mt-3">Costo de ventas: {cogsKardex>0?"kárdex de sucursal (consumo real registrado)":"costo teórico de recetas"}. IVA de ventas del mes: {fmt(ivaVentas)} (no es ingreso, se traslada al SAT).</p>
        </div>}
      </div>

      {/* FLUJO DE EFECTIVO */}
      <div className="bg-white border border-gray-200 rounded-xl p-4">
        <h3 className="text-sm font-bold text-gray-700 mb-3">Flujo de efectivo — <span className="capitalize">{mesNombre}</span></h3>
        <p className="text-xs font-semibold text-emerald-700 mb-1">Entradas (cobros de ventas)</p>
        <Row label="Efectivo" value={fmt(inEfectivo)} indent/>
        <Row label="Tarjeta (terminal bancaria)" value={fmt(inTarjeta)} indent/>
        <Row label="Plataformas (UberEats…)" value={fmt(inPlataforma)} indent/>
        {inOtros>0&&<Row label="Otros" value={fmt(inOtros)} indent/>}
        <Row label="Total entradas" value={fmt(entradas)} bold color="text-emerald-700"/>
        <p className="text-xs font-semibold text-red-700 mt-3 mb-1">Salidas</p>
        <Row label="Pagos a proveedores (CxP)" value={fmt(-pagosMes)} color="text-red-600" indent/>
        <Row label="Compras directas (contado)" value={fmt(-cdMes)} color="text-red-600" indent/>
        <Row label="Gastos operativos (pagados directo)" value={fmt(-gastosFlujo)} color="text-red-600" indent/>
        <Row label="Total salidas" value={fmt(-salidas)} bold color="text-red-700"/>
        <Row label="Flujo neto del mes" value={fmt(flujoNeto)} bold color={flujoNeto>=0?"text-emerald-700":"text-red-600"}/>
        {entradas===0&&vMes.length>0&&<p className="text-xs text-orange-600 mt-2">Tip: captura las formas de pago (efectivo/tarjeta/plataforma) al importar cada corte de SR para que el flujo sea real.</p>}
      </div>
    </div>

    {/* POSICIÓN */}
    <div className="bg-white border border-gray-200 rounded-xl p-4">
      <h3 className="text-sm font-bold text-gray-700 mb-3">Posición al día de hoy</h3>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div className="bg-teal-50 border border-teal-100 rounded-xl p-3"><p className="text-xs text-teal-600">Inventario almacén</p><p className="text-lg font-bold text-teal-700">{fmt(valorAlmacen)}</p></div>
        <div className="bg-teal-50 border border-teal-100 rounded-xl p-3"><p className="text-xs text-teal-600">Inventario sucursal</p><p className="text-lg font-bold text-teal-700">{fmt(valorSucursal)}</p></div>
        <div className="bg-red-50 border border-red-100 rounded-xl p-3"><p className="text-xs text-red-600">Cuentas por pagar</p><p className="text-lg font-bold text-red-700">{fmt(cxpPendiente)}</p></div>
        <div className="bg-amber-50 border border-amber-100 rounded-xl p-3"><p className="text-xs" style={{color:"#b8860b"}}>Inventarios − CxP</p><p className={`text-lg font-bold ${valorAlmacen+valorSucursal-cxpPendiente>=0?"text-emerald-700":"text-red-700"}`}>{fmt(valorAlmacen+valorSucursal-cxpPendiente)}</p></div>
      </div>
    </div>
  </div>);
}

// ======================== APP v7.0 ========================
function App(){
  const [rol,setRol]=useState(null);
  const [view,setView]=useState("bandeja");
  const [subview,setSubview]=useState(null);
  const [loading,setLoading]=useState(true);
  const [loadMsg,setLoadMsg]=useState("Iniciando...");
  const [error,setError]=useState(null);
  const [catalogo,setCatalogo]=useState([]);
  const [proveedores,setProveedores]=useState([]);
  const [inventario,setInventario]=useState([]);
  const [movimientos,setMovimientos]=useState([]);
  const [pedidos,setPedidos]=useState([]);
  const [selectedPedido,setSelectedPedido]=useState(null);
  const [pedidoDetalle,setPedidoDetalle]=useState([]);
  const [provEstatus,setProvEstatus]=useState([]);
  const [unidades,setUnidades]=useState([]);
  const [lotes,setLotes]=useState([]);
  const [provToken,setProvToken]=useState(null);
  const [recepciones,setRecepciones]=useState([]);
  const [recepcionDetalle,setRecepcionDetalle]=useState([]);
  const [cxp,setCxp]=useState([]);
  const [pagos,setPagos]=useState([]);
  const [comprasDirectas,setComprasDirectas]=useState([]);
  const [gastosOp,setGastosOp]=useState([]);
  const [catGastos,setCatGastos]=useState([]);
  const [flujos,setFlujos]=useState([]);
  // v7.0: ventas SR, inventario de sucursal, recetas, merma
  const [sucursales,setSucursales]=useState([]);
  const [productosVenta,setProductosVenta]=useState([]);
  const [recetas,setRecetas]=useState([]);
  const [invSucursal,setInvSucursal]=useState([]);
  const [ventas,setVentas]=useState([]);
  const [ventaDetalle,setVentaDetalle]=useState([]);
  const [mermas,setMermas]=useState([]);
  const [movSucursal,setMovSucursal]=useState([]);
  const [insumos,setInsumos]=useState([]);

  // Check URL for provider token
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const t=params.get("token");
    if(t)setProvToken(t);
  },[]);

  useEffect(()=>{
    async function load(){
      setLoadMsg("Conectando...");

      // Fast-path proveedor: cuando se entra con ?token=, cargar SOLO el pedido
      // de ese proveedor en vez de toda la base. Antes se descargaban las 16
      // tablas del negocio (incluyendo finanzas) lo que en celulares lentos
      // dejaba al proveedor atorado en "Cargando..." y exponía datos privados.
      if(provToken){
        setLoadMsg("Validando link...");
        const peRows=await sbGet("pedido_proveedor_estatus",`token_acceso=eq.${encodeURIComponent(provToken)}`);
        const pe=(peRows||[])[0];
        if(!pe){setError("Link expirado o inválido.");setLoading(false);return;}
        setLoadMsg("Cargando pedido...");

      setInventario((results.inventario_almacen||[]).map(i=>({id:i.id,sku:i.sku,descripcion:i.descripcion,unidad_clave:uMap[i.unidad_id]?.clave||"?",existencia:parseFloat(i.existencia)||0,costo_unitario_actual:parseFloat(i.costo_unitario_actual)||0,lead_time:i.lead_time})));

  // CREATE PEDIDO
  const handleCreatePedido=async(items,totalTeo)=>{
    const sucursal=await sbGet("sucursales","limit=1");
    const sucId=sucursal[0]?.id;
    const serial=genSerial(pedidos);
    const res=await sbPost("pedidos",{fecha:new Date().toISOString().split("T")[0],sucursal_id:sucId,estatus:"creado",total_teorico:Math.round(totalTeo*100)/100,numero_pedido:serial});
    if(!(res&&res[0])){alert("No se pudo crear el pedido. Revisa tu conexión e intenta de nuevo.");return;}
    const pedId=res[0].id;
    // Insertar TODAS las líneas en una sola operación para poder detectar fallos.
    // Antes se insertaban una por una ignorando errores, lo que dejaba pedidos
    // "fantasma" (con estatus pero sin productos) cuando el guardado fallaba.
    const detRows=items.map(item=>({pedido_id:pedId,catalogo_id:item.catalogo_id,proveedor_id:item.proveedor_id,cantidad:item.cantidad,costo_referencia:item.costo_referencia}));
    const detRes=await sbPost("pedido_detalle",detRows);
    if(!Array.isArray(detRes)||detRes.length!==detRows.length){
      // Falló el guardado de los productos: revertir el pedido para no dejarlo vacío.
      await sbDelete("pedidos",pedId);
      alert("No se pudieron guardar los productos del pedido (posible permiso o restricción en la base de datos). El pedido NO se creó; vuelve a intentarlo o avisa a soporte.");
      return;
    }
    // Crear estatus por proveedor
    const provIds=[...new Set(items.map(i=>i.proveedor_id))];
    for(const pid of provIds){await sbPost("pedido_proveedor_estatus",{pedido_id:pedId,proveedor_id:pid,estatus:"pendiente"});}
    // Reload
    setPedidos([{...res[0],numero_pedido:serial},...pedidos]);
    setPedidoDetalle([...pedidoDetalle,...detRes]);
    const pe=await sbGet("pedido_proveedor_estatus",`pedido_id=eq.${pedId}`);
    setProvEstatus([...provEstatus,...pe]);
    setSubview(null);
    alert(`Pedido ${serial} creado`);
  };

  // ACTIONS
  const handleAction=async(action,provId)=>{
    if(!selectedPedido)return;
    const pedId=selectedPedido.id;
    if(action==="enviar_proveedor"){
      const token=genToken();
      await sbPatch("pedido_proveedor_estatus",provEstatus.find(x=>x.pedido_id===pedId&&x.proveedor_id===provId)?.id,{estatus:"enviado",fecha_envio:new Date().toISOString(),token_acceso:token,token_activo:true});
      await sbPatch("pedidos",pedId,{estatus:"en_proceso"});
      setProvEstatus(provEstatus.map(x=>x.pedido_id===pedId&&x.proveedor_id===provId?{...x,estatus:"enviado",token_acceso:token,token_activo:true}:x));
      setPedidos(pedidos.map(p=>p.id===pedId?{...p,estatus:"en_proceso"}:p));
      setSelectedPedido({...selectedPedido,estatus:"en_proceso"});
      const link=`${window.location.origin}${window.location.pathname}?token=${token}`;
      alert(`Enviado. Link para proveedor:\n${link}`);
      navigator.clipboard.writeText(link);
    }
    if(action==="cerrar_manual"||action==="enviar_almacen"){
      const est=action==="cerrar_manual"?"completo":"enviado";
      const pe=provEstatus.find(x=>x.pedido_id===pedId&&x.proveedor_id===provId);
      if(pe)await sbPatch("pedido_proveedor_estatus",pe.id,{estatus:est,fecha_completado:new Date().toISOString()});
      setProvEstatus(provEstatus.map(x=>x.pedido_id===pedId&&x.proveedor_id===provId?{...x,estatus:est}:x));
    }
    if(action==="comprado"){
      const totalReal=pedidoDetalle.filter(d=>d.pedido_id===pedId).reduce((s,d)=>s+d.cantidad*(d.costo_real||d.costo_referencia),0);
      // Check if all receptions already exist → auto-close
      const allProvForPed=provEstatus.filter(x=>x.pedido_id===pedId);
      const allReceived=allProvForPed.every(x=>recepciones.some(r=>r.pedido_id===pedId&&r.proveedor_id===x.proveedor_id));
      if(allReceived){
        await sbPatch("pedidos",pedId,{estatus:"cerrado",total_real:totalReal});
        setPedidos(pedidos.map(p=>p.id===pedId?{...p,estatus:"cerrado",total_real:totalReal}:p));
        setSelectedPedido({...selectedPedido,estatus:"cerrado"});
        // Generate CxP
        const provIds=[...new Set(pedidoDetalle.filter(d=>d.pedido_id===pedId).map(d=>d.proveedor_id))];
        const newCxps=[];
        for(const pid of provIds){
          const provItems=pedidoDetalle.filter(d=>d.pedido_id===pedId&&d.proveedor_id===pid);
          const monto=montoConIva(provItems,catalogo);
          if(monto>0){const cxpRes=await sbPost("cuentas_por_pagar",{pedido_id:pedId,proveedor_id:pid,monto_total:Math.round(monto*100)/100,estatus:"pendiente"});if(cxpRes&&cxpRes[0])newCxps.push(cxpRes[0]);}
        }
        setCxp([...cxp,...newCxps]);
        alert("Pedido comprado y cerrado — recepciones ya estaban completas. CxP generadas.");
      } else {
        await sbPatch("pedidos",pedId,{estatus:"comprado",total_real:totalReal});
        setPedidos(pedidos.map(p=>p.id===pedId?{...p,estatus:"comprado",total_real:totalReal}:p));
        setSelectedPedido({...selectedPedido,estatus:"comprado"});
        alert("Pedido marcado como comprado — pendiente de recepción por Sucursal");
      }
    }
  };

  const handleReasignar=async(detalleId,nuevoProvId)=>{
    const det=pedidoDetalle.find(d=>d.id===detalleId);
    if(!det)return;
    const oldProvId=det.proveedor_id;
    await sbPost("pedido_reasignaciones",{pedido_detalle_id:detalleId,pedido_id:det.pedido_id,proveedor_original_id:oldProvId,proveedor_nuevo_id:nuevoProvId});
    await sbPatch("pedido_detalle",detalleId,{proveedor_id:nuevoProvId});
    const updatedDetalle=pedidoDetalle.map(d=>d.id===detalleId?{...d,proveedor_id:nuevoProvId}:d);
    setPedidoDetalle(updatedDetalle);
    // Clean orphan: if no items left for old provider, delete its estatus
    const remainingForOldProv=updatedDetalle.filter(d=>d.pedido_id===det.pedido_id&&d.proveedor_id===oldProvId);
    if(remainingForOldProv.length===0){
      const orphanPE=provEstatus.find(pe=>pe.pedido_id===det.pedido_id&&pe.proveedor_id===oldProvId);
      if(orphanPE){await sbDelete("pedido_proveedor_estatus",orphanPE.id);setProvEstatus(provEstatus.filter(pe=>pe.id!==orphanPE.id));}
    }
    // Ensure new provider has estatus
    const existsPE=provEstatus.find(pe=>pe.pedido_id===det.pedido_id&&pe.proveedor_id===nuevoProvId);
    if(!existsPE){const newPE=await sbPost("pedido_proveedor_estatus",{pedido_id:det.pedido_id,proveedor_id:nuevoProvId,estatus:"pendiente"});if(newPE&&newPE[0])setProvEstatus(prev=>[...prev,newPE[0]]);}
  };
