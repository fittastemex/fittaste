// ======================== VENTAS SOFTRESTAURANT (v7.0) ========================
// SoftRestaurant sigue siendo el POS (ahí viven la terminal bancaria y UberEats).
// FitTaste importa su reporte de "Ventas por producto" (copiado desde Excel/CSV),
// explota recetas y descuenta el inventario de sucursal. El campo ventas.origen
// deja listo el terreno para un conector automático (agente SQL Server o API).
function VentasSRView({productosVenta,setProductosVenta,productosInactivos,setProductosInactivos,recetas,setRecetas,ventas,ventaDetalle,catalogo,insumos,invSucursal,onImport,rol,tabInicial}){
  const [tab,setTab]=useState(tabInicial||"importar");
  const [fecha,setFecha]=useState(new Date().toISOString().split("T")[0]);
  const [canal,setCanal]=useState("mostrador");
  const [pagosImp,setPagosImp]=useState({efectivo:0,tarjeta:0,plataforma:0,otros:0});
  const [raw,setRaw]=useState("");
  const [importing,setImporting]=useState(false);
  const [editingProd,setEditingProd]=useState(null);
  const [prodData,setProdData]=useState({});
  const [addingProd,setAddingProd]=useState(false);
  const [newProd,setNewProd]=useState({codigo_sr:"",nombre:"",categoria:"",precio_venta:0});
  const [recetaDe,setRecetaDe]=useState(null);
  const [newLinea,setNewLinea]=useState({ref:"",cantidad:0,merma_pct:0});
  // v7.1: preparaciones (sub-recetas)
  const [verTipo,setVerTipo]=useState("platillos");
  // v7.8: filtro y buscador de productos para triar rápido lo que falta
  const [busqProd,setBusqProd]=useState("");
  const [filtroEst,setFiltroEst]=useState("todos"); // todos | falta | con | noconsume
  const nrmP=(s)=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
  // clasificación de un platillo para el indicador
  const clasifProd=(p)=>p.sin_insumos?"noconsume":(recetas.some(r=>r.producto_venta_id===p.id)?"con":"falta");
  const [addingPrep,setAddingPrep]=useState(false);
  const [newPrep,setNewPrep]=useState({nombre:"",unidad:"kg",rendimiento:0});
  const [saving,setSaving]=useState(false);
  const [selVenta,setSelVenta]=useState(null);

  // Parser del texto pegado: TSV (copiado de Excel) o CSV con , o ;
  const parsed=useMemo(()=>{
    const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l);
    if(lines.length===0)return{rows:[]};
    const first=lines[0];
    const sep=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
    const cells=lines.map(l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,"")));
    const hdr=cells[0].map(c=>c.toLowerCase());
    const findCol=(...keys)=>hdr.findIndex(h=>keys.some(k=>h.includes(k)));
    let iCod=findCol("clave","codigo","código"),iNom=findCol("descrip","producto","nombre","artic"),iCant=findCol("cant"),iImp=findCol("importe","total","venta","monto"),iPre=findCol("precio");
    let dataRows=cells;
    const hasHeader=iNom>=0||iCant>=0||iImp>=0;
    if(hasHeader)dataRows=cells.slice(1);
    else{const n=cells[0].length;if(n>=4){iCod=0;iNom=1;iCant=2;iImp=3;iPre=-1;}else if(n===3){iCod=-1;iNom=0;iCant=1;iImp=2;iPre=-1;}else return{rows:[],error:"Se necesitan al menos 3 columnas: producto, cantidad, importe"};}
    const num=(v)=>parseFloat(String(v||"").replace(/[$,\s]/g,""))||0;
    const rows=dataRows.map(c=>{
      const codigo=iCod>=0?(c[iCod]||""):"";
      const nombre=iNom>=0?(c[iNom]||""):"";
      const cantidad=num(c[iCant]);
      const importe=num(c[iImp]);
      const precio=iPre>=0&&num(c[iPre])>0?num(c[iPre]):(cantidad>0?importe/cantidad:0);
      if(!nombre&&!codigo)return null;
      if(cantidad<=0&&importe<=0)return null;
      const vendibles=productosVenta.filter(p=>!p.es_preparacion);
      const prod=vendibles.find(p=>codigo&&p.codigo_sr&&String(p.codigo_sr).toLowerCase()===codigo.toLowerCase())||vendibles.find(p=>p.nombre.toLowerCase()===(nombre||"").toLowerCase());
      return{codigo,nombre:nombre||codigo,cantidad,importe,precio,prodId:prod?.id||null};
    }).filter(Boolean);
    return{rows};
  },[raw,productosVenta]);

  const nuevos=parsed.rows.filter(r=>!r.prodId).length;
  const sinReceta=parsed.rows.filter(r=>r.prodId&&!recetas.some(x=>x.producto_venta_id===r.prodId)).length;
  const totalImporte=parsed.rows.reduce((s,r)=>s+r.importe,0);
  const totalPagos=(pagosImp.efectivo||0)+(pagosImp.tarjeta||0)+(pagosImp.plataforma||0)+(pagosImp.otros||0);

  const handleImport=async()=>{
    if(parsed.rows.length===0||importing)return;
    setImporting(true);
    const ok=await onImport(fecha,canal,pagosImp,parsed.rows);
    if(ok){setRaw("");setPagosImp({efectivo:0,tarjeta:0,plataforma:0,otros:0});setTab("historial");}
    setImporting(false);
  };

  // --- Productos y recetas ---
  const saveProd=async(p)=>{setSaving(true);const upd=p.es_preparacion?{nombre:prodData.nombre.trim().toUpperCase(),unidad:prodData.unidad||"kg",rendimiento:parseFloat(prodData.rendimiento)||1,updated_at:new Date().toISOString()}:{codigo_sr:prodData.codigo_sr||null,nombre:prodData.nombre.trim(),categoria:prodData.categoria||null,precio_venta:parseFloat(prodData.precio_venta)||0,updated_at:new Date().toISOString()};const res=await sbPatch("productos_venta",p.id,upd);if(res)setProductosVenta(productosVenta.map(x=>x.id===p.id?{...x,...upd}:x));setEditingProd(null);setSaving(false);};
  const addProd=async()=>{if(!newProd.nombre.trim())return;setSaving(true);const res=await sbPost("productos_venta",{codigo_sr:newProd.codigo_sr.trim()||null,nombre:newProd.nombre.trim(),categoria:newProd.categoria.trim()||null,precio_venta:parseFloat(newProd.precio_venta)||0});if(res&&res[0]){setProductosVenta([...productosVenta,res[0]]);setNewProd({codigo_sr:"",nombre:"",categoria:"",precio_venta:0});setAddingProd(false);}else alert("Error al guardar (¿código SR duplicado?)");setSaving(false);};
  const delProd=async(p)=>{
    if(p.es_preparacion&&recetas.some(r=>r.preparacion_id===p.id)){alert(`"${p.nombre}" se usa en otras recetas — quítala de esas recetas primero.`);return;}
    if(!confirm(`¿Desactivar "${p.nombre}"?${p.es_preparacion?"":" Sus ventas históricas se conservan."}`))return;
    await sbPatch("productos_venta",p.id,{activo:false});setProductosVenta(productosVenta.filter(x=>x.id!==p.id));
  };
  const addPrep=async()=>{if(!newPrep.nombre.trim()||newPrep.rendimiento<=0)return;setSaving(true);const res=await sbPost("productos_venta",{nombre:newPrep.nombre.trim().toUpperCase(),es_preparacion:true,unidad:newPrep.unidad,rendimiento:newPrep.rendimiento,precio_venta:0});if(res&&res[0]){setProductosVenta([...productosVenta,res[0]]);setNewPrep({nombre:"",unidad:"kg",rendimiento:0});setAddingPrep(false);setRecetaDe(res[0].id);}else alert("Error al guardar la preparación");setSaving(false);};
  const addLinea=async()=>{
    if(!recetaDe||!newLinea.ref||newLinea.cantidad<=0)return;
    setSaving(true);
    const [tipoRef,refId]=newLinea.ref.split(":");
    const payload={producto_venta_id:recetaDe,cantidad:newLinea.cantidad,merma_pct:newLinea.merma_pct||0};
    if(tipoRef==="prep")payload.preparacion_id=refId;else payload.insumo_id=refId;
    const res=await sbPost("recetas",payload);
    if(res&&res[0]){setRecetas([...recetas,res[0]]);setNewLinea({ref:"",cantidad:0,merma_pct:0});}
    else alert("Error al agregar (¿el insumo ya está en la receta?)");
    setSaving(false);
  };
  const delLinea=async(id)=>{await sbDelete("recetas",id);setRecetas(recetas.filter(r=>r.id!==id));};
  const updLinea=async(id,campo,valor)=>{await sbPatch("recetas",id,{[campo]:valor});setRecetas(recetas.map(r=>r.id===id?{...r,[campo]:valor}:r));};

  const ventasSorted=ventas.slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)||new Date(b.created_at)-new Date(a.created_at));
  const canalBadge=(c)=>({mostrador:"info",ubereats:"success",rappi:"warning",didi:"purple"})[c]||"default";
  const tabsV=[{id:"importar",l:"Importar de SR"},{id:"historial",l:`Historial (${ventas.length})`},{id:"productos",l:`Productos y recetas (${productosVenta.length})`}];

  // v7.1: editor de receta compartido entre platillos y preparaciones.
  // Una línea puede ser insumo del catálogo (cat:) o preparación (prep:).
  const recetaEditorRow=(p,cR,colSpan)=>{
    const esPrepDueno=!!p.es_preparacion;
    const rend=parseFloat(p.rendimiento)||1;
    const precio=parseFloat(p.precio_venta)||0;
    const margen=precio>0?(precio/1.16-cR)/(precio/1.16)*100:0;
    return(<tr><td colSpan={colSpan} className="bg-teal-50/60 px-4 py-3 border-t border-teal-100">
      <p className="text-xs font-bold text-teal-800 mb-2">Receta de {p.nombre}{esPrepDueno?` — ingredientes de UNA TANDA (rinde ${rend} ${p.unidad||"u"})`:" — consumo por unidad vendida"}</p>
      <table className="w-full text-xs mb-2"><thead><tr>{["Ingrediente","Cantidad","Unidad","Merma extra %","Costo unit.","Costo línea",""].map(h=><th key={h} className={`px-2 py-1 font-medium text-gray-500 ${["Cantidad","Merma extra %","Costo unit.","Costo línea"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}</tr></thead><tbody>
      {recetas.filter(r=>r.producto_venta_id===p.id).map(r=>{
        const esPrep=!!r.preparacion_id;
        const prep=esPrep?productosVenta.find(x=>x.id===r.preparacion_id):null;
        const ins=esPrep?null:(insumos.find(x=>x.id===r.insumo_id)||{});
        const cU=esPrep?(costoReceta(r.preparacion_id,recetas,invSucursal,catalogo,productosVenta)/(parseFloat(prep?.rendimiento)||1)):costoInsumo(r.insumo_id,invSucursal,catalogo);
        const cL=(parseFloat(r.cantidad)||0)*(1+(parseFloat(r.merma_pct)||0)/100)*cU;
        return(<tr key={r.id} className="border-t border-teal-100">
          <td className="px-2 py-1 font-medium text-gray-800">{esPrep?<span>{prep?.nombre||"?"} <Badge v="purple">prep</Badge></span>:(ins.nombre||"?")}</td>
          <td className="px-2 py-1 text-right"><input type="number" min="0" step="0.001" className="w-20 text-right border border-gray-200 rounded px-1 py-0.5" defaultValue={r.cantidad} onBlur={e=>{const v=parseFloat(e.target.value)||0;if(v!==parseFloat(r.cantidad))updLinea(r.id,"cantidad",v);}}/></td>
          <td className="px-2 py-1 text-gray-500">{esPrep?(prep?.unidad||"u"):ins.unidad_base}</td>
          <td className="px-2 py-1 text-right"><input type="number" min="0" step="1" className="w-14 text-right border border-gray-200 rounded px-1 py-0.5" defaultValue={r.merma_pct} onBlur={e=>{const v=parseFloat(e.target.value)||0;if(v!==parseFloat(r.merma_pct))updLinea(r.id,"merma_pct",v);}}/></td>
          <td className="px-2 py-1 text-right text-gray-600">{fmt(cU)}{!esPrep&&(()=>{const o=origenCosto(r.insumo_id,invSucursal,catalogo);return o?<span className="text-amber-600 font-bold cursor-help ml-1" title={`Este costo viene del costo promedio de compra (${fmt(o.promedio)}/${ins.unidad_base||"u"}), que tiene prioridad sobre el catálogo. La presentación de compra da ${fmt(o.catalogo)}/${ins.unidad_base||"u"}. Si acabas de corregir la presentación, actualiza también el costo promedio en Inventario de sucursal.`}>⚠</span>:null;})()}</td>
          <td className="px-2 py-1 text-right font-semibold text-teal-700">{fmt(cL)}</td>
          <td className="px-2 py-1 text-right"><button onClick={()=>delLinea(r.id)} className="text-red-400 hover:text-red-600 px-1">✕</button></td>
        </tr>);})}
      </tbody></table>
      <div className="flex gap-2 items-end flex-wrap">
        <div className="flex-1"><label className="text-xs text-gray-500">Agregar ingrediente (escribe para buscar)</label>
        <BuscadorIngrediente key={p.id+"-"+recetas.filter(r=>r.producto_venta_id===p.id).length} placeholder="ej. pollo, salsa, crema…" onPick={(o)=>setNewLinea({...newLinea,ref:o.value})} opciones={[
          ...productosVenta.filter(x=>x.es_preparacion&&x.id!==p.id&&!recetas.some(r=>r.producto_venta_id===p.id&&r.preparacion_id===x.id)).map(x=>{const rx=parseFloat(x.rendimiento)||1;return{value:"prep:"+x.id,label:x.nombre,prep:true,extra:`${x.unidad||"u"} — ${fmt(costoReceta(x.id,recetas,invSucursal,catalogo,productosVenta)/rx)}`,usos:recetas.filter(r=>r.preparacion_id===x.id).length};}),
          ...insumos.filter(x=>x.tipo_control==="inventariable"&&!recetas.some(r=>r.producto_venta_id===p.id&&r.insumo_id===x.id)).map(x=>({value:"ins:"+x.id,label:x.nombre,extra:`${x.unidad_base} — ${fmt(costoInsumo(x.id,invSucursal,catalogo))}/${x.unidad_base}`,usos:recetas.filter(r=>r.insumo_id===x.id).length})),
        ]}/></div>
        <div><label className="text-xs text-gray-500">Cantidad</label><input type="number" min="0" step="0.001" className="w-24 border border-gray-200 rounded-lg px-2 py-1.5 text-xs" value={newLinea.cantidad||""} onChange={e=>setNewLinea({...newLinea,cantidad:parseFloat(e.target.value)||0})}/></div>
        <div><label className="text-xs text-gray-500">Merma %</label><input type="number" min="0" step="1" className="w-16 border border-gray-200 rounded-lg px-2 py-1.5 text-xs" value={newLinea.merma_pct||""} onChange={e=>setNewLinea({...newLinea,merma_pct:parseFloat(e.target.value)||0})}/></div>
        <Btn onClick={addLinea} disabled={saving||!newLinea.ref||newLinea.cantidad<=0} color="purple">{saving?"...":"Agregar"}</Btn>
      </div>
      <div className="flex justify-between mt-2 text-sm">
        <span className="text-teal-800 font-medium">{esPrepDueno?<span>Costo de la tanda: <b>{fmt(cR)}</b> → costo por {p.unidad||"u"}: <b>{fmt(cR/rend)}</b></span>:<span>Costo total receta: <b>{fmt(cR)}</b></span>}</span>
        {!esPrepDueno&&precio>0&&<span className="text-gray-600">Precio {fmt(precio)} (con IVA) → margen bruto <b className={margen<50?"text-red-600":"text-emerald-600"}>{margen.toFixed(1)}%</b></span>}
      </div>
    </td></tr>);
  };

  // v7.3: alarma de productos que YA vendieron y no tienen receta (su consumo
  // no está descontando inventario). Típico: alta nueva en SR sin capturar receta.
  // v7.5: los marcados "sin_insumos" (instrucciones de cocina: SIN CEBOLLA,
  // PREPARADOS…) se excluyen — no consumen nada y no deben sonar la alarma.
  const vendidosSinReceta=productosVenta.filter(p=>!p.es_preparacion&&!p.sin_insumos&&!recetas.some(r=>r.producto_venta_id===p.id)&&ventaDetalle.some(d=>d.producto_venta_id===p.id));
  const toggleSinInsumos=async(p)=>{
    const v=!p.sin_insumos;
    await sbPatch("productos_venta",p.id,{sin_insumos:v,updated_at:new Date().toISOString()});
    setProductosVenta(productosVenta.map(x=>x.id===p.id?{...x,sin_insumos:v}:x));
  };

  // v7.16: aviso de productos DESACTIVADOS. Desactivar un producto no lo quita
  // de SoftRestaurant: el POS lo sigue teniendo y se puede cobrar. Si eso pasa,
  // la venta entra y NO descuenta inventario, así que ese caso va en rojo.
  const inactivos=(productosInactivos||[]).filter(p=>!p.es_preparacion);
  const inactivosConVenta=inactivos.filter(p=>ventaDetalle.some(d=>d.producto_venta_id===p.id));
  const inactivosSinVenta=inactivos.filter(p=>!ventaDetalle.some(d=>d.producto_venta_id===p.id));
  const reactivar=async(p)=>{
    if(!confirm(`¿Reactivar "${p.nombre}"?\n\nVolverá a aparecer en la lista de productos y a costear sus ventas.`))return;
    const r=await sbPatchE("productos_venta",p.id,{activo:true,updated_at:new Date().toISOString()});
    if(r.error){alert("No se pudo reactivar: "+(r.error.message||JSON.stringify(r.error)));return;}
    setProductosInactivos((productosInactivos||[]).filter(x=>x.id!==p.id));
    setProductosVenta([...productosVenta,{...p,activo:true}]);
  };

  return(<div>
    <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div><h2 className="text-lg font-bold text-gray-900">Ventas — SoftRestaurant</h2><p className="text-sm text-gray-500">SR es el punto de venta; aquí se importan sus ventas para costeo e inventario</p></div>
    </div>
    {vendidosSinReceta.length>0&&<div className="bg-red-50 border-2 border-red-300 rounded-xl p-3 mb-4">
      <p className="text-sm font-bold text-red-800">⚠ {vendidosSinReceta.length} producto{vendidosSinReceta.length>1?"s":""} con ventas SIN receta — su consumo no está descontando inventario</p>
      <p className="text-xs text-red-700 mt-1">{vendidosSinReceta.slice(0,10).map(p=>p.nombre).join(" · ")}{vendidosSinReceta.length>10?` · y ${vendidosSinReceta.length-10} más…`:""}</p>
      <button onClick={()=>{setTab("productos");setVerTipo("platillos");setFiltroEst("falta");setBusqProd("");}} className="text-xs font-semibold text-red-800 underline mt-1">Ir a capturar recetas →</button>
    </div>}
    {inactivosConVenta.length>0&&<div className="bg-red-50 border-2 border-red-300 rounded-xl p-3 mb-4">
      <p className="text-sm font-bold text-red-800">⚠ {inactivosConVenta.length} producto{inactivosConVenta.length>1?"s":""} DESACTIVADO{inactivosConVenta.length>1?"S":""} con ventas — se está cobrando en SoftRestaurant y no descuenta inventario</p>
      <div className="mt-2 space-y-1">{inactivosConVenta.map(p=>{
        const u=ventaDetalle.filter(d=>d.producto_venta_id===p.id).reduce((s,d)=>s+(parseFloat(d.cantidad)||0),0);
        return(<div key={p.id} className="flex items-center gap-2 text-xs text-red-800 flex-wrap">
          <Badge v="danger">Desactivado</Badge>
          <span className="font-semibold">{p.nombre}</span>
          {p.codigo_sr&&<span className="text-red-600">clave SR {p.codigo_sr}</span>}
          <span>· {fmtQ(u,"u")} vendidas</span>
          <button onClick={()=>reactivar(p)} className="font-semibold underline">Reactivar</button>
        </div>);})}</div>
      <p className="text-xs text-red-700 mt-2">Desactivarlo aquí no lo quita del POS. Para que deje de venderse hay que borrar su clave en SoftRestaurant; si sí se vende, reactívalo y captura su receta.</p>
    </div>}
    {inactivosSinVenta.length>0&&<div className="bg-amber-50 border border-amber-300 rounded-xl p-3 mb-4">
      <p className="text-sm font-bold text-amber-900">{inactivosSinVenta.length} producto{inactivosSinVenta.length>1?"s":""} desactivado{inactivosSinVenta.length>1?"s":""} · sin ventas</p>
      <div className="mt-2 space-y-1">{inactivosSinVenta.map(p=>(
        <div key={p.id} className="flex items-center gap-2 text-xs text-amber-900 flex-wrap">
          <Badge v="default">Desactivado</Badge>
          <span className="font-semibold">{p.nombre}</span>
          {p.codigo_sr&&<span className="text-amber-700">clave SR {p.codigo_sr}</span>}
          {p.grupo_sr&&<span className="text-amber-700">· {p.grupo_sr}</span>}
          <button onClick={()=>reactivar(p)} className="font-semibold underline">Reactivar</button>
        </div>))}</div>
      <p className="text-xs text-amber-800 mt-2">No aparecen en la lista de productos ni cuentan para la cobertura de recetas. Siguen existiendo en SoftRestaurant.</p>
    </div>}
    <div className="flex gap-1 mb-4">{tabsV.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${tab===t.id?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={tab===t.id?{background:"#bfcd3b",color:"#2D2D2D"}:{}}>{t.l}</button>)}</div>

    {/* IMPORTAR */}
    {tab==="importar"&&<div>
      <div className="bg-white border-2 rounded-xl p-4 mb-4" style={{borderColor:"#bfcd3b"}}>
        <h3 className="text-sm font-bold text-gray-700 mb-1">Importar reporte de ventas por producto</h3>
        <p className="text-xs text-gray-500 mb-3">En SoftRestaurant abre el reporte de <b>ventas por producto</b> del día o corte, cópialo (o expórtalo a Excel y copia las celdas) y pégalo aquí. Columnas esperadas: clave/código, descripción, cantidad, importe.</p>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
          <div><label className="text-xs text-gray-500 block mb-1">Fecha de venta</label><input type="date" className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={fecha} onChange={e=>setFecha(e.target.value)}/></div>
          <div><label className="text-xs text-gray-500 block mb-1">Canal</label><select className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={canal} onChange={e=>setCanal(e.target.value)}><option value="mostrador">Mostrador / salón</option><option value="ubereats">UberEats</option><option value="rappi">Rappi</option><option value="didi">DiDi Food</option><option value="otro">Otro</option></select></div>
        </div>
        <textarea className="w-full border border-gray-200 rounded-xl px-3 py-2 text-xs font-mono h-40 focus:ring-2 focus:ring-lime-400" placeholder={"Pega aquí el reporte. Ejemplo:\nClave\tDescripción\tCantidad\tImporte\nBOWL01\tBOWL DE POLLO\t12\t1,548.00\nJUG02\tJUGO VERDE\t8\t440.00"} value={raw} onChange={e=>setRaw(e.target.value)}/>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 my-3">
          {[["efectivo","Efectivo"],["tarjeta","Tarjeta (terminal)"],["plataforma","Plataformas (UberEats…)"],["otros","Otros"]].map(([k,l])=>(<div key={k}><label className="text-xs text-gray-500 block mb-1">{l}</label><input type="number" min="0" step="0.01" className="w-full border border-gray-200 rounded-lg px-3 py-1.5 text-sm" value={pagosImp[k]||""} onChange={e=>setPagosImp({...pagosImp,[k]:parseFloat(e.target.value)||0})}/></div>))}
        </div>
        {totalPagos>0&&Math.abs(totalPagos-totalImporte)>1&&<div className="bg-orange-50 border border-orange-200 rounded-xl p-2 mb-3 text-xs text-orange-800">Formas de pago ({fmt(totalPagos)}) no cuadran con el importe del reporte ({fmt(totalImporte)}). Puedes continuar, pero revisa el corte.</div>}
        {parsed.error&&<div className="bg-red-50 border border-red-200 rounded-xl p-2 mb-3 text-xs text-red-800">{parsed.error}</div>}
        {parsed.rows.length>0&&<div className="mb-3">
          <div className="flex gap-3 mb-2 flex-wrap">
            <Badge v="info">{parsed.rows.length} productos</Badge>
            <Badge v="success">{fmt(totalImporte)} vendidos</Badge>
            {nuevos>0&&<Badge v="warning">{nuevos} productos nuevos (se darán de alta)</Badge>}
            {sinReceta>0&&<Badge v="danger">{sinReceta} sin receta (no descuentan inventario)</Badge>}
          </div>
          <div className="bg-white border border-gray-200 rounded-xl overflow-hidden max-h-64 overflow-y-auto"><table className="w-full text-xs"><thead className="bg-gray-50 sticky top-0"><tr>{["Código SR","Producto","Cant","Importe","Estado","Receta","Costo teórico"].map(h=><th key={h} className={`px-2 py-1.5 font-semibold text-gray-600 uppercase ${["Cant","Importe","Costo teórico"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}</tr></thead><tbody>
            {parsed.rows.map((r,i)=>{const nRec=r.prodId?recetas.filter(x=>x.producto_venta_id===r.prodId).length:0;const cT=r.prodId?costoReceta(r.prodId,recetas,invSucursal,catalogo,productosVenta)*r.cantidad:0;return(<tr key={i} className="border-t border-gray-50">
              <td className="px-2 py-1 font-mono text-gray-500">{r.codigo||"—"}</td>
              <td className="px-2 py-1 font-medium text-gray-800">{r.nombre}</td>
              <td className="px-2 py-1 text-right">{r.cantidad}</td>
              <td className="px-2 py-1 text-right font-semibold">{fmt(r.importe)}</td>
              <td className="px-2 py-1">{r.prodId?<Badge v="success">ok</Badge>:<Badge v="warning">nuevo</Badge>}</td>
              <td className="px-2 py-1">{r.prodId?(nRec>0?<span className="text-teal-600 font-medium">{nRec} insumos</span>:<span className="text-red-500">sin receta</span>):<span className="text-gray-400">—</span>}</td>
              <td className="px-2 py-1 text-right text-gray-600">{cT>0?fmt(cT):"—"}</td>
            </tr>);})}
          </tbody></table></div>
        </div>}
        <Btn onClick={handleImport} disabled={parsed.rows.length===0||importing} color="green">{importing?"Importando...":`Importar ${parsed.rows.length} productos (${fmt(totalImporte)})`}</Btn>
      </div>
    </div>}

    {/* HISTORIAL */}
    {tab==="historial"&&<div>
      {ventasSorted.length===0?<div className="bg-white border border-gray-200 rounded-xl p-8 text-center"><p className="text-gray-400">Sin ventas importadas aún</p><Btn onClick={()=>setTab("importar")}>Importar primer reporte</Btn></div>
      :<div className="bg-white border border-gray-200 rounded-xl overflow-hidden"><table className="w-full text-sm"><thead className="bg-gray-50"><tr>
        {["Fecha","Folio","Canal","Venta total","Costo teórico","Utilidad","Food cost",""].map(h=><th key={h} className={`px-3 py-2.5 font-semibold text-gray-600 text-xs uppercase ${["Venta total","Costo teórico","Utilidad","Food cost"].includes(h)?"text-right":"text-left"}`}>{h}</th>)}
      </tr></thead><tbody>{ventasSorted.map(v=>{
        const cT=parseFloat(v.costo_teorico)||0;const sub=parseFloat(v.subtotal)||0;const util=sub-cT;const fc=sub>0?cT/sub*100:0;
        return(<React.Fragment key={v.id}><tr className={`border-t border-gray-100 ${selVenta===v.id?"bg-lime-50":"hover:bg-gray-50"}`}>
          <td className="px-3 py-2 text-gray-600">{new Date(v.fecha+"T12:00:00").toLocaleDateString("es-MX")}</td>
          <td className="px-3 py-2 font-mono text-xs text-gray-500">{v.folio}</td>
          <td className="px-3 py-2"><Badge v={canalBadge(v.canal)}>{v.canal}</Badge></td>
          <td className="px-3 py-2 text-right font-bold text-gray-800">{fmt(v.total)}</td>
          <td className="px-3 py-2 text-right text-gray-600">{fmt(cT)}</td>
          <td className="px-3 py-2 text-right font-semibold text-emerald-600">{fmt(util)}</td>
          <td className="px-3 py-2 text-right"><Badge v={fc>40?"danger":fc>32?"warning":"success"}>{fc.toFixed(0)}%</Badge></td>
          <td className="px-3 py-2 text-right"><button onClick={()=>setSelVenta(selVenta===v.id?null:v.id)} className="text-xs text-amber-700 hover:bg-amber-50 px-2 py-1 rounded">{selVenta===v.id?"Cerrar":"Ver detalle"}</button></td>
        </tr>
        {selVenta===v.id&&<tr><td colSpan="8" className="bg-lime-50/50 px-4 py-3">
          <table className="w-full text-xs"><thead><tr>{["Producto","Cant","Precio","Importe","Costo teórico"].map(h=><th key={h} className={`px-2 py-1 font-medium text-gray-500 ${h!=="Producto"?"text-right":"text-left"}`}>{h}</th>)}</tr></thead><tbody>
          {ventaDetalle.filter(d=>d.venta_id===v.id).map(d=>{const prod=productosVenta.find(p=>p.id===d.producto_venta_id);return(<tr key={d.id} className="border-t border-lime-100"><td className="px-2 py-1 font-medium text-gray-800">{prod?.nombre||"?"}</td><td className="px-2 py-1 text-right">{d.cantidad}</td><td className="px-2 py-1 text-right">{fmt(d.precio_unitario)}</td><td className="px-2 py-1 text-right font-semibold">{fmt(d.importe)}</td><td className="px-2 py-1 text-right text-gray-600">{fmt(d.costo_teorico)}</td></tr>);})}
          </tbody></table>
          <div className="flex gap-4 mt-2 text-xs text-gray-600 flex-wrap">{parseFloat(v.total_efectivo)>0&&<span>Efectivo: <b>{fmt(v.total_efectivo)}</b></span>}{parseFloat(v.total_tarjeta)>0&&<span>Tarjeta: <b>{fmt(v.total_tarjeta)}</b></span>}{parseFloat(v.total_plataforma)>0&&<span>Plataformas: <b>{fmt(v.total_plataforma)}</b></span>}{parseFloat(v.total_otros)>0&&<span>Otros: <b>{fmt(v.total_otros)}</b></span>}</div>
        </td></tr>}
        </React.Fragment>);})}</tbody></table></div>}
    </div>}

    {/* PRODUCTOS Y RECETAS */}
    {tab==="productos"&&<div>
      <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div className="flex gap-1">
          <button onClick={()=>setVerTipo("platillos")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${verTipo==="platillos"?"bg-gray-800 text-white":"bg-white border border-gray-200 text-gray-500 hover:text-gray-700"}`}>Platillos ({productosVenta.filter(p=>!p.es_preparacion).length})</button>
          <button onClick={()=>setVerTipo("preparaciones")} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${verTipo==="preparaciones"?"bg-gray-800 text-white":"bg-white border border-gray-200 text-gray-500 hover:text-gray-700"}`}>Preparaciones ({productosVenta.filter(p=>p.es_preparacion).length})</button>
        </div>
        {verTipo==="platillos"&&!addingProd&&<Btn onClick={()=>setAddingProd(true)} color="green">+ Nuevo producto</Btn>}

// ======================== DASHBOARD DE VENTAS (v7.4) ========================
// Paleta validada (validate_palette: PASS en superficie blanca). El ámbar de
// marca queda bajo 3:1 de contraste, por eso TODA barra ámbar lleva etiqueta
// visible con su valor (regla de relieve). Los colores siguen a la entidad:
// mostrador/efectivo=teal, plataforma=ámbar, tarjeta=azul, otros=gris.
const DV={teal:"#0e918b",ambar:"#e2a52a",terracota:"#bb4430",azul:"#2a78d6",gris:"#898781",apagado:"#c9c8c1",grid:"#e1e0d9"};
function VentasDashboardView({ventas,ventaDetalle,productosVenta,gastosOp}){
  const [periodo,setPeriodo]=useState("hoy");
  const num=(x)=>parseFloat(x)||0;
  const dLocal=(x)=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
  const hoyD=new Date();const hoy=dLocal(hoyD);
  const addDias=(f,n)=>{const x=new Date(f+"T12:00:00");x.setDate(x.getDate()+n);return dLocal(x);};
  const finDeMes=(ym)=>{const[a,m]=ym.split("-").map(Number);return dLocal(new Date(a,m,0));};
  const mesActual=hoy.slice(0,7);
  const mesRel=(n)=>{const x=new Date(hoyD.getFullYear(),hoyD.getMonth()+n,15);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`;};
  const PERIODOS=[{id:"hoy",l:"Hoy"},{id:"ayer",l:"Ayer"},{id:"7d",l:"Últimos 7 días"},{id:"mes",l:"Mes actual"},{id:"mes_pasado",l:"Mes pasado"}];
  const rango=(p)=>{
    if(p==="hoy")return[hoy,hoy];
    if(p==="ayer"){const a=addDias(hoy,-1);return[a,a];}
    if(p==="7d")return[addDias(hoy,-6),hoy];
    if(p==="mes")return[mesActual+"-01",hoy];
    const m=mesRel(-1);return[m+"-01",finDeMes(m)];
  };
  const rangoPrev=(p)=>{
    if(p==="hoy"){const a=addDias(hoy,-1);return[a,a];}
    if(p==="ayer"){const a=addDias(hoy,-2);return[a,a];}
    if(p==="7d")return[addDias(hoy,-13),addDias(hoy,-7)];
    if(p==="mes"){const m=mesRel(-1);return[m+"-01",finDeMes(m)];}
    const m=mesRel(-2);return[m+"-01",finDeMes(m)];
  };
  const [desde,hasta]=rango(periodo);
  const [dPrev,hPrev]=rangoPrev(periodo);
  const vSel=ventas.filter(v=>v.fecha>=desde&&v.fecha<=hasta);
  const vPrev=ventas.filter(v=>v.fecha>=dPrev&&v.fecha<=hPrev);
  const sum=(arr,f)=>arr.reduce((s,v)=>s+f(v),0);
  const venta=sum(vSel,v=>num(v.total)),ventaPrev=sum(vPrev,v=>num(v.total));
  const iva=sum(vSel,v=>num(v.iva)),subtotal=sum(vSel,v=>num(v.subtotal));
  const costoMP=sum(vSel,v=>num(v.costo_teorico));
  const utilidad=venta-costoMP;
  const fp={efectivo:sum(vSel,v=>num(v.total_efectivo)),tarjeta:sum(vSel,v=>num(v.total_tarjeta)),plataforma:sum(vSel,v=>num(v.total_plataforma)),otros:sum(vSel,v=>num(v.total_otros))};
  const mixFisica=sum(vSel.filter(v=>(v.canal||"mostrador")==="mostrador"),v=>num(v.total));
  const mixPlat=venta-mixFisica;
  const tkFisica=vSel.filter(v=>(v.canal||"mostrador")==="mostrador").length;
  const gastosSel=gastosOp.filter(g=>g.fecha>=desde&&g.fecha<=hasta);
  const gastos=sum(gastosSel,g=>num(g.monto));
  const delta=ventaPrev>0?((venta-ventaPrev)/ventaPrev)*100:null;
  const lblPrev={hoy:"vs ayer",ayer:"vs antier","7d":"vs 7 días previos",mes:"vs mes pasado",mes_pasado:"vs mes antepasado"}[periodo];
  // Cobertura de recetas: qué % del importe vendido tiene costo de MP capturado
  const idsSel=new Set(vSel.map(v=>v.id));
  const detSel=ventaDetalle.filter(d=>idsSel.has(d.venta_id));
  const impTotal=sum(detSel,d=>num(d.importe));
  const impConCosto=sum(detSel.filter(d=>num(d.costo_teorico)>0),d=>num(d.importe));
  const cobertura=impTotal>0?Math.min(100,(impConCosto/impTotal)*100):0;
  // Serie diaria: el periodo seleccionado; para Hoy/Ayer se muestran los últimos 7 días con el día elegido resaltado (énfasis)
  const unDia=desde===hasta;
  const serieIni=unDia?addDias(hasta,-6):desde,serieFin=unDia?(periodo==="hoy"?hoy:addDias(hoy,-1)):hasta;
  const dias=[];for(let f=serieIni;f<=serieFin&&dias.length<62;f=addDias(f,1))dias.push(f);
  const porDia=dias.map(f=>({f,total:sum(ventas.filter(v=>v.fecha===f),v=>num(v.total))}));
  const maxDia=Math.max(1,...porDia.map(d=>d.total));
  const etiquetaDia=(f)=>{const x=new Date(f+"T12:00:00");return `${["dom","lun","mar","mié","jue","vie","sáb"][x.getDay()]} ${x.getDate()}`;};
  // Venta por grupo del menú (grupo_sr viene de SoftRestaurant vía el conector)
  const [grupoSel,setGrupoSel]=useState("todos");
  const porGrupoMap={};detSel.forEach(d=>{const p=productosVenta.find(x=>x.id===d.producto_venta_id);const g=p?.grupo_sr||"Sin grupo";if(!porGrupoMap[g])porGrupoMap[g]=0;porGrupoMap[g]+=num(d.importe);});
  let porGrupo=Object.entries(porGrupoMap).map(([g,imp])=>({g,imp})).sort((a,b)=>b.imp-a.imp);
  if(porGrupo.length>8){const otros=porGrupo.slice(8).reduce((s,x)=>s+x.imp,0);porGrupo=[...porGrupo.slice(0,8),{g:`Otros (${Object.keys(porGrupoMap).length-8} grupos)`,imp:otros}];}
  const maxGrupo=Math.max(1,...porGrupo.map(x=>x.imp));
  const gruposDisp=Object.keys(porGrupoMap).sort();
  // Top productos del periodo (filtrable por grupo)
  const porProd={};detSel.forEach(d=>{const p=productosVenta.find(x=>x.id===d.producto_venta_id);const g=p?.grupo_sr||"Sin grupo";if(grupoSel!=="todos"&&g!==grupoSel)return;const k=d.producto_venta_id;if(!porProd[k])porProd[k]={imp:0,cant:0,nombre:p?.nombre||"(producto)",grupo:g};porProd[k].imp+=num(d.importe);porProd[k].cant+=num(d.cantidad);});
  const top=Object.values(porProd).sort((a,b)=>b.imp-a.imp).slice(0,10);
  const maxTop=Math.max(1,...top.map(t=>t.imp));
  const pct=(x,t)=>t>0?`${Math.round((x/t)*100)}%`:"0%";
  const Kpi=({titulo,valor,sub,color})=><div className="bg-white border border-gray-200 rounded-xl p-4"><p className="text-xs text-gray-500">{titulo}</p><p className="text-2xl font-bold mt-1" style={color?{color}:{color:"#0b0b0b"}}>{valor}</p>{sub&&<p className="text-xs text-gray-400 mt-1">{sub}</p>}</div>;
  const rangoTxt=desde===hasta?etiquetaDia(desde):`${etiquetaDia(desde)} — ${etiquetaDia(hasta)}`;
  // v7.14: el conector se cayó el 29-jul y nadie lo notó en 3 días porque su
  // única señal de vida es una consola en la PC del POS. Este aviso vigila la
  // última venta recibida por el conector y grita cuando se queda callado.
  const ultimaApi=ventas.filter(v=>v.origen==="api").reduce((m,v)=>(v.created_at&&v.created_at>m?v.created_at:m),"");
  const horasSinConector=ultimaApi?(Date.now()-new Date(ultimaApi).getTime())/3600000:null;
  const conectorMudo=horasSinConector!=null&&horasSinConector>=6;
  return(<div>
    {conectorMudo&&<div className="bg-red-50 border border-red-300 rounded-xl p-4 mb-4">
      <p className="text-sm font-bold text-red-800">⚠️ El conector de SoftRestaurant no ha subido ventas en {horasSinConector>=48?`${Math.floor(horasSinConector/24)} días`:`${Math.floor(horasSinConector)} horas`}</p>
      <p className="text-xs text-red-700 mt-1">Última venta recibida: {new Date(ultimaApi).toLocaleString("es-MX")}. Revisa que la ventana del Conector FitTaste siga abierta en la computadora del punto de venta. Los tickets no se pierden: al reiniciarlo recupera todo lo pendiente desde el último corte.</p>
    </div>}
    <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
      <div><h2 className="text-lg font-bold text-gray-800">Dashboard de ventas</h2><p className="text-xs text-gray-400">{rangoTxt} · {vSel.length} tickets</p></div>
      <div className="flex gap-1 flex-wrap">{PERIODOS.map(p=><button key={p.id} onClick={()=>setPeriodo(p.id)} className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${periodo===p.id?"text-white":"text-gray-500 hover:text-gray-700 bg-white border border-gray-200"}`} style={periodo===p.id?{background:"#2D2D2D"}:{}}>{p.l}</button>)}</div>
    </div>
    {vSel.length===0?<div className="bg-white border border-gray-200 rounded-xl p-8 text-center"><p className="text-gray-400">Sin ventas en este periodo</p><p className="text-xs text-gray-400 mt-1">El conector sube tickets de SoftRestaurant cada 2 minutos.</p></div>:<React.Fragment>
    {/* KPIs de venta */}
    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
      <div className="bg-white border border-gray-200 rounded-xl p-4"><p className="text-xs text-gray-500">Venta total (con IVA)</p><p className="text-3xl font-bold mt-1 text-gray-900">{fmt(venta)}</p>{delta!=null&&<p className={`text-xs mt-1 font-semibold ${delta>=0?"":"text-red-700"}`} style={delta>=0?{color:"#006300"}:{}}>{delta>=0?"▲":"▼"} {Math.abs(delta).toFixed(1)}% {lblPrev} ({fmt(ventaPrev)})</p>}</div>
      <Kpi titulo="Tickets" valor={vSel.length.toLocaleString("es-MX")} sub={`ticket promedio ${fmt(vSel.length?venta/vSel.length:0)}`}/>
      <Kpi titulo="Venta sin IVA" valor={fmt(subtotal)} sub="base gravable"/>
      <Kpi titulo="IVA cobrado" valor={fmt(iva)} sub="incluido en la venta total"/>
    </div>
    {/* KPIs de rentabilidad */}
    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      <Kpi titulo="Costo materia prima (teórico)" valor={fmt(costoMP)} sub={`recetas cubren ${cobertura.toFixed(0)}% de la venta`} color={DV.terracota}/>
      <Kpi titulo="Utilidad bruta" valor={fmt(utilidad)} sub={`margen ${pct(utilidad,venta)} — sin considerar gastos`} color="#006300"/>
      <Kpi titulo={periodo==="hoy"?"Gastos del día":"Gastos del periodo"} valor={fmt(gastos)} sub={`${gastosSel.length} registro(s) de gasto`}/>
      <Kpi titulo="Utilidad después de gastos" valor={fmt(utilidad-gastos)} sub="utilidad bruta − gastos"/>
    </div>
    {cobertura<90&&<div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-2 mb-4 text-xs text-amber-800">⚠ El costo de materia prima solo cubre el {cobertura.toFixed(0)}% de la venta: faltan recetas por capturar (Ventas → Ventas SR → Productos y recetas). La utilidad bruta real es menor a la mostrada.</div>}
    {/* Venta por día */}
    <div className="bg-white border border-gray-200 rounded-xl p-4 mb-4">
      <div className="flex items-baseline justify-between"><h3 className="text-sm font-bold text-gray-700">Venta por día</h3><p className="text-xs text-gray-400">{unDia?"últimos 7 días (día seleccionado resaltado)":"periodo seleccionado"}</p></div>
      <div className="flex items-end gap-1 mt-3" style={{height:"9.5rem"}}>
        {porDia.map(d=>{const sel=!unDia||d.f===desde;const h=Math.max(d.total>0?3:1,(d.total/maxDia)*100);
          return<div key={d.f} className="flex-1 flex flex-col items-center justify-end h-full min-w-0 group" title={`${etiquetaDia(d.f)}: ${fmt(d.total)}`}>
            {porDia.length<=14&&d.total>0&&<span className={`text-[10px] mb-0.5 ${sel?"text-gray-600":"text-gray-300"} group-hover:font-bold truncate max-w-full`}>{`$${Math.round(d.total/100)/10}k`}</span>}
            <div className="w-full group-hover:opacity-80" style={{height:`${h}%`,background:sel?DV.teal:DV.apagado,borderRadius:"4px 4px 0 0",maxWidth:34,margin:"0 auto"}}/>
          </div>;})}
      </div>
      <div className="flex gap-1 mt-1 border-t pt-1" style={{borderColor:DV.grid}}>{porDia.map((d,i)=>{const paso=Math.ceil(porDia.length/14);return<div key={d.f} className="flex-1 text-center text-[10px] text-gray-400 truncate min-w-0">{i%paso===0?etiquetaDia(d.f):""}</div>;})}</div>
    </div>
    <div className="grid md:grid-cols-2 gap-4 mb-4">
      {/* Mix física vs plataforma */}
      <div className="bg-white border border-gray-200 rounded-xl p-4">
        <h3 className="text-sm font-bold text-gray-700">Mix de venta: local vs plataforma</h3>
        <div className="flex w-full h-8 mt-3 rounded overflow-hidden" style={{gap:2,background:"#fff"}}>
          {mixFisica>0&&<div style={{width:`${(mixFisica/venta)*100}%`,background:DV.teal,borderRadius:4}} title={`Local (mostrador): ${fmt(mixFisica)}`}/>}
          {mixPlat>0&&<div style={{width:`${(mixPlat/venta)*100}%`,background:DV.ambar,borderRadius:4}} title={`Plataforma: ${fmt(mixPlat)}`}/>}
        </div>
        <div className="flex justify-between mt-2 text-xs flex-wrap gap-2">
          <span className="text-gray-600"><span className="inline-block w-2.5 h-2.5 rounded-sm mr-1 align-middle" style={{background:DV.teal}}/>Local: <b>{fmt(mixFisica)}</b> ({pct(mixFisica,venta)}) · {tkFisica} tickets</span>
          <span className="text-gray-600"><span className="inline-block w-2.5 h-2.5 rounded-sm mr-1 align-middle" style={{background:DV.ambar}}/>Plataforma: <b>{fmt(mixPlat)}</b> ({pct(mixPlat,venta)}) · {vSel.length-tkFisica} tickets</span>
        </div>
      </div>
      {/* Formas de pago */}
      <div className="bg-white border border-gray-200 rounded-xl p-4">
        <h3 className="text-sm font-bold text-gray-700">Formas de pago</h3>
        <div className="mt-3 space-y-2">
          {[["Efectivo",fp.efectivo,DV.teal],["Tarjeta",fp.tarjeta,DV.azul],["Plataforma",fp.plataforma,DV.ambar],["Otros",fp.otros,DV.gris]].filter(r=>r[1]>0.005).map(([l,v,c])=>
            <div key={l} className="flex items-center gap-2" title={`${l}: ${fmt(v)}`}>
              <span className="text-xs text-gray-500 w-20 shrink-0">{l}</span>
              <div className="flex-1 h-4 rounded" style={{background:"#f4f4f2"}}><div className="h-4 rounded" style={{width:`${Math.max(1,(v/Math.max(...Object.values(fp),1))*100)}%`,background:c}}/></div>
              <span className="text-xs text-gray-700 font-semibold w-24 text-right shrink-0">{fmt(v)}</span>
              <span className="text-[10px] text-gray-400 w-9 text-right shrink-0">{pct(v,venta)}</span>
            </div>)}
        </div>
      </div>
    </div>
    {/* Venta por grupo del menú */}
    {porGrupo.length>1&&<div className="bg-white border border-gray-200 rounded-xl p-4 mb-4">
      <div className="flex items-baseline justify-between"><h3 className="text-sm font-bold text-gray-700">Venta por grupo del menú</h3><p className="text-xs text-gray-400">grupos de SoftRestaurant — platillos vs adicionales</p></div>
      <div className="mt-3 space-y-1.5">
        {porGrupo.map((x,i)=><div key={i} className="flex items-center gap-2" title={`${x.g}: ${fmt(x.imp)}`}>
          <span className="text-xs text-gray-700 w-56 truncate shrink-0" title={x.g}>{x.g}</span>
          <div className="flex-1 h-4 rounded" style={{background:"#f4f4f2"}}><div className="h-4 rounded" style={{width:`${Math.max(1,(x.imp/maxGrupo)*100)}%`,background:DV.teal}}/></div>
          <span className="text-xs font-semibold text-gray-700 w-24 text-right shrink-0">{fmt(x.imp)}</span>
          <span className="text-[10px] text-gray-400 w-9 text-right shrink-0">{pct(x.imp,venta)}</span>
        </div>)}
      </div>
    </div>}
    {/* Top productos */}
    <div className="bg-white border border-gray-200 rounded-xl p-4 mb-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h3 className="text-sm font-bold text-gray-700">Top 10 productos del periodo (por venta)</h3>
        {gruposDisp.length>1&&<select className="border border-gray-200 rounded-lg px-2 py-1 text-xs text-gray-600" value={grupoSel} onChange={e=>setGrupoSel(e.target.value)}>
          <option value="todos">Todos los grupos</option>
          {gruposDisp.map(g=><option key={g} value={g}>{g}</option>)}
        </select>}
      </div>
      {top.length===0?<p className="text-xs text-gray-400 mt-2">Sin detalle de productos en el periodo.</p>:<div className="mt-3 space-y-1.5">
        {top.map((t,i)=><div key={i} className="flex items-center gap-2" title={`${t.nombre} (${t.grupo}): ${fmt(t.imp)} · ${t.cant.toLocaleString("es-MX")} uds`}>
          <span className="text-xs text-gray-400 w-4 shrink-0 text-right">{i+1}</span>
          <span className="text-xs text-gray-700 w-56 truncate shrink-0" title={`${t.nombre} — ${t.grupo}`}>{t.nombre}</span>
          <div className="flex-1 h-4 rounded" style={{background:"#f4f4f2"}}><div className="h-4 rounded" style={{width:`${Math.max(1,(t.imp/maxTop)*100)}%`,background:DV.teal}}/></div>
          <span className="text-xs font-semibold text-gray-700 w-24 text-right shrink-0">{fmt(t.imp)}</span>
          <span className="text-[10px] text-gray-400 w-14 text-right shrink-0">{t.cant.toLocaleString("es-MX",{maximumFractionDigits:1})} uds</span>
        </div>)}
      </div>}
    </div>
    <p className="text-[11px] text-gray-400 mb-2">Fuente: tickets de SoftRestaurant vía conector (cada 2 min). El costo de materia prima es teórico: sale de las recetas capturadas por producto. Los gastos vienen del módulo Finanzas → Gastos.</p>
    </React.Fragment>}
  </div>);
}

// ======================== INVENTARIO SUCURSAL + MERMA (v7.0) ========================
function SucursalInvView({invSucursal,setInvSucursal,movSucursal,setMovSucursal,mermas,setMermas,catalogo,insumos,sucursales,rol}){
  const [tab,setTab]=useState("inventario");
  const sucId=sucursales[0]?.id||null;
  const [adding,setAdding]=useState(false);
  const [newRow,setNewRow]=useState({insumo_id:"",existencia:0,costo:0,minimo:0});
  const [ajustando,setAjustando]=useState(null);
  const [ajusteVal,setAjusteVal]=useState(0);
  const [ajusteNota,setAjusteNota]=useState("");
  const [fMerma,setFMerma]=useState({insumo_id:"",cantidad:0,motivo:"caducidad",nota:""});
  const [saving,setSaving]=useState(false);
  // v7.7: hoja de conteo físico
  const [conteo,setConteo]=useState({});        // insumo_id -> físico (texto)
  const [conteoNota,setConteoNota]=useState("");
  const [conteoBusq,setConteoBusq]=useState("");
  const [soloDif,setSoloDif]=useState(false);
  const [cerrando,setCerrando]=useState(false);
  const [resConteo,setResConteo]=useState(null);
  const nrm=(s)=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();

  const rows=invSucursal.filter(i=>!sucId||i.sucursal_id===sucId).map(i=>({...i,ins:insumos.find(x=>x.id===i.insumo_id)||{}})).sort((a,b)=>(a.ins.nombre||"").localeCompare(b.ins.nombre||""));
  const valor=rows.reduce((s,i)=>s+Math.max(0,parseFloat(i.existencia)||0)*costoInsumo(i.insumo_id,invSucursal,catalogo),0);
  const hoy=new Date();const mesInicio=new Date(hoy.getFullYear(),hoy.getMonth(),1).toISOString().split("T")[0];
  const mermaMes=mermas.filter(m=>(m.fecha||"")>=mesInicio).reduce((s,m)=>s+parseFloat(m.costo_total||0),0);
  const disponibles=insumos.filter(x=>x.tipo_control==="inventariable"&&!rows.some(r=>r.insumo_id===x.id));

  const addInsumo=async()=>{
    if(!sucId){alert("No hay sucursal registrada");return;}
    if(!newRow.insumo_id)return;
    setSaving(true);
    const costo=newRow.costo>0?newRow.costo:costoInsumo(newRow.insumo_id,invSucursal,catalogo);
    const res=await sbPost("inventario_sucursal",{sucursal_id:sucId,insumo_id:newRow.insumo_id,existencia:newRow.existencia||0,costo_promedio:costo,minimo_stock:newRow.minimo||0});
    if(res&&res[0]){
      setInvSucursal([...invSucursal,res[0]]);
      if((newRow.existencia||0)>0){const mv=await sbPost("movimientos_sucursal",{sucursal_id:sucId,insumo_id:newRow.insumo_id,tipo:"entrada_ajuste",cantidad:newRow.existencia,costo_unitario:costo,fecha:new Date().toISOString().split("T")[0],nota:"Inventario inicial",registrado_por:rol});if(mv&&mv[0])setMovSucursal(prev=>[...prev,mv[0]]);}
      setNewRow({insumo_id:"",existencia:0,costo:0,minimo:0});setAdding(false);
    }else alert("Error (¿el insumo ya está en inventario de sucursal?)");
    setSaving(false);
  };

  const confirmarAjuste=async(row)=>{
    const actual=parseFloat(row.existencia)||0;
    const diff=Math.round((ajusteVal-actual)*1000)/1000;
    if(diff===0){setAjustando(null);return;}
    setSaving(true);
    const costo=costoInsumo(row.insumo_id,invSucursal,catalogo);
    const mv=await sbPost("movimientos_sucursal",{sucursal_id:row.sucursal_id,insumo_id:row.insumo_id,tipo:diff>0?"entrada_ajuste":"salida_ajuste",cantidad:Math.abs(diff),costo_unitario:costo,fecha:new Date().toISOString().split("T")[0],nota:ajusteNota||"Ajuste por conteo físico",registrado_por:rol});
    if(mv&&mv[0])setMovSucursal(prev=>[...prev,mv[0]]);
    await sbPatch("inventario_sucursal",row.id,{existencia:ajusteVal,updated_at:new Date().toISOString()});
    setInvSucursal(invSucursal.map(i=>i.id===row.id?{...i,existencia:ajusteVal}:i));
    setAjustando(null);setAjusteNota("");setSaving(false);
  };

  // v7.7: cerrar la hoja de conteo. Para cada insumo con físico capturado que
  // difiera del teórico, registra un movimiento de ajuste (entrada=sobrante,
  // salida=faltante) y actualiza la existencia. Los faltantes alimentan la
  // línea de "Mermas del mes" en el estado de resultados. Los renglones en
  // blanco se omiten (no se contaron). Todo con un mismo folio de conteo.
  const cerrarConteo=async()=>{
    if(cerrando)return;
    const cambios=rows.map(r=>{
      const txt=conteo[r.insumo_id];
      if(txt==null||txt==="")return null;                 // no contado
      const fisico=parseFloat(txt);if(isNaN(fisico)||fisico<0)return null;
      const teorico=parseFloat(r.existencia)||0;
      const diff=Math.round((fisico-teorico)*1000)/1000;
      if(diff===0)return null;                             // contado, sin diferencia
      return {row:r,fisico,teorico,diff,costo:costoInsumo(r.insumo_id,invSucursal,catalogo)};
    }).filter(Boolean);
    if(cambios.length===0){alert("No hay diferencias que registrar. Captura el conteo físico de al menos un insumo.");return;}
    setCerrando(true);
    const fecha=new Date().toISOString().split("T")[0];
    const ymd=fecha.replace(/-/g,"");
    const nHoy=movSucursal.filter(m=>(m.nota||"").startsWith(`CONT-${ymd}`)).map(m=>parseInt((m.nota.match(/CONT-\d{8}-(\d+)/)||[])[1]||0)).reduce((a,b)=>Math.max(a,b),0);
    const folio=`CONT-${ymd}-${String(nHoy+1).padStart(2,"0")}`;
    const nota=`${folio}${conteoNota?" · "+conteoNota:""}`;
    let invLocal=[...invSucursal];const nuevosMov=[];
    let faltante=0,sobrante=0;
    for(const c of cambios){
      const mv=await sbPost("movimientos_sucursal",{sucursal_id:c.row.sucursal_id,insumo_id:c.row.insumo_id,tipo:c.diff>0?"entrada_ajuste":"salida_ajuste",cantidad:Math.abs(c.diff),costo_unitario:c.costo,fecha,nota,registrado_por:rol});
      if(mv&&mv[0])nuevosMov.push(mv[0]);
      await sbPatch("inventario_sucursal",c.row.id,{existencia:c.fisico,updated_at:new Date().toISOString()});
      invLocal=invLocal.map(i=>i.id===c.row.id?{...i,existencia:c.fisico}:i);
      const val=Math.abs(c.diff)*c.costo;
      if(c.diff<0)faltante+=val;else sobrante+=val;
    }
    setInvSucursal(invLocal);
    if(nuevosMov.length)setMovSucursal(prev=>[...prev,...nuevosMov]);
    setResConteo({folio,fecha,items:cambios.length,faltante:Math.round(faltante*100)/100,sobrante:Math.round(sobrante*100)/100,neto:Math.round((faltante-sobrante)*100)/100,detalle:cambios});
    setConteo({});setConteoNota("");setSoloDif(false);setConteoBusq("");
    setCerrando(false);
  };

  const registrarMerma=async()=>{
    if(!fMerma.insumo_id||fMerma.cantidad<=0||saving)return;
    setSaving(true);
    const row=rows.find(r=>r.insumo_id===fMerma.insumo_id);
    const costo=costoInsumo(fMerma.insumo_id,invSucursal,catalogo);
    const costoTotal=Math.round(fMerma.cantidad*costo*100)/100;
    const res=await sbPost("mermas",{sucursal_id:sucId,insumo_id:fMerma.insumo_id,cantidad:fMerma.cantidad,motivo:fMerma.motivo,costo_unitario:costo,costo_total:costoTotal,fecha:new Date().toISOString().split("T")[0],nota:fMerma.nota||null,registrado_por:rol});
    if(res&&res[0]){
      setMermas([res[0],...mermas]);
      const mv=await sbPost("movimientos_sucursal",{sucursal_id:sucId,insumo_id:fMerma.insumo_id,tipo:"salida_merma",cantidad:fMerma.cantidad,costo_unitario:costo,merma_id:res[0].id,fecha:new Date().toISOString().split("T")[0],nota:`Merma: ${fMerma.motivo}`,registrado_por:rol});
      if(mv&&mv[0])setMovSucursal(prev=>[...prev,mv[0]]);
      if(row){const nueva=(parseFloat(row.existencia)||0)-fMerma.cantidad;await sbPatch("inventario_sucursal",row.id,{existencia:nueva,updated_at:new Date().toISOString()});setInvSucursal(invSucursal.map(i=>i.id===row.id?{...i,existencia:nueva}:i));}
      setFMerma({insumo_id:"",cantidad:0,motivo:"caducidad",nota:""});
      alert(`Merma registrada — ${fmt(costoTotal)} de pérdida`);
    }else alert("Error al registrar merma");
    setSaving(false);
  };

  const motivoBadge=(m)=>({caducidad:"warning",dano:"danger",produccion:"info",robo:"danger",ajuste_inventario:"default"})[m]||"default";
  const movsSorted=movSucursal.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,40);

  // v7.7: renglones de la hoja de conteo (con filtro y cálculo en vivo)
  const conteoRows=rows.filter(r=>!conteoBusq||nrm(r.ins.nombre).includes(nrm(conteoBusq))).map(r=>{
    const teorico=parseFloat(r.existencia)||0;
    const costo=costoInsumo(r.insumo_id,invSucursal,catalogo);
    const txt=conteo[r.insumo_id];
    const contado=txt!=null&&txt!=="";
    const fisico=contado?parseFloat(txt):null;
    const valido=contado&&!isNaN(fisico)&&fisico>=0;
    const diff=valido?Math.round((fisico-teorico)*1000)/1000:0;
    return {r,teorico,costo,txt,contado,fisico,valido,diff,diffVal:Math.round(diff*costo*100)/100};
  });
  const conteoVista=soloDif?conteoRows.filter(c=>c.valido&&c.diff!==0):conteoRows;
  const cCont=conteoRows.filter(c=>c.valido).length;
  const cDif=conteoRows.filter(c=>c.valido&&c.diff!==0).length;
  const cFaltante=conteoRows.filter(c=>c.valido&&c.diff<0).reduce((s,c)=>s+Math.abs(c.diffVal),0);
  const cSobrante=conteoRows.filter(c=>c.valido&&c.diff>0).reduce((s,c)=>s+c.diffVal,0);

  // v7.7: historial de conteos cerrados (agrupa movimientos por folio CONT-)
  const conteosPrev={};
  movSucursal.forEach(m=>{const f=(m.nota||"").match(/^(CONT-\d{8}-\d+)/);if(!f)return;const k=f[1];if(!conteosPrev[k])conteosPrev[k]={folio:k,fecha:m.fecha,items:0,faltante:0,sobrante:0};const g=conteosPrev[k];g.items++;const val=(parseFloat(m.cantidad)||0)*(parseFloat(m.costo_unitario)||0);if(m.tipo==="salida_ajuste")g.faltante+=val;else g.sobrante+=val;});
  const conteosHist=Object.values(conteosPrev).map(g=>({...g,neto:Math.round((g.faltante-g.sobrante)*100)/100})).sort((a,b)=>b.folio.localeCompare(a.folio));

  const tabsS=[{id:"inventario",l:`Inventario (${rows.length})`},{id:"conteo",l:"Hoja de conteo"},{id:"merma",l:"Registrar merma"},{id:"movimientos",l:"Movimientos"}];

  return(<div>
    <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
